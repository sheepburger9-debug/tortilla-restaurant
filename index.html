// ─ [JS-8] التسعير: baseUnitPrice وحساب سعر الوحدة والإضافات ورسوم الخدمة والطلب الصغير. لا تُغيّر منطقه دون اتفاق
  /* ═══════════════════════════════════════════════
     [JS] التسعير (تم التعديل لإضافة رسوم الخدمة والطلب الصغير للتصميم الجديد)
     ═══════════════════════════════════════════════ */
// • سعر الوحدة الأساسي
  const baseUnitPrice = line => {
    const it = ITEM[line.id]; if (!it) return 0;
    const sp = it.sizes.find(s => s.key === line.size)?.price ?? 0;
    const ap = line.addons.reduce((s, a) => s + (ADDONS[a] ? (ADDONS[a].sale > 0 && ADDONS[a].sale < ADDONS[a].price ? ADDONS[a].sale : ADDONS[a].price) : 0), 0);
    return round2(sp + ap);
  };

// • سعر الوحدة بعد الإضافات
  const unitPrice = (line, ctx = {}) => {
    const it = ITEM[line.id]; if (!it) return 0;
    const sp = it.sizes.find(s => s.key === line.size)?.price ?? 0;
    const ap = line.addons.reduce((s, a) => s + (ADDONS[a] ? (ADDONS[a].sale > 0 && ADDONS[a].sale < ADDONS[a].price ? ADDONS[a].sale : ADDONS[a].price) : 0), 0);
    const eff = it.sizes.find(s => s.key === line.size); let p = eff && eff.sale > 0 && eff.sale < eff.price ? eff.sale : sp;
    if (line.special?.type === 'free') p = 0;
    else if (line.special?.type === 'fixed') p = Math.min(sp, line.special.price);
    else if (line.special?.type === 'percent') p = sp * (1 - line.special.pct);
    else {
      const best = Math.max(ctx.coupon?.pct || 0, it.off || 0);
      if (best > 0) p = sp * (1 - best);
    }
    return round2(p + ap);
  };

// • الكوبون المختار
  const selectedRemoteVoucher = () => {

    return v;
  };
  
// ─ [JS-9] منطق السلة: lineKey وإضافة/تعديل/حذف السطور وحساب الإجمالي. يؤثر على شريط السلة العائم وعدّاد الهيدر
  /* ═══════════════════════════════════════════════
     [JS] السلة (الأصلي)
     ═══════════════════════════════════════════════ */
// • مفتاح فريد لسطر السلة
  const lineKey = line => JSON.stringify({
    id: line.id, size: line.size, spice: line.spice ?? '',
    addons: [...line.addons].sort(), note: (line.note || '').trim(),

  });

    scheduleCartSync();

  };

// • إضافة سطر للسلة
  const addLineToCart = (newLine) => {
    const key = lineKey(newLine);
    const existing = state.cart.find(l => lineKey(l) === key);
    if (existing) existing.qty = clamp(existing.qty + newLine.qty, 1, CONFIG.MAX_QTY);
    else state.cart.push({ ...newLine, uid: uid() });
    commitCart(); bumpIcon();
  };

// • إضافة سريعة بدون تخصيص

    if (!item || !item.sizes?.length) return false;
    if (!liveAddonGroupsReady) { toast('خيارات الإضافات لسه بتتحمّل. حاول بعد لحظات.'); return false; }
    const problem = addonGroupProblem(item.id, []);

      return false;
    }
    addLineToCart({ id: item.id, size: item.sizes[0].key, spice: item.spice ? 'وسط' : null, addons: [], note: '', qty: 1, special });
    return true;
  };

// • تغيير كمية سطر

// • مؤقت مزامنة السلة
  let cartSyncTimer = null;

  let cartSyncChain = Promise.resolve();
// • هل حُمّلت السلة من السيرفر
  let cartHydrated = false;
// • حالة المزامنة الجارية
  let customerSyncing = false;

  let CART_SPICE_LEVELS = [...SPICE_LEVELS];

// • ينتظر جاهزية المنيو
  const waitForMenu = async () => {

// • مفتاح إضافة
  const addonKeyForId = (id) => Object.keys(liveAddonIds).find(k => String(liveAddonIds[k]) === String(id)) || null;

// • تحويل صف السيرفر إلى سطر سلة
  const cartLineFromRow = (row) => {

    const addons = (Array.isArray(row.selected_addons) ? row.selected_addons : [])

      id: item.id, size: size.key, spice: row.spice_level || null, addons,

  // ─── مزامنة السلة: السيرفر هو المرجع عبر sync_customer_cart مع cart_revision ───

  let cartRevision = null;   // آخر revision قرأه أو كتبه هذا الجهاز
// • هل توجد تغييرات لم تُرسل
  let cartDirty = false;     // يوجد تعديل محلي لم يُرسل بعد
// • قناة Realtime للسلة
  let cartRealtime = null;

// • السطور المطلوب إرسالها للسيرفر
  const cartDesiredLines = () => {

    state.cart.map(cartRowFromLine).filter(Boolean).forEach(r => { if (!seen.has(r.client_line_key)) seen.set(r.client_line_key, r); });
    return [...seen.values()];
  };

  // كل الحقول تُرسل دائمًا لأن الدالة تستبدل قيم السلة كاملة
// • حمولة الإرسال للسيرفر
  const cartPayload = () => ({
    p_lines: cartDesiredLines(),
    p_coupon_code: state.selectedVoucherId ? null : (state.coupon?.code || null),
    p_voucher_id: state.selectedVoucherId || null,

// • يرسل السلة إلى السيرفر (sync_customer_cart)
  const pushServerCart = async () => {
    if (!customerAuthUser || !sbClient || !cartHydrated) return;
    const { data, error } = await sbClient.rpc('sync_customer_cart', cartPayload());
    if (error) {
      if (String(error.message || '').includes('CART_REVISION_CONFLICT')) {
        // تغيّرت السلة من جهاز آخر أثناء التعديل: نقرأ الحالة الحالية من السيرفر
        cartDirty = false;
        await hydrateServerCart({ force: true });
        toast('السلة اتحدثت من جهاز تاني.');
        return;
      }
      throw error;
    }
    cartRevision = Number(data?.cart_revision ?? cartRevision);
    cartDirty = false;
  };

// • يحمّل السلة من السيرفر
  const hydrateServerCart = async ({ force = false } = {}) => {
    if (!customerAuthUser || !sbClient) return;
    if (cartDirty && !force) return;
    const ready = await waitForMenu();
    if (!ready) return;
    const { data: cart, error } = await sbClient.from('customer_carts')
      .select('id,cart_revision,coupon_code,voucher_id,branch_id,zone_id,cart_notes').eq('user_id', customerAuthUser.id).maybeSingle();
    if (error) throw error;
    let serverLines = [];
    if (cart) {
      const { data: rows, error: rowsErr } = await sbClient.from('customer_cart_items')
        .select('item_id,size_id,quantity,selected_addons,spice_level,notes,client_line_key')
        .eq('cart_id', cart.id);
      if (rowsErr) throw rowsErr;
      serverLines = (rows || []).map(cartLineFromRow).filter(Boolean);
    }
    const localLines = [...new Map(state.cart.filter(l => ITEM[l.id]).map(l => [lineKey(l), { ...l, uid: uid() }])).values()];

    if (cart && (serverLines.length || !localLines.length)) {
      // السيرفر هو المرجع: كل جهاز يعرض نفس السلة ونفس الكوبون والملاحظات والمنطقة
      cartRevision = Number(cart.cart_revision) || 0;

      cartDirty = localLines.length > 0;

    }, 400);
  };

  // تحديث لحظي من أي جهاز آخر لنفس الحساب (RLS يضمن وصول بيانات هذا المستخدم فقط)
// • يبدأ الاستماع لتغييرات السلة
  const startCartRealtime = () => {
    if (!sbClient || !customerAuthUser || cartRealtime) return;
    cartRealtime = sbClient.channel(`customer-cart-${customerAuthUser.id}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'customer_carts', filter: `user_id=eq.${customerAuthUser.id}` }, payload => {
        const rev = Number(payload?.new?.cart_revision);
        if (Number.isFinite(rev) && rev === cartRevision) return;  // صدى تعديلنا نفسه

            .filter(Boolean).join(' · '),

// • يبدأ تتبع حالة الطلب
  const startTracking = () => {
    if (trackingTimer) return;
    trackingTimer = setInterval(async () => {
      let changed = false;
      const tracked = state.orders.filter(o => o.trackingToken && o.id && o.status < 3);
      for (const o of tracked) {
        try {
          const res = await fetch(`${SB_URL}/functions/v1/track-order`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
            body: JSON.stringify({ order_number: String(o.id), tracking_token: o.trackingToken })
          });
          if (!res.ok) continue;
          const payload = await res.json();
          const remote = payload.order || {};
          const statusMap = { pending: 0, confirmed: 1, preparing: 1, ready: 2, out_for_delivery: 2, delivered: 3, cancelled: 3 };
          const next = statusMap[String(remote.status)] ?? o.status;
          if (next !== o.status || remote.total != null) {
            o.status = next; o.remoteStatus = String(remote.status || o.remoteStatus || 'pending'); o.statusLabel = remote.status === 'cancelled' ? 'تم إلغاء الطلب' : null;
            o.total = Number(remote.total ?? o.total); o.subtotal = Number(remote.subtotal ?? o.subtotal);
            o.deliveryFee = Number(remote.delivery_fee ?? o.deliveryFee); o.discountTotal = Number(remote.discount_total ?? 0);
            o.remoteItems = payload.items || []; o.statusHistory = payload.history || [];
            const nextDriver = payload.driver && payload.driver.phone ? {
              name: String(payload.driver.full_name || 'مندوب التوصيل'),
              phone: String(payload.driver.phone)
            } : null;
            if (JSON.stringify(o.driver || null) !== JSON.stringify(nextDriver)) {
              o.driver = nextDriver;
              changed = true;
            }
            changed = true;
          }
        } catch (e) { console.warn('[Supabase] تعذر تحديث حالة الطلب'); }
      }
      if (changed) { safeSave(K('orders'), state.orders); if (currentRoute() === 'orders') refresh(); }
      if (!state.orders.some(o => o.status < 3 && o.trackingToken) && (!false || !state.orders.some(o => o.status < 3))) { clearInterval(trackingTimer); trackingTimer = null; }
    }, 12000);
  };

        if (tooManyAttempts) {

// • خيارات سطر السلة
  const lineOptions = (line) => {

    line.addons.forEach(a => parts.push('+ ' + (ADDONS[a]?.name || '')));
    if (line.special?.type === 'percent') parts.push(`خصم ${Math.round(line.special.pct * 100)}%`);
    if (line.special?.type === 'free') parts.push('مجاني');

// ─ [JS-16] بانرات الصفحة الرئيسية: BANNER_FIELDS وسلايدر homepage_banners من Supabase (ديناميكي، لا بيانات ثابتة)
  /* ═══════════════════════════════════════════════════════════════
     [BANNERS] homepage_banners — سلايدر ديناميكي من Supabase
     ═══════════════════════════════════════════════════════════════ */
// • الحقول المطلوبة من homepage_banners
  const BANNER_FIELDS = 'id,title_ar,subtitle_ar,image_url,mobile_image_url,button_text_ar,target_type,target_id,target_url,sort_order,display_seconds,is_active,starts_at,ends_at,promotion_id';
// • الحقول المطلوبة من homepage_announcements
  const ANNOUNCE_FIELDS = 'id,title_ar,message_ar,image_url,mobile_image_url,placement,background_color,text_color,accent_color,icon,target_type,target_id,target_url,sort_order,is_dismissible,is_active,starts_at,ends_at,promotion_id,updated_at';
// • مدة الشريحة
  const SLIDE_SECONDS = 5;   // قيمة احتياطية فقط عند غياب display_seconds
// • مدة الإيقاف بعد تفاعل المستخدم
  const PAUSE_AFTER_USER_MS = 8000;

// • بانرات الرئيسية
  let homeBanners = [];          // الشرائح المعروضة فعليًا
// • صفوف البانرات الخام
  let homeBannerRows = [];       // البانرات المفعّلة من homepage_banners
// • حالة السلايدر
  let homeBannersState = 'idle';        // idle | loading | ready | error
// • الشريحة الحالية
  let homeBannerIndex = 0;
// • مؤقت التبديل
  let homeBannerTimer = null;
// • مؤقت استئناف التبديل
  let homeBannerResumeTimer = null;
// • اللافتات
  let announcements = [];
// • حالة اللافتات
  let announcementsState = 'idle';

  // يتحقق من فترة العرض (starts_at / ends_at)
  // الجدولة (starts_at / ends_at) تُطبّق في الداتا بيز عبر الـ views من نوع active_*
// • هل ضمن جدول الظهور
  const isWithinSchedule = () => true;

  // يقبل فقط ألوان hex لمنع حقن CSS من بيانات الإدارة
// • لون آمن
  const safeColor = (v, fallback) => (typeof v === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(v.trim())) ? v.trim() : fallback;

// • فلترة البانرات النشطة
  const filterActiveBanners = rows => (rows || []).filter(b =>
    b && b.is_active !== false && isWithinSchedule(b) && (b.title_ar || b.image_url || b.mobile_image_url)
  );
// • ترتيب البانرات
  const sortHomeBanners = rows => [...rows].sort((a, b) => (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0));

  // ─── الوجهات حسب القيم الفعلية في قاعدة البيانات ───
  // homepage_banners.target_type:        url | product | category | promotion | menu
  // homepage_announcements.target_type:  none | url | product | category | promotion | menu
  // homepage_block_items.item_type:      product | category | promotion | promotion_page | url
// • البحث عن عرض بالمعرف
  const promotionById = id => livePromotions.find(p => String(p.id) === String(id)) || null;
// • رابط آمن
  const isSafeHref = href => /^(https?:\/\/|#\/|\/)/.test(href);

// • تحويل الهدف إلى مسار
  const resolveNavigationTarget = (row, typeOverride) => {
    const type = typeOverride || row.target_type || 'none';
    const url = (row.target_url || '').trim();
    const id = row.target_id || '';
    if (type === 'url') return (url && isSafeHref(url)) ? { kind: 'url', href: url } : { kind: 'none' };
    if (type === 'product') return id ? { kind: 'item', id } : { kind: 'none' };
    if (type === 'category') return id ? { kind: 'category', id } : { kind: 'none' };
    if (type === 'menu') return { kind: 'route', href: '#/menu' };
    if (type === 'promotion') {
      const p = promotionById(id || row.promotion_id);
      if (p?.target_item_id) return { kind: 'item', id: p.target_item_id };
      if (p?.target_category_id) return { kind: 'category', id: p.target_category_id };
      return { kind: 'route', href: '#/menu' };
    }
    if (type === 'promotion_page') return { kind: 'route', href: '#/menu' };  // صفحة العروض المستقلة لم تُبنَ بعد
    return { kind: 'none' };
  };

// • فتح هدف محسوب
  const openResolved = t => {
    if (!t || t.kind === 'none') return;
    if (t.kind === 'item') {
      if (ITEM[t.id]) openItem(t.id); else location.hash = '#/menu';
      return;
    }
    if (t.kind === 'category') {
      const target = '#/menu/' + encodeURIComponent(t.id);
      if (location.hash === target) { state.filter = t.id; state.subcat = 'All'; refresh(); }
      else location.hash = target;
      return;
    }
    if (t.kind === 'page') { openPageScreen(t.id); return; }
    if (t.kind === 'url') {
      if (t.href.startsWith('#')) location.hash = t.href;
      else if (t.href.startsWith('/')) location.href = t.href;
      else window.open(t.href, '_blank', 'noopener,noreferrer');
      return;
    }
    if (t.kind === 'route') {
      if (location.hash === t.href) refresh(); else location.hash = t.href;
    }
  };

// • فتح هدف
  const openTarget = row => openResolved(resolveNavigationTarget(row));

// • تحميل البانرات من Supabase
  async function loadHomeBanners() {
    if (!sbClient) { homeBannersState = 'error'; renderHeroSlider(); return; }
    if (homeBannersState !== 'ready') { homeBannersState = 'loading'; renderHeroSlider(); }
    try {
      const { data, error } = await sbClient.from('active_homepage_banners')
        .select(BANNER_FIELDS).eq('is_active', true).order('sort_order', { ascending: true });
      if (error) throw error;
      homeBannerRows = sortHomeBanners(filterActiveBanners(data));
      homeBannersState = 'ready';
      homeBannerIndex = Math.min(homeBannerIndex, Math.max(0, homeBanners.length - 1));
    } catch (err) {
      console.warn('[Banners] تعذر تحميل البانرات:', err?.message || err);
      homeBannersState = 'error';
    }
    renderHeroSlider();
    startHeroAutoplay();
  }

  // عند عدم وجود بانرات مفعّلة نعرض العروض المفعّلة والصالحة من menu_promotions (بيانات حقيقية من القاعدة)
// • شرائح احتياطية
  const promoFallbackSlides = () => (livePromotions || []).slice(0, 5).map(p => ({
    id: 'promo-' + p.id,
    title_ar: p.name_ar || '',
    subtitle_ar: p.description_ar || '',
    image_url: p.image_url || '',
    mobile_image_url: '',
    button_text_ar: 'اكتشف العرض',
    target_type: 'promotion',
    target_id: p.id,
    target_url: '',
    display_seconds: 5,
    promotion_id: p.id
  }));

// • رسم شريحة
  const renderHeroSlide = (b, i) => {
    const desktop = safeImgUrl(b.image_url) || safeImgUrl(b.mobile_image_url);
    const mobile = safeImgUrl(b.mobile_image_url) || desktop;
    const t = resolveNavigationTarget(b);
    const active = i === homeBannerIndex;
    const img = mobile ? `<picture class="hsl-pic">${desktop && desktop !== mobile ? `<source media="(min-width: 900px)" srcset="${esc(desktop)}">` : ''}<img class="hsl-img" src="${esc(mobile)}" alt="${esc(b.title_ar || '')}" loading="${i === 0 ? 'eager' : 'lazy'}" decoding="async" data-hsl-img></picture>` : '';
    return `<div class="hsl-slide${active ? ' is-active' : ''}" data-hsl-slide="${i}" role="group" aria-roledescription="slide" aria-label="${i + 1} من ${homeBanners.length}" aria-hidden="${active ? 'false' : 'true'}">
      ${img}
      <div class="hsl-content">
        ${b.title_ar ? `<h2>${esc(b.title_ar)}</h2>` : ''}
        ${b.subtitle_ar ? `<p>${esc(b.subtitle_ar)}</p>` : ''}
      </div>
    </div>`;
  };

// • رسم السلايدر
  const renderHeroSlider = () => {
    const root = document.querySelector('[data-hsl-root]');
    if (!root) return;
    if (homeBannersState === 'idle' || homeBannersState === 'loading') {
      root.innerHTML = '<div class="hsl-skeleton" aria-busy="true" aria-label="جارٍ تحميل العروض"></div>';
      return;
    }
    if (homeBannersState === 'error') {
      root.innerHTML = '<div class="hsl-state"><p>تعذر تحميل العروض حاليًا.</p><button type="button" class="btn btn-outline btn-sm" data-hsl-retry>إعادة المحاولة</button></div>';
      return;
    }
    homeBanners = homeBannerRows.length ? homeBannerRows : promoFallbackSlides();
    if (!homeBanners.length) { root.innerHTML = ''; return; }   // لا بيانات ثابتة كبديل

    const n = homeBanners.length;
    const controls = n > 1 ? `<div class="hsl-controls"><div class="hsl-dots">${homeBanners.map((_, i) => `<button type="button" class="hsl-dot" data-hsl-dot="${i}" aria-label="الشريحة ${i + 1}" aria-current="${i === homeBannerIndex ? 'true' : 'false'}"></button>`).join('')}</div></div>` : '';
    root.innerHTML = `<div class="hsl-track" data-hsl-track>${homeBanners.map(renderHeroSlide).join('')}</div>${controls}`;

    root.querySelectorAll('[data-hsl-img]').forEach(im => {
      im.addEventListener('error', () => im.closest('.hsl-slide')?.classList.add('img-failed'), { once: true });
    });
    if (!root.dataset.bound) {
      root.dataset.bound = '1';
      let startX = null;
      root.addEventListener('touchstart', e => { startX = e.touches[0].clientX; pauseHeroAutoplay(); }, { passive: true });
      root.addEventListener('touchend', e => {
        if (startX == null) return;
        const dx = e.changedTouches[0].clientX - startX;
        startX = null;
        if (Math.abs(dx) > 40) (dx < 0 ? previousSlide : nextSlide)();   // RTL: السحب لليسار يعني التالي
        else resumeHeroAutoplayLater();
      }, { passive: true });
      root.addEventListener('mouseenter', pauseHeroAutoplay);
      root.addEventListener('mouseleave', resumeHeroAutoplayLater);
      root.addEventListener('focusin', pauseHeroAutoplay);
      root.addEventListener('focusout', resumeHeroAutoplayLater);
    }
  };

// • تحديث الشريحة في DOM
  const updateHeroSlideDom = () => {
    const root = document.querySelector('[data-hsl-root]');
    if (!root) return;
    root.querySelectorAll('[data-hsl-slide]').forEach(el => {
      const on = Number(el.dataset.hslSlide) === homeBannerIndex;
      el.classList.toggle('is-active', on);
      el.setAttribute('aria-hidden', on ? 'false' : 'true');
    });
    root.querySelectorAll('[data-hsl-dot]').forEach(el => {
      el.setAttribute('aria-current', Number(el.dataset.hslDot) === homeBannerIndex ? 'true' : 'false');
    });
  };

// • إيقاف نهائي للتشغيل التلقائي
  const stopHeroAutoplay = () => { clearTimeout(homeBannerTimer); homeBannerTimer = null; };

// • تشغيل السلايدر تلقائياً
  const startHeroAutoplay = () => {
    stopHeroAutoplay();
    if (homeBanners.length < 2 || document.hidden || currentRoute() !== 'home' || homeBannerResumeTimer) return;
    const configuredSeconds = Number(homeBanners[homeBannerIndex]?.display_seconds);
    const seconds = Number.isFinite(configuredSeconds) && configuredSeconds > 0
      ? Math.min(120, Math.max(2, configuredSeconds)) : SLIDE_SECONDS;
    homeBannerTimer = setTimeout(() => nextSlide(), seconds * 1000);
  };

  // إيقاف مؤقت عند تفاعل المستخدم، ثم استئناف بعد فترة
// • إيقاف التشغيل التلقائي
  const pauseHeroAutoplay = () => {
    stopHeroAutoplay();
    clearTimeout(homeBannerResumeTimer);
    homeBannerResumeTimer = setTimeout(() => { homeBannerResumeTimer = null; startHeroAutoplay(); }, PAUSE_AFTER_USER_MS);
  };
// • استئناف التشغيل بعد تأخير
  const resumeHeroAutoplayLater = () => {
    clearTimeout(homeBannerResumeTimer);
    homeBannerResumeTimer = setTimeout(() => { homeBannerResumeTimer = null; startHeroAutoplay(); }, 2000);
  };

// • الانتقال لشريحة محددة
  const goToSlide = i => {
    const n = homeBanners.length;
    if (!n) return;
    homeBannerIndex = ((i % n) + n) % n;
    updateHeroSlideDom();
    startHeroAutoplay();
  };
// • الشريحة التالية
  const nextSlide = () => goToSlide(homeBannerIndex + 1);
// • الشريحة السابقة
  const previousSlide = () => goToSlide(homeBannerIndex - 1);

// ─ [JS-17] اللافتات الإعلانية: homepage_announcements حسب placement، مع dismissKey لإخفائها بعد الإغلاق
  /* ═══════════════════════════════════════════════════════════════
     [ANNOUNCEMENTS] homepage_announcements — لافتات حسب placement
     ═══════════════════════════════════════════════════════════════ */
// • مفتاح إخفاء اللافتة
  const dismissKey = a => `${a.id}:${a.updated_at || ''}`;
// • قراءة اللافتات المخفية
  const readDismissed = () => { try { return JSON.parse(localStorage.getItem(K('dismissed_announcements')) || '[]'); } catch { return []; } };
// • هل اللافتة مخفية
  const isDismissed = a => readDismissed().includes(dismissKey(a));

// • فلترة اللافتات النشطة
  const filterActiveAnnouncements = rows => (rows || []).filter(a =>
    a && a.is_active !== false && isWithinSchedule(a) && (a.title_ar || a.message_ar || a.image_url || a.mobile_image_url)
  );

// • تحميل اللافتات من Supabase
  async function loadAnnouncements() {
    if (!sbClient) { announcementsState = 'error'; return; }
    try {
      const { data, error } = await sbClient.from('active_homepage_announcements')
        .select(ANNOUNCE_FIELDS).eq('is_active', true).order('sort_order', { ascending: true });
      if (error) throw error;
      announcements = filterActiveAnnouncements(data).sort((a, b) => (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0));
      announcementsState = 'ready';
    } catch (err) {
      console.warn('[Announcements] تعذر تحميل اللافتات:', err?.message || err);
      announcements = [];
      announcementsState = 'error';
    }
    renderAnnouncements();
  }

// • رسم لافتة
  const renderAnnouncement = a => {
    if (!a.title_ar && !a.message_ar) return '';
    const t = resolveNavigationTarget(a);
    const clickable = t.kind !== 'none';
    const style = `background:${safeColor(a.background_color, '#1F1610')};color:${safeColor(a.text_color, '#FFFFFF')};--announce-accent:${safeColor(a.accent_color, '#E8A425')}`;
    return `<aside class="announce" role="status" style="${style}" data-announce-id="${esc(a.id)}">
      ${a.icon ? `<span class="announce-icon" aria-hidden="true">${esc(a.icon)}</span>` : ''}
      <button type="button" class="announce-body" ${clickable ? 'data-announce-open' : 'tabindex="-1" style="cursor:default"'}>
        ${a.title_ar ? `<strong>${esc(a.title_ar)}</strong>` : ''}${a.title_ar && a.message_ar ? ' — ' : ''}${a.message_ar ? `<span>${esc(a.message_ar)}</span>` : ''}
      </button>
      ${a.is_dismissible !== false ? `<button type="button" class="announce-close" data-announce-close aria-label="إغلاق">×</button>` : ''}
    </aside>`;
  };

// • مؤقت سلايدر اللافتات
  let annSliderTimer = null;
// • إيقاف سلايدر اللافتات مؤقتاً
  let annPausedUntil = 0;
// • ربط أحداث سلايدر اللافتات
  const bindAnnSlider = () => {
    clearInterval(annSliderTimer);
    const sl = document.querySelector('[data-ann-slider]');
    if (!sl) return;
    const slides = [...sl.children];
    const dots = [...document.querySelectorAll('[data-ann-dots] .ann-dot')];
    const current = () => {
      const w = sl.clientWidth || 1;
      return Math.min(slides.length - 1, Math.max(0, Math.round(Math.abs(sl.scrollLeft) / w)));
    };
    sl.addEventListener('scroll', () => {
      const i = current();
      dots.forEach((d, k) => d.classList.toggle('is-active', k === i));
    }, { passive: true });
    const hold = () => { annPausedUntil = Infinity; };
    const release = () => { annPausedUntil = Date.now() + 2500; };
    sl.addEventListener('touchstart', hold, { passive: true });
    sl.addEventListener('touchend', release, { passive: true });
    sl.addEventListener('touchcancel', release, { passive: true });
    sl.addEventListener('pointerdown', hold, { passive: true });
    sl.addEventListener('pointerup', release, { passive: true });
    sl.addEventListener('pointercancel', release, { passive: true });
    if (slides.length > 1) {
      annSliderTimer = setInterval(() => {
        if (document.hidden || Date.now() < annPausedUntil || currentRoute() !== 'home') return;
        slides[(current() + 1) % slides.length].scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
      }, 4500);
    }
  };

// • هل للافتة صورة
  const annHasImage = a => !!(safeImgUrl(a.image_url) || safeImgUrl(a.mobile_image_url));
// • رسم اللافتات
  const renderAnnouncements = () => {
    if (currentRoute() === 'home') {
      const strip = document.querySelector('[data-ann-strip]');
      if (strip) {
        const slides = announcements.filter(annHasImage).map(renderStripAnnouncement).filter(Boolean);
        strip.innerHTML = slides.length
          ? `<div class="ann-slider" data-ann-slider role="region" aria-roledescription="carousel" aria-label="الإعلانات">${slides.map(s => `<div class="ann-slide">${s}</div>`).join('')}</div>${slides.length > 1 ? `<div class="ann-dots" data-ann-dots aria-hidden="true">${slides.map((_, i) => `<span class="ann-dot${i === 0 ? ' is-active' : ''}"></span>`).join('')}</div>` : ''}`
          : '';
        bindAnnSlider();
      }
    }
    // اللافتات النصية تظهر في مكان placement الخاص بها على كل الصفحات
    document.querySelectorAll('[data-announce-slot]').forEach(slot => {
      if (currentRoute() === 'home') { slot.innerHTML = ''; return; }
      const placement = slot.dataset.announceSlot;
      const list = announcements.filter(a => a.placement === placement && !annHasImage(a) && !isDismissed(a));
      slot.innerHTML = list.map(renderAnnouncement).join('');
    });
  };

  // لافتة الصور: الهاتف يبدأ بـ mobile_image_url ثم image_url، والكمبيوتر يفضّل image_url
  // اللافتة بلا صورة صالحة تُتجاهل بالكامل
// • رسم لافتة الشريط
  const renderStripAnnouncement = a => {
    const desktop = safeImgUrl(a.image_url);
    const mobile = safeImgUrl(a.mobile_image_url) || desktop;
    if (!mobile) return '';
    const clickable = resolveNavigationTarget(a).kind !== 'none';
    const pic = `<picture>${desktop && desktop !== mobile ? `<source media="(min-width: 900px)" srcset="${esc(desktop)}">` : ''}<img src="${esc(mobile)}" alt="${esc(a.title_ar || 'إعلان')}" loading="lazy" decoding="async"></picture>`;
    return clickable
      ? `<button type="button" class="ann-img" data-announce-id="${esc(a.id)}" data-announce-open aria-label="${esc(a.title_ar || 'إعلان')}">${pic}</button>`
      : `<div class="ann-img" data-announce-id="${esc(a.id)}">${pic}</div>`;
  };

// • إخفاء لافتة
  const dismissAnnouncement = id => {
    const a = announcements.find(x => String(x.id) === String(id));
    if (!a) return;
    const list = readDismissed();
    if (!list.includes(dismissKey(a))) list.push(dismissKey(a));
    safeSave(K('dismissed_announcements'), list);
    renderAnnouncements();
  };

  // يُستدعى بعد كل رسم للصفحة لتجهيز الأماكن الديناميكية
// • تركيب الأدوات على الشاشة الحالية
  const mountRouteWidgets = r => {
    if (r === 'home') { renderHeroSlider(); startHeroAutoplay(); renderHomepageBlocks(); }
    else { stopHeroAutoplay(); clearInterval(annSliderTimer); }
    renderAnnouncements();
    applyHomepageSectionOrder();
    scheduleServerQuote();
  };

  // أحداث السلايدر واللافتات (مستقلة عن معالج data-action)
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-hsl-prev]')) { pauseHeroAutoplay(); previousSlide(); return; }
    if (t.closest('[data-hsl-next]')) { pauseHeroAutoplay(); nextSlide(); return; }
    const dot = t.closest('[data-hsl-dot]');
    if (dot) { pauseHeroAutoplay(); goToSlide(Number(dot.dataset.hslDot)); return; }
    const cta = t.closest('[data-hsl-cta]');
    if (cta) { const b = homeBanners[Number(cta.dataset.hslCta)]; if (b) openTarget(b); return; }
    if (t.closest('[data-hsl-retry]')) { loadHomeBanners(); return; }
    const close = t.closest('[data-announce-close]');
    if (close) { dismissAnnouncement(close.closest('[data-announce-id]')?.dataset.announceId); return; }
    const open = t.closest('[data-announce-open]');
    if (open) {
      const a = announcements.find(x => String(x.id) === open.closest('[data-announce-id]')?.dataset.announceId);
      if (a) openTarget(a);
    }
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) stopHeroAutoplay(); else startHeroAutoplay(); });


// ─ [JS-18] بلوكات الصفحة الرئيسية: HOMEPAGE_BLOCK_FIELDS وتحميل homepage_blocks وhomepage_block_items من Supabase
  /* ═══════════════════════════════════════════════════════════════
     [HOMEPAGE BLOCKS] homepage_blocks + homepage_block_items
     ═══════════════════════════════════════════════════════════════ */
// • حقول homepage_blocks
  const HOMEPAGE_BLOCK_FIELDS = 'id,block_type,title_ar,subtitle_ar,image_url,target_url,content,sort_order,is_active,starts_at,ends_at,layout_type,background_color,text_color,accent_color,padding_size,settings,updated_at';

// ─ ترتيب أقسام الصفحة الرئيسية من Supabase
  let homepageSectionOrder = [];
  const HOME_SECTION_DEFAULT_ORDER = {
    hero_slider: 10, promotion_pages: 20, announcements: 30,
    sale_strip: 40, homepage_blocks: 50, text_row: 60, secret_menu: 70
  };
  async function loadHomepageSectionOrder() {
    if (!sbClient) return;
    try {
      const { data, error } = await sbClient.from('homepage_section_order')
        .select('section_key,sort_order,is_visible').order('sort_order', { ascending: true });
      if (error) throw error;
      homepageSectionOrder = data || [];
      applyHomepageSectionOrder();
    } catch (err) {
      console.warn('[HomepageOrder] تعذر تحميل ترتيب الأقسام:', err?.message || err);
    }
  }
  const applyHomepageSectionOrder = () => {
    const root = document.querySelector('#app .view-anim');
    if (!root || currentRoute() !== 'home') return;
    const rows = new Map(homepageSectionOrder.map(x => [x.section_key, x]));
    const nodes = Array.from(root.children).filter(el => el.hasAttribute('data-home-section'));
    nodes.sort((a, b) => {
      const ak = a.dataset.homeSection, bk = b.dataset.homeSection;
      return Number(rows.get(ak)?.sort_order ?? HOME_SECTION_DEFAULT_ORDER[ak] ?? 9999)
        - Number(rows.get(bk)?.sort_order ?? HOME_SECTION_DEFAULT_ORDER[bk] ?? 9999);
    });
    nodes.forEach(el => {
      const row = rows.get(el.dataset.homeSection);
      el.hidden = row ? row.is_visible === false : false;
      root.appendChild(el);
    });
  };


// • حقول homepage_block_items
  const BLOCK_ITEM_FIELDS = 'id,block_id,item_type,target_id,target_url,title_override_ar,subtitle_override_ar,image_override_url,sort_order,is_active';

// • بلوكات الرئيسية
  let homeBlocks = [];
// • عناصر البلوكات
  let homeBlockItems = {};
// • توزيع البلوكات حسب الموضع
  let homePlacementsByBlock = {};   // block.id -> مواضع عروض من promotion_display_placements
// • حالة البلوكات
  let homeBlocksState = 'idle';
// • أهداف البلوك
  const blockTargets = {};   // block_item.id -> وجهة الضغط

// • تباعد البلوك
  const blockPadClass = b => ({ small: 'hb-pad-sm', medium: 'hb-pad-md', large: 'hb-pad-lg' }[b.padding_size] || 'hb-pad-md');

  // homepage_block_items.item_type -> target_type المستخدم في resolveNavigationTarget
// • أنواع هدف عنصر البلوك
  const BLOCK_ITEM_TARGET_TYPE = { product: 'product', category: 'category', promotion: 'promotion', promotion_page: 'promotion_page', url: 'url' };

// • تحميل البلوكات من Supabase
  async function loadHomepageBlocks() {
    if (!sbClient) { homeBlocksState = 'error'; renderHomepageBlocks(); return; }
    if (homeBlocksState !== 'ready') { homeBlocksState = 'loading'; renderHomepageBlocks(); }
    try {
      const { data: rows, error } = await sbClient.from('active_homepage_blocks')
        .select(HOMEPAGE_BLOCK_FIELDS).eq('is_active', true).order('sort_order', { ascending: true });
      if (error) throw error;
      // block_type حقل حر في القاعدة، لذلك لا نفلتر عليه؛ البلوك يُعرض فقط إن كان له محتوى صالح
      const valid = (rows || []).filter(b => b && b.is_active !== false && isWithinSchedule(b) && !isTestBlock(b))
        .sort((x, y) => (Number(x.sort_order) || 0) - (Number(y.sort_order) || 0));

      const byBlock = {};
      if (valid.length) {
        const { data: items, error: itemsErr } = await sbClient.from('homepage_block_items')
          .select(BLOCK_ITEM_FIELDS).in('block_id', valid.map(b => b.id)).eq('is_active', true)
          .order('sort_order', { ascending: true });
        if (itemsErr) throw itemsErr;
        (items || []).filter(i => i.is_active !== false).forEach(i => { (byBlock[i.block_id] ||= []).push(i); });
      }
      // مواضع العروض داخل البلوكات؛ فشلها لا يمنع عرض البلوكات
      const placementsByBlock = {};
      if (valid.length) {
        const { data: placements, error: plErr } = await sbClient.from('active_promotion_display_placements')
          .select('id,promotion_id,block_id,sort_order,is_active,starts_at,ends_at')
          .eq('placement_type', 'homepage_block').eq('is_active', true)
          .in('block_id', valid.map(b => b.id)).order('sort_order', { ascending: true });
        if (plErr) console.warn('[Blocks] تعذر تحميل مواضع العروض:', plErr.message);
        (placements || []).filter(p => isWithinSchedule(p)).forEach(p => { (placementsByBlock[p.block_id] ||= []).push(p); });
      }
      homePlacementsByBlock = placementsByBlock;
      homeBlocks = valid;
      homeBlockItems = byBlock;
      homeBlocksState = 'ready';
    } catch (err) {
      console.warn('[Blocks] تعذر تحميل بلوكات الرئيسية:', err?.message || err);
      homeBlocks = [];
      homeBlocksState = 'error';
    }
    renderHomepageBlocks();
  }

// ─ [JS-18أ] أدوات قراءة آمنة: parseJsonObject وغيرها — تمنع توقف الصفحة عند JSON غير صحيح
  /* ── أدوات قراءة آمنة: JSON غير صحيح أو قيمة غير متوقعة لا توقف الصفحة ── */
// • تحليل JSON بأمان
  const parseJsonObject = v => {
    if (v && typeof v === 'object' && !Array.isArray(v)) return v;
    if (typeof v !== 'string' || !v.trim()) return {};
    try { const p = JSON.parse(v); return (p && typeof p === 'object' && !Array.isArray(p)) ? p : {}; } catch { return {}; }
  };
// • إعدادات البلوك
  const blockSettings = b => parseJsonObject(b.settings);
// • محتوى البلوك
  const blockContent = b => {
    if (b.content && typeof b.content === 'object') return b.content;
    if (typeof b.content === 'string') {
      const parsed = parseJsonObject(b.content);
      return Object.keys(parsed).length ? parsed : { text_ar: b.content };
    }
    return {};
  };
// • قراءة خيار منطقي آمن
  const boolOpt = (s, k, fb) => (typeof s[k] === 'boolean' ? s[k] : fb);
// • قراءة خيار رقمي آمن
  const numOpt = (s, k, min, max, fb) => {
    if (s[k] === '' || s[k] == null) return fb;
    const n = Number(s[k]);
    return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb;
  };
// • قراءة خيار من قائمة
  const enumOpt = (s, k, allowed, fb) => (allowed.includes(s[k]) ? s[k] : fb);
// • رابط صورة آمن
  const safeImgUrl = v => (typeof v === 'string' && /^(https?:\/\/|\/(?!\/))/.test(v.trim())) ? v.trim() : '';
// • مواضع الصورة
  const OBJ_POS = { center: '50% 50%', background: '50% 50%', top: '50% 0%', bottom: '50% 100%', left: '0% 50%', right: '100% 50%' };
  // المحاذاة في القاعدة: right/left/center/start/end (right = بداية السطر في RTL)
// • خريطة المحاذاة
  const ALIGN_MAP = Object.assign(Object.create(null), { start: 'start', right: 'start', center: 'center', end: 'end', left: 'end' });
// • قراءة المحاذاة
  const alignOpt = s => ALIGN_MAP[s.text_align] || ALIGN_MAP[s.align] || null;
  // بلوك تجريبي/اختبار يحمل علامة صريحة بأنه لا يظهر للعملاء
// • هل البلوك تجريبي
  const isTestBlock = b => { const s = blockSettings(b), c = blockContent(b); return s.test_only === true || s.demo === true || c.demo === true || c.test === true; };
// • مفاتيح المواضع
  const POS_KEYS = Object.keys(OBJ_POS);
// • تنسيق تاريخ قصير
  const shortDate = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? '' : d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }); };

  // نوع الوظيفة (block_type) منفصل عن شكل العرض (layout_type)
// • تخطيطات البلوك
  const HB_LAYOUTS = ['banner', 'cards', 'carousel', 'grid', 'list', 'text'];
// • التخطيط الافتراضي
  const HB_DEFAULT_LAYOUT = { campaign_hero: 'banner', promo_banner: 'banner', promotion_cards: 'grid', product_carousel: 'carousel', product_grid: 'grid', products_popular: 'grid', category_grid: 'grid', text_promo: 'text', text: 'text' };
// • تخطيط البلوك
  const layoutOf = b => (HB_LAYOUTS.includes(b.layout_type) ? b.layout_type : (HB_DEFAULT_LAYOUT[b.block_type] || 'grid'));

// ─ [JS-18ب] تحويل عناصر البلوك إلى بيانات جاهزة للعرض (من الكاش الحي فقط)
  // ─── تحويل عناصر البلوك إلى بيانات جاهزة للعرض (من الكاش الحي فقط) ───
// • هدف العرض
  const resolvePromotionTarget = p => {
    if (p.target_item_id) return { kind: 'item', id: p.target_item_id };
    const offer = Object.values(pageOffers).flat().find(o => String(o.id) === String(p.id));
    const catId = p.target_category_id || offer?.target_category_id;
    if (catId) return { kind: 'category', id: catId };
    return { kind: 'route', href: '#/menu' };
  };

// • ملاحظة العرض
  const promoNote = p => [
    Number(p.min_order) > 0 ? `الحد الأدنى للطلب ${money(Number(p.min_order))}` : '',
    Number(p.max_discount) > 0 ? `أقصى خصم ${money(Number(p.max_discount))}` : ''
  ].filter(Boolean).join(' · ');

// • حل عنصر بلوك
  const resolveBlockItem = bi => {
    const titleOv = (bi.title_override_ar || '').trim();
    const subOv = (bi.subtitle_override_ar || '').trim();
    const imgOv = safeImgUrl(bi.image_override_url);

    if (bi.item_type === 'product') {
      const it = ITEM[bi.target_id];
      if (!it) return null;   // المنتج غير موجود أو غير متاح في المنيو الحي
      blockTargets[bi.id] = { kind: 'item', id: it.id };
      return { kind: 'item', item: it, title: titleOv || it.name, subtitle: subOv || it.desc, image: imgOv || it.img };
    }

    if (bi.item_type === 'promotion') {
      const p = promotionById(bi.target_id);
      if (!p) return null;
      const title = titleOv || p.name_ar || '';
      const image = imgOv || safeImgUrl(p.image_url);
      if (!title && !image) return null;
      const target = resolvePromotionTarget(p);
      const v = Number(p.value) || 0;
      const valueBadge = (['percent', 'fixed'].includes(p.promotion_type) && v <= 0) ? '' : offerValueLabel(p);
      const badge = [promotionBadgeLabel(p.id), valueBadge].filter(Boolean).join(' · ');
      blockTargets[bi.id] = target;
      return { kind: 'card', key: bi.id, target, title, subtitle: subOv || p.description_ar || '', image, badge, ends: p.ends_at || '', note: promoNote(p) };
    }

    if (bi.item_type === 'promotion_page') {
      const page = livePromotionPages.find(p => String(p.id) === String(bi.target_id));
      if (!page || !(pageOffers[page.id] || []).length) return null;
      const target = { kind: 'page', id: page.id };
      blockTargets[bi.id] = target;
      return { kind: 'card', key: bi.id, target, title: titleOv || page.title_ar || '', subtitle: subOv || page.subtitle_ar || '', image: imgOv || safeImgUrl(page.card_image_url) };
    }

    const type = BLOCK_ITEM_TARGET_TYPE[bi.item_type];
    if (!type) return null;
    const target = resolveNavigationTarget({ target_type: type, target_id: bi.target_id, target_url: bi.target_url });
    if (target.kind === 'none') return null;
    let title = titleOv;
    if (target.kind === 'category') {
      const c = CATS.find(x => String(x.id) === String(bi.target_id));
      if (!c) return null;
      title = title || c.label;
    }
    if (!title && !imgOv) return null;
    blockTargets[bi.id] = target;
    return { kind: 'card', key: bi.id, target, title, subtitle: subOv, image: imgOv };
  };

  // عناصر البلوك بترتيبها المسجّل، بدون تكرار منتج داخل نفس البلوك
// • عناصر البلوك بعد الحل
  const blockItemsResolved = block => {
    const seen = new Set();
    const rows = [...(homeBlockItems[block.id] || [])];
    const promoIds = new Set(rows.filter(i => i.item_type === 'promotion').map(i => String(i.target_id)));
    (homePlacementsByBlock[block.id] || []).forEach(p => {
      if (promoIds.has(String(p.promotion_id))) return;   // لا تكرار مع عنصر البلوك نفسه
      promoIds.add(String(p.promotion_id));
      rows.push({ id: 'pl-' + p.id, block_id: block.id, item_type: 'promotion', target_id: p.promotion_id, sort_order: p.sort_order, is_active: true });
    });
    return rows.map(resolveBlockItem).filter(r => {
      if (!r) return false;
      if (r.kind === 'item') { if (seen.has(String(r.item.id))) return false; seen.add(String(r.item.id)); }
      return true;
    });
  };

// ─ [JS-18ج] عناصر HTML مشتركة بين بلوكات الصفحة الرئيسية
  // ─── عناصر HTML مشتركة ───
// • تنسيق البلوك
  const hbStyle = (b, s) => {
    const parts = [];
    const bg = safeColor(b.background_color, '');
    const fg = safeColor(b.text_color, '');
    const ac = safeColor(b.accent_color, '');
    if (bg) parts.push(`background:${bg}`);
    if (fg) parts.push(`color:${fg}`);
    if (ac) parts.push(`--hb-accent:${ac}`);
    const r = numOpt(s, 'border_radius', 0, 32, null);
    if (r !== null) parts.push(`--hb-radius:${r}px`);
    const align = alignOpt(s);
    if (align) parts.push(`--hb-align:${align}`);
    return parts.join(';');
  };

// • قالب قسم البلوك
  const hbSection = (b, s, inner, cls = '') => {
    const title = (b.title_ar || '').trim();
    const sub = (b.subtitle_ar || '').trim();
    const head = (title || sub) ? `<header class="hb-head">${title ? `<h2>${esc(title)}</h2>` : ''}${sub ? `<p>${esc(sub)}</p>` : ''}</header>` : '';
    return `<section class="hb ${blockPadClass(b)}${s.full_width === true ? ' hb-full' : ''}${cls ? ' ' + cls : ''}" style="${hbStyle(b, s)}" data-hb-block="${esc(b.id)}"${title ? ` aria-label="${esc(title)}"` : ''}>${head}${inner}</section>`;
  };

// • حاوية عناصر البلوك
  const hbItemsWrap = (layout, cards, s, wide = false) => {
    const items = cards.map(c => `<div role="listitem">${c}</div>`).join('');
    if (layout === 'carousel') return `<div class="hb-slider${wide ? ' hb-slider-wide' : ''}" role="list">${items}</div>`;
    if (layout === 'list') return `<div class="hb-list" role="list">${items}</div>`;
    const cols = numOpt(s, 'columns', 1, 4, null);
    const vars = cols == null
      ? '--hb-c-m:2;--hb-c-t:3;--hb-c-d:4'
      : `--hb-c-m:${Math.min(cols, 2)};--hb-c-t:${Math.min(cols, 3)};--hb-c-d:${cols}`;
    return `<div class="hb-grid" role="list" style="${vars}">${items}</div>`;
  };

// • قالب كرت البلوك
  const hbCard = (r, s, c = {}) => {
    const showBadge = boolOpt(s, 'show_badge', boolOpt(c, 'show_badge', true));
    const showDesc = boolOpt(s, 'show_description', true);
    const inner = `${r.image ? `<div class="hb-card-img"><img src="${esc(r.image)}" alt="${esc(r.title || '')}" loading="lazy" decoding="async"></div>` : ''}
      <div class="hb-card-body">${showBadge && r.badge ? `<span class="hb-badge">${esc(r.badge)}</span>` : ''}${r.title ? `<h3>${esc(r.title)}</h3>` : ''}${showDesc && r.subtitle ? `<p>${esc(r.subtitle)}</p>` : ''}${r.note ? `<small class="hb-note">${esc(r.note)}</small>` : ''}${r.ends && shortDate(r.ends) ? `<small class="hb-ends">ينتهي ${esc(shortDate(r.ends))}</small>` : ''}</div>`;
    return r.target.kind !== 'none'
      ? `<button type="button" class="hb-card" data-hb-open="${esc(r.key)}">${inner}</button>`
      : `<div class="hb-card">${inner}</div>`;
  };

  // بطاقة منتج داخل البلوك: نفس الأزرار والوظائف الحالية (فتح المنتج + إضافة سريعة)
// • قالب كرت منتج في البلوك
  const hbProductCard = (it, s) => {
    const showDesc = boolOpt(s, 'show_description', true);
    const showPrice = boolOpt(s, 'show_price', true);
    return `<article class="product" data-action="open" data-id="${esc(it.id)}" tabindex="0" role="button" aria-label="${esc(it.name)}">
      <div class="product-img">
        ${badgesHtml(it)}
        ${it.img ? `<img src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy" decoding="async">` : '<div class="img-missing" aria-hidden="true"></div>'}
      </div>
      <div class="product-body">
        <h3 class="product-name">${esc(it.name)}</h3>
        ${showDesc && it.desc ? `<p class="product-desc">${esc(it.desc)}</p>` : ''}
        ${starsHtml(it.id)}
        <div class="product-foot">
          ${showPrice ? priceHtml(it) : ''}
          <button class="add-btn" data-action="quick" data-id="${esc(it.id)}" aria-label="ضيف ${esc(it.name)}">+</button>
        </div>
      </div>
    </article>`;
  };

  // بانر: صورة + تراكب + عنوان + وصف + شارة + زر CTA (أو كامل البانر قابل للنقر إن أُخفي الزر)
// • قالب بانر البلوك
  const hbBannerHtml = (b, s, o) => {
    const objD = OBJ_POS[enumOpt(s, 'image_position', POS_KEYS, 'center')];
    const objM = OBJ_POS[enumOpt(s, 'mobile_image_position', POS_KEYS, 'center')];
    const minH = numOpt(s, 'min_height', 120, 600, 200);
    const ovOn = boolOpt(s, 'image_overlay', true);
    const ovRaw = numOpt(s, 'overlay_opacity', 0, 100, null);
    const ov = !ovOn ? 0 : (ovRaw == null ? 0.5 : (ovRaw > 1 ? ovRaw / 100 : ovRaw));
    const style = `${hbStyle(b, s)};min-height:${minH}px;--hb-obj-d:${objD};--hb-obj-m:${objM}`;
    const clickable = !o.showCta && o.target.kind !== 'none';
    const media = o.img ? `<div class="hb-banner-media"><img src="${esc(o.img)}" alt="${esc(o.title || '')}" loading="lazy" decoding="async"></div>` : '';
    const overlay = `<div class="hb-banner-ov" style="opacity:${ov}" aria-hidden="true"></div>`;
    const sub = boolOpt(s, 'show_description', true) ? o.sub : '';
    const body = `<span class="hb-banner-body">${o.badge ? `<span class="hb-badge">${esc(o.badge)}</span>` : ''}${o.title ? `<span class="hb-title">${esc(o.title)}</span>` : ''}${sub ? `<span class="hb-sub">${esc(sub)}</span>` : ''}${o.showCta ? `<span class="hb-cta-row"><button type="button" class="hsl-cta" data-hb-open="${esc(o.key)}">${esc(o.ctaLabel)}</button></span>` : ''}</span>`;
    const inner = media + overlay + body;
    return clickable
      ? `<button type="button" class="hb-banner" data-hb-open="${esc(o.key)}" style="${style}" aria-label="${esc(o.title || o.ctaLabel)}">${inner}</button>`
      : `<div class="hb-banner" style="${style}">${inner}</div>`;
  };

// • نص زر البلوك
  const ctaText = c => String(c.button_text_ar || c.cta_text_ar || c.cta_text || '').trim() || 'اكتشف العرض';

  // بانر على مستوى البلوك نفسه (صورة واحدة وعنوان ورابط)
// • بانر على مستوى البلوك
  const blockLevelBanner = (b, s, c) => {
    const key = 'blk-' + b.id;
    const target = resolveNavigationTarget({ target_type: 'url', target_url: b.target_url });
    blockTargets[key] = target;
    const img = safeImgUrl(b.image_url);
    const title = (b.title_ar || '').trim();
    if (!img && !title) return '';
    const badge = boolOpt(s, 'show_badge', true) ? String(s.badge_text || c.badge_text_ar || '').trim().slice(0, 40) : '';
    return `<section class="hb-banner-sec${s.full_width === true ? ' hb-full' : ''}" data-hb-block="${esc(b.id)}">${hbBannerHtml(b, s, {
      img, title, sub: (b.subtitle_ar || '').trim(), badge, target, key,
      showCta: boolOpt(s, 'show_cta', true) && target.kind !== 'none', ctaLabel: ctaText(c)
    })}</section>`;
  };

// ─ [JS-18د] مُرسِلات كل نوع بلوك (Renderer مستقل لكل block_type)
  // ─── مُرسِلات كل نوع بلوك (Renderer مستقل لكل block_type) ───
// • رسم بلوك بانر الحملة
  const renderCampaignHero = (b, s, c) => blockLevelBanner(b, s, c);

// • رسم بلوك بانر العرض
  const renderPromoBanner = (b, s, c, resolved) => {
    const items = resolved.filter(r => r.kind === 'card');
    if (!items.length) return blockLevelBanner(b, s, c);
    const badgeOn = boolOpt(s, 'show_badge', true);
    const customBadge = String(s.badge_text || '').trim().slice(0, 40);
    const banners = items.map(r => `<div>${hbBannerHtml(b, s, {
      img: safeImgUrl(r.image), title: r.title, sub: r.subtitle,
      badge: badgeOn ? (customBadge || r.badge || '') : '',
      target: r.target, key: r.key,
      showCta: boolOpt(s, 'show_cta', true) && r.target.kind !== 'none', ctaLabel: ctaText(c)
    })}</div>`).join('');
    const wrapCls = layoutOf(b) === 'carousel' ? 'hb-slider hb-slider-wide' : 'hb-list';
    return `<section class="hb-banner-sec" data-hb-block="${esc(b.id)}"><div class="${wrapCls}" role="list">${banners}</div></section>`;
  };

// • رسم بلوك بطاقات العروض
  const renderPromotionCards = (b, s, c, resolved) => {
    const cards = resolved.filter(r => r.kind === 'card').map(r => hbCard(r, s, c));
    if (!cards.length) return resolved.some(r => r.kind === 'item') ? renderProductBlock(b, s, c, resolved) : '';
    return hbSection(b, s, hbItemsWrap(layoutOf(b), cards, s));
  };

// • رسم بلوك المنتجات
  const renderProductBlock = (b, s, c, resolved) => {
    let items = resolved.filter(r => r.kind === 'item').map(r => ({
      ...r.item, name: r.title || r.item.name, desc: r.subtitle || r.item.desc, img: r.image || r.item.img
    }));
    if (!items.length && b.block_type === 'products_popular') {
      const placed = (liveProductRecommendations.homepage || []).map(x => ITEM[x.item_id]).filter(i => i && !isSecret(i));
      items = placed.length ? placed : Object.values(ITEM).filter(i => !isSecret(i) && i.tags.includes('popular')).slice(0, 8);
    }
    if (!items.length) return '';
    return hbSection(b, s, hbItemsWrap(layoutOf(b), items.map(it => hbProductCard(it, s)), s));
  };

// • رسم شبكة التصنيفات
  const renderCategoryGrid = (b, s, c, resolved) => {
    const cards = resolved.filter(r => r.kind === 'card').map(r => hbCard(r, s, c));
    if (!cards.length) return '';
    return hbSection(b, s, hbItemsWrap(layoutOf(b), cards, s));
  };

// • رسم بلوك النص الترويجي
  const renderTextPromo = (b, s, c) => {
    const text = String(c.text_ar || c.text || '').trim();
    const title = (b.title_ar || '').trim();
    if (!text && !title) return '';
    const key = 'blk-' + b.id;
    const ctaType = ['menu', 'url', 'product', 'category', 'promotion'].includes(c.target) ? c.target : 'url';
    const target = resolveNavigationTarget({ target_type: ctaType, target_id: c.target_id || '', target_url: b.target_url || c.target_url || '' });
    blockTargets[key] = target;
    const ctaLabel = String(c.button_text_ar || c.cta_text || '').trim();
    // زر يوجّه للمنيو مكرر: المنيو موجود في الشريط السفلي، فلا يُعرض
    const menuTarget = target.kind === 'route' && target.href === '#/menu';
    const showCta = boolOpt(s, 'show_cta', true) && target.kind !== 'none' && !!ctaLabel && !menuTarget;
    const body = `${text && boolOpt(s, 'show_description', true) ? `<p class="hb-text">${esc(text)}</p>` : ''}${showCta ? `<div class="hb-cta-row"><button type="button" class="hsl-cta" data-hb-open="${esc(key)}">${esc(ctaLabel)}</button></div>` : ''}`;
    return hbSection(b, s, layoutOf(b) === 'cards' ? `<div class="txt-card hb-txt-card">${body}</div>` : body);
  };

// • خريطة رسم أنواع البلوكات
  const BLOCK_RENDERERS = {
    campaign_hero: renderCampaignHero,
    promo_banner: renderPromoBanner,
    promotion_cards: renderPromotionCards,
    product_carousel: renderProductBlock,
    product_grid: renderProductBlock,
    products_popular: renderProductBlock,
    category_grid: renderCategoryGrid,
    text_promo: renderTextPromo,
    text: renderTextPromo
  };

  // نوع غير معروف لا يُعرض؛ وخطأ بلوك واحد لا يمنع باقي الصفحة
// • رسم بلوك واحد
  const renderOneBlock = b => {
    const render = BLOCK_RENDERERS[b.block_type];
    if (!render) return '';
    try {
      return render(b, blockSettings(b), blockContent(b), blockItemsResolved(b));
    } catch (err) {
      console.warn('[Blocks] تعذر عرض بلوك', b.id, err?.message || err);
      return '';
    }
  };


// ─ [JS-19] صفحات العروض: promotion_pages وmenu_promotions.promotion_page_id. الكارت المربع يفتح صفحة العرض
  /* ═══════════════════════════════════════════════════════════════
     [PROMOTION PAGES] promotion_pages + menu_promotions.promotion_page_id
     الكارت المربع = صفحة عرض، وشاشته = العروض المرتبطة بها
     ═══════════════════════════════════════════════════════════════ */
// • حقول promotion_pages
  const PAGE_FIELDS = 'id,slug,title_ar,subtitle_ar,description_ar,card_image_url,cover_image_url,sort_order,is_active,starts_at,ends_at';
// • حقول عروض الصفحة
  const PAGE_OFFER_FIELDS = 'id,name_ar,description_ar,image_url,promotion_type,value,target_item_id,target_category_id,promotion_page_id,priority,is_active,starts_at,ends_at';
// • صفحات العروض الحية
  let livePromotionPages = [];
// • عروض كل صفحة
  let pageOffers = {};   // page.id -> [offer]

// • تحميل صفحات العروض من Supabase
  async function loadPromotionPages() {
    if (!sbClient) return;
    try {
      const { data: pages, error } = await sbClient.from('active_promotion_pages')
        .select(PAGE_FIELDS).eq('is_active', true).order('sort_order', { ascending: true });
      if (error) throw error;
      const valid = (pages || []).filter(p => p && p.is_active !== false && isWithinSchedule(p) && (p.title_ar || p.card_image_url));
      let offers = [];
      if (valid.length) {
        const { data: rows, error: oErr } = await sbClient.from('menu_promotions')
          .select(PAGE_OFFER_FIELDS).in('promotion_page_id', valid.map(p => p.id)).eq('is_active', true)
          .order('priority', { ascending: false });
        if (oErr) throw oErr;
        offers = (rows || []).filter(o => o.is_active !== false && isWithinSchedule(o));
      }
      const byPage = {};
      offers.forEach(o => { (byPage[o.promotion_page_id] ||= []).push(o); });
      livePromotionPages = valid;
      pageOffers = byPage;
    } catch (err) {
      console.warn('[PromotionPages] تعذر تحميل صفحات العروض:', err?.message || err);
      livePromotionPages = [];
      pageOffers = {};
    }
    renderHomepageBlocks();
  }

// • هدف عرض الصفحة
  const promoOfferTarget = o => o.target_item_id
    ? { kind: 'item', id: o.target_item_id }
    : o.target_category_id ? { kind: 'category', id: o.target_category_id } : { kind: 'route', href: '#/menu' };

// • نص قيمة العرض
  const offerValueLabel = o => {
    const v = Number(o.value) || 0;
    switch (o.promotion_type) {
      case 'percent': return `خصم ${v}%`;
      case 'fixed': return `خصم ${money(v)}`;
      case 'free_delivery': return 'توصيل مجاني';
      case 'free_item': return 'منتج مجاني';
      case 'free_addon': return 'إضافة مجانية';
      default: return '';
    }

// ─ [JS-20] مجموعات الإضافات: addon_groups وaddon_group_options. التحقق في الواجهة للتجربة فقط، والخادم يطبّق القاعدة نفسها
  /* ═══════════════════════════════════════════════════════════════
     [ADDON GROUPS] addon_groups + addon_group_options
     التحقق في الواجهة للتجربة فقط؛ الخادم يطبّق القاعدة نفسها عند الطلب.
     ═══════════════════════════════════════════════════════════════ */
// • مجموعات الإضافات الحية
  let liveAddonGroups = {};   // item.id -> [{ id, name, required, min, max, options: [addonKey] }]
// • هل مجموعات الإضافات جاهزة
  let liveAddonGroupsReady = false;

// • تحميل مجموعات الإضافات من Supabase
  const loadAddonGroups = async () => {
    if (!sbClient) return;
    try {
      const { data: groups, error } = await sbClient.from('addon_groups')
        .select('id,item_id,name_ar,is_required,min_select,max_select,sort_order,is_active')
        .eq('is_active', true).order('sort_order', { ascending: true });
      if (error) throw error;
      const { data: opts, error: optsErr } = await sbClient.from('addon_group_options')
        .select('id,group_id,item_id,addon_id,sort_order,is_active')
        .eq('is_active', true).order('sort_order', { ascending: true });
      if (optsErr) throw optsErr;
      const byGroup = {};
      (opts || []).forEach(o => { (byGroup[o.group_id] ||= []).push(o); });
      const next = {};
      (groups || []).forEach(g => {
        const options = [...new Set((byGroup[g.id] || []).map(o => addonKeyForId(o.addon_id)).filter(Boolean))];
        if (!options.length) return;
        let min = Math.max(0, Number(g.min_select) || 0);
        if (g.is_required) min = Math.max(1, min);
        const configuredMax = g.max_select == null ? options.length : Number(g.max_select);
        const max = Math.max(min, Number.isFinite(configuredMax) ? configuredMax : options.length);
        (next[g.item_id] ||= []).push({ id: g.id, name: g.name_ar || '', required: min > 0, min, max, options });
      });
      liveAddonGroups = next;
      liveAddonGroupsReady = true;
    } catch (err) {
      console.warn('[AddonGroups] تعذر تحميل مجموعات الإضافات:', err?.message || err);
      liveAddonGroups = {};
      liveAddonGroupsReady = false;
    }
  };

  // يرجع رسالة عربية إذا لم تكتمل الاختيارات، أو null إذا كانت صحيحة
// • التحقق من قواعد المجموعة (للتجربة فقط)
  const addonGroupProblem = (itemId, addons) => {
    const item = ITEM[itemId];
    const selected = [...new Set(Array.isArray(addons) ? addons : [])];
    for (const g of (liveAddonGroups[itemId] || [])) {
      const offered = g.options.filter(k => item?.addons?.includes(k));
      if (!offered.length) continue;
      const n = offered.filter(k => selected.includes(k)).length;
      const min = Math.min(Math.max(0, Number(g.min) || 0), offered.length);
      const configuredMax = Number(g.max);
      const max = Math.min(offered.length, Math.max(min, Number.isFinite(configuredMax) ? configuredMax : offered.length));
      if (n < min) return `لازم تختار ${min} على الأقل من "${g.name}".`;
      if (n > max) return `تقدر تختار ${max} بحد أقصى من "${g.name}".`;
    }
    return null;
  };

// • رسم أقسام الإضافات
  const renderAddonSections = it => {
    const d = state.draft || { addons: [] };
    const opt = a => `<label class="opt ${d.addons.includes(a) ? 'sel' : ''}">
        <span class="opt-label"><strong>${esc(ADDONS[a].name)}</strong>${ADDONS[a].allergens.length ? `<small>بيحتوي على ${ADDONS[a].allergens.map(x => ALLERGENS[x] || x).join(', ')}</small>` : ''}</span>
        <span class="opt-price">+${money(ADDONS[a].sale > 0 && ADDONS[a].sale < ADDONS[a].price ? ADDONS[a].sale : ADDONS[a].price)}${ADDONS[a].sale > 0 && ADDONS[a].sale < ADDONS[a].price ? ` <del>${money(ADDONS[a].price)}</del>` : ''}</span>
        <input type="checkbox" name="addon" value="${esc(a)}" ${d.addons.includes(a) ? 'checked' : ''}>
      </label>`;
    const groups = (liveAddonGroups[it.id] || []).map(g => ({ ...g, options: g.options.filter(k => it.addons.includes(k)) })).filter(g => g.options.length);
    const grouped = new Set(groups.flatMap(g => g.options));
    const groupHtml = groups.map(g => `<div class="option-group" data-addon-group="${esc(g.id)}">
        <h4>${esc(g.name)} <small>${g.required ? 'إلزامي' : 'اختياري'} · من ${g.min} إلى ${g.max}</small></h4>
        ${g.options.map(opt).join('')}
      </div>`).join('');
    const rest = it.addons.filter(a => !grouped.has(a));
    const flatHtml = rest.length ? `<div class="option-group"><h4>إضافات <small>اختياري</small></h4>${rest.map(opt).join('')}</div>` : '';
    return groupHtml + flatHtml;
  };

  // يمنع تجاوز الحد الأقصى من الواجهة قبل تغيير الحالة
// • تفعيل حراس قواعد الإضافات
  const initAddonGroupGuards = () => {
    sheet.addEventListener('change', e => {
      const t = e.target;
      if (!t || t.name !== 'addon' || !t.checked || !state.draft) return;
      const groups = (liveAddonGroups[state.draft.id] || []).filter(g => g.options.includes(t.value));
      const next = [...new Set([...state.draft.addons, t.value])];
      const over = groups.find(g => g.options.filter(k => next.includes(k)).length > g.max);
      if (over) {
        e.stopImmediatePropagation();
        t.checked = false;
        toast(`تقدر تختار ${over.max} بحد أقصى من "${over.name}".`);
      }
    }, true);
  };

        .eq('is_active', true).order('priority', { ascending: false });

  /* ═══════════════════════════════════════════════

// • قراءة الـ hash الحالي
  const currentRoute = () => {
    const r = location.hash.replace(/^#\/?/, '');
    const base = r.split('/')[0];
    return VIEWS[base] ? base : 'home';
  };
// • كل تصنيف له شاشة مستقلة: #/menu/<categoryId>، و#/menu = الكل
  const syncMenuFilterFromHash = () => {
    const m = location.hash.match(/^#\/menu\/(.+)$/);
    if (m) {
      const id = decodeURIComponent(m[1]);
      if (state.filter !== id) { state.filter = id; state.subcat = 'All'; }
    } else if (location.hash === '#/menu' || location.hash === '#/menu/') {
      if (state.filter !== 'All') { state.filter = 'All'; state.subcat = 'All'; }
    }
  };
// • آخر مسار
  let lastRoute = null;

  const setActiveNav = r => {
    document.querySelectorAll('[data-nav]').forEach(el => {
      const on = el.dataset.nav === r;
      el.classList.toggle('active', on);
      if (on) el.setAttribute('aria-current', 'page');
      else el.removeAttribute('aria-current');
    });
  };

// • رسم الشاشة الحالية في #app
  const render = () => {
    const r = currentRoute();
    const changed = r !== lastRoute;
    lastRoute = r;
    if (r === 'menu') syncMenuFilterFromHash();
    setActiveNav(r);
    
    // إخفاء شريط التنقل السفلي في السلة والدفع
    if (r === 'cart' || r === 'checkout') {
      document.body.classList.add('hide-nav');
    } else {
      document.body.classList.remove('hide-nav');
    }

    app.classList.remove('instant');
    const y = changed ? 0 : window.scrollY;
    app.innerHTML = VIEWS[r]();
    if (changed) { app.classList.remove('view-anim'); void app.offsetWidth; }
    window.scrollTo(0, y);
    updateBadges();
    mountRouteWidgets(r);
    Anim.afterRender(changed);
  };

// • إعادة رسم الشاشة
  const refresh = () => {
    readForm();
    const y = window.scrollY;
    app.classList.add('instant');
    const focusId = document.activeElement && document.activeElement.id;
    app.innerHTML = VIEWS[currentRoute()]();
    mountRouteWidgets(currentRoute());
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el && typeof el.focus === 'function') {
        el.focus();
        if (typeof el.setSelectionRange === 'function' && typeof el.value === 'string') {
          try { el.setSelectionRange(el.value.length, el.value.length); } catch {}
        }
      }
    }

    Anim.afterRender(false);

            <textarea id="reviewText" placeholder="رأيك إيه؟ (مطلوب)" maxlength="300" style="width:100%;padding:10px 12px;border-radius:var(--r-xs);border:1px solid var(--line);background:var(--surface);font-size:13.5px;min-height:60px;font-family:inherit;resize:none;margin-bottom:8px">${esc(state.reviewText)}</textarea>

        <button class="btn btn-primary" data-action="madd">ضيف · <span id="mPrice">${money(draftPrice())}</span></button>

    const reviewName = document.getElementById('reviewName');

// • تحديث إجمالي الشيت
  const updateSheetTotals = () => {

// • إضافة المسودة للسلة

// ─ [JS-25] الكوبونات: التحقق من الكوبون وتطبيقه على ملخص الحساب

// • رسائل أخطاء التسعير
  const QUOTE_ERROR_MESSAGES = [

    ['NO_ACTIVE_BRANCH', 'لا يمكن إتمام الطلب حاليًا لعدم وجود فرع نشط. يرجى التواصل مع المطعم.'],

    ['ITEM_OR_SIZE_UNAVAILABLE', 'بعض المنتجات غير متاحة حاليًا، راجع السلة.'],
    ['INVALID_DELIVERY_ZONE', 'منطقة التوصيل غير متاحة.'],
  ];
// • نص خطأ التسعير
  const quoteErrorMessage = raw => {
    const msg = String(raw || '');
    const hit = QUOTE_ERROR_MESSAGES.find(([key]) => msg.includes(key));
    return hit ? hit[1] : 'تعذر حساب الطلب حاليًا. جرّب تاني.';
  };

// • آخر تسعير من السيرفر
  let serverQuote = null;     // { sig, quote, error }  — آخر معاينة من الخادم
// • مؤقت التسعير
  let quoteTimer = null;
// • تسلسل طلبات التسعير
  let quoteSeq = 0;

// • منطقة التوصيل الحالية
  const currentZoneId = () => document.getElementById('fArea')?.value || (window.SHEEPBURGER_ZONES || [])[0]?.id || '';

  // نفس شكل البنود الذي يرسله create_order_secure
// • بناء عناصر طلب التسعير
  const buildQuoteItems = () => {
    const branchState = window.SHEEPBURGER_BRANCH_STATE || { loaded: false, total: 0, active: [], selectedId: null };
    if (!branchState.loaded || (branchState.total > 0 && !branchState.selectedId)) return null;
    const items = state.cart.map(l => {
      const addon_ids = (l.addons || []).map(key => ADDONS[key]?.dbId || liveAddonIds[key]).filter(Boolean);
      if ((l.addons || []).length !== addon_ids.length || addonGroupProblem(l.id, l.addons)) return null;
      const item = ITEM[l.id];
      if (!item || !item.sizes.some(z => String(z.key) === String(l.size))) return null;
      return { item_id: l.id, size_id: l.size, quantity: l.qty, addon_ids, ...(branchState.selectedId ? { branch_id: branchState.selectedId } : {}) };
    });
    if (!items.length || items.some(x => !x)) return null;
    return items;
  };

// • توقيع الطلب لمنع التكرار
  const quoteSignature = () => JSON.stringify({
    lines: state.cart.map(l => [l.id, l.size, l.qty, [...(l.addons || [])].sort()]),
    zone: currentZoneId(),
    branch: window.SHEEPBURGER_BRANCH_STATE?.selectedId || '',
    coupon: state.coupon?.code || '',
    voucher: state.selectedVoucherId || '',
    phone: state.coupon || state.selectedVoucherId ? (normalizeEgyptPhone(state.customer.phone) || '') : ''
  });

// • جلب التسعير من السيرفر
  const fetchServerQuote = async ({ couponCode = null, voucherId = null } = {}) => {
    if (!liveAddonGroupsReady) return { ok: false, error: 'ADDON_GROUPS_NOT_READY' };
    const branchState = window.SHEEPBURGER_BRANCH_STATE || { loaded: false, total: 0, active: [], selectedId: null };
    if (!branchState.loaded) return { ok: false, error: 'BRANCH_LOOKUP_FAILED' };
    if (branchState.total > 0 && !branchState.active.length) return { ok: false, error: 'NO_ACTIVE_BRANCH' };
    if (branchState.active.length > 1 && !branchState.selectedId) return { ok: false, error: 'BRANCH_SELECTION_REQUIRED' };
    const items = buildQuoteItems();
    const zoneId = currentZoneId();
    if (!sbClient || !items || !zoneId) return { ok: false, error: '' };   // الطلب غير مكتمل بعد
    try {
      const phone = normalizeEgyptPhone(state.customer.phone) || null;
      const { data, error } = await sbClient.rpc('preview_order_quote_with_voucher', {
        p_zone_id: zoneId, p_items: items, p_coupon_code: couponCode, p_customer_phone: phone, p_voucher_id: voucherId
      });
      if (error) return { ok: false, error: error.message || '' };
      return { ok: true, quote: data };
    } catch (err) {
      return { ok: false, error: err?.message || '' };
    }
  };

// • تشغيل التسعير من السيرفر
  const runServerQuote = async sig => {
    const seq = ++quoteSeq;
    const res = await fetchServerQuote({ couponCode: state.coupon?.code || null, voucherId: state.selectedVoucherId || null });
    if (seq !== quoteSeq) return;                       // جاءت معاينة أحدث
    serverQuote = { sig, quote: res.ok ? res.quote : null, error: res.ok ? '' : (res.error ? quoteErrorMessage(res.error) : '') };
    if (state.coupon || state.selectedVoucherId) state.couponMsg = serverQuote.error;
    if (['cart', 'checkout'].includes(currentRoute())) refresh();
  };

  // يُستدعى بعد كل رسم؛ لا يطلب من الخادم إلا إذا تغيّرت السلة أو الكوبون أو القسيمة أو المنطقة
// • جدولة التسعير من السيرفر
  const scheduleServerQuote = () => {
    if (!['cart', 'checkout'].includes(currentRoute()) || !state.cart.length) return;
    const sig = quoteSignature();
    if (serverQuote && serverQuote.sig === sig) return;
    clearTimeout(quoteTimer);
    quoteTimer = setTimeout(() => runServerQuote(sig), 250);
  };

  // أسعار بنود السلة من معاينة الخادم (نفس ترتيب السلة) عندما تكون مطابقة للسلة الحالية
// • عناصر تسعير محدّثة
  const freshQuoteItems = () => (serverQuote && serverQuote.quote && serverQuote.sig === quoteSignature() && Array.isArray(serverQuote.quote.items) && serverQuote.quote.items.length === state.cart.length) ? serverQuote.quote.items : null;

  // كل الأرقام المالية (المجموع، التوصيل، الخصومات، الإجمالي) تأتي من الخادم فقط عبر preview_order_quote_with_voucher.
  // لا يوجد أي حساب محلي للأسعار؛ إن لم تكن المعاينة مطابقة للسلة الحالية تُعرض الأرقام صفرًا ويُمنع الدفع.
// • قيمة تسعير فارغة
  const EMPTY_PRICING = () => ({ subtotal: 0, itemDiscounts: 0, deliveryFee: 0, smallOrderFee: 0, serviceFee: 0, couponDiscount: 0, loyaltyDiscount: 0, promotionDiscount: 0, voucherDiscount: 0, total: 0, freeDeliveryReason: null, serverVerified: false });
// • حساب الأسعار والإجمالي
  const calculatePricing = () => {
    if (!state.cart.length || !serverQuote || !serverQuote.quote || serverQuote.sig !== quoteSignature()) return EMPTY_PRICING();
    const q = serverQuote.quote;
    return {
      subtotal: Number(q.subtotal) || 0,
      itemDiscounts: 0,
      smallOrderFee: 0,
      deliveryFee: Math.max(0, q.zone_delivery_fee != null ? Number(q.zone_delivery_fee) + Number(q.delivery_distance_fee || 0) : Number(q.delivery_fee || 0) - Number(q.delivery_service_fee || 0)),
      serviceFee: Math.max(0, Number(q.delivery_service_fee || 0)),
      // discount_total هو إجمالي كل الخصومات؛ نفصل الكوبون والقسيمة حسب حقولهما، والباقي خصم تلقائي من النظام.
      couponDiscount: Math.max(0, Number(q.coupon_discount || 0)),
      loyaltyDiscount: Math.max(0, Number(q.voucher_discount || 0)),
      promotionDiscount: Math.max(0, Number(q.discount_total || 0) - Number(q.coupon_discount || 0) - Number(q.voucher_discount || 0)),
      voucherDiscount: Math.max(0, Number(q.coupon_discount || 0) + Number(q.voucher_discount || 0)),
      total: Number(q.total) || 0,
      freeDeliveryReason: null,
      serverVerified: true
    };
  };

// • تطبيق كوبون
  const applyCoupon = async () => {
    readForm();
    const code = (state.couponInput || '').trim().toUpperCase();
    if (!code) { removeCoupon(); toast('اكتب الكود الأول'); return; }
    state.couponMsg = 'بنتحقق من الكود...'; refresh();
    const res = await fetchServerQuote({ couponCode: code, voucherId: null });
    if (!res.ok) {
      state.coupon = null;
      state.couponMsg = res.error ? quoteErrorMessage(res.error) : 'أضف منتجات للسلة واختار منطقة التوصيل الأول.';
      safeSave(K('coupon'), null); refresh(); toast(state.couponMsg); return;
    }
    state.selectedVoucherId = null;
    state.coupon = { code };
    state.couponInput = code;
    state.couponMsg = '';
    serverQuote = { sig: quoteSignature(), quote: res.quote, error: '' };
    safeSave(K('coupon'), { code });
    scheduleCartSync();
    refresh(); toast('الكوبون اتفعّل 🎉');
  };

// • إزالة الكوبون
  const removeCoupon = () => {
    state.coupon = null; state.couponInput = ''; state.couponMsg = '';
    safeSave(K('coupon'), null);
    scheduleCartSync();
    refresh();
  };

// • تطبيق عرض عيد الميلاد إن وُجد
  const maybeApplyBirthday = () => { /* خصم عيد الميلاد يتم إصداره من الخادم لحساب موثّق فقط. */ };

// • رسالة المصادقة
  const authMessage = (message, isError = true) => {
    const el = document.getElementById('customerAuthMessage');
    if (el) { el.textContent = message; el.style.color = isError ? 'var(--danger, #b42318)' : 'var(--success, #16794b)'; }
    else if (message) toast(message);
  };

// • تسجيل الدخول بكلمة المرور
  const customerPasswordAuth = async (mode) => {
    if (!sbClient || customerAuthBusy) return;
    const email = String(document.getElementById('customerAuthEmail')?.value || '').normalize('NFKC').replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF\u00A0]/g, '').trim().toLowerCase();
    const password = String(document.getElementById('customerAuthPassword')?.value || '');
    const phoneRaw = String(document.getElementById('customerAuthPhone')?.value || '').trim();
    const signupPhone = mode === 'signup' ? normalizeEgyptPhone(phoneRaw) : null;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { authMessage('اكتب بريدًا إلكترونيًا صحيحًا.'); return; }
    if (password.length < 6) { authMessage('كلمة المرور لازم تكون 6 أحرف على الأقل.'); return; }
    if (mode === 'signup' && !signupPhone) { authMessage('رقم الموبايل مطلوب عند إنشاء الحساب، واكتب رقمًا مصريًا صحيحًا يبدأ بـ 010 أو 011 أو 012 أو 015.'); return; }
    customerAuthBusy = true;
    state.customer.email = email;
    if (mode === 'signup') state.customer.phone = signupPhone;
    safeSave(K('customer'), state.customer);
    try {
      let result;
      if (mode === 'signup') {
        result = await sbClient.auth.signUp({ email, password, options: { data: { app: 'sheepburger-customer', phone: signupPhone } } });
      } else {
        result = await sbClient.auth.signInWithPassword({ email, password });
      }
      if (result.error) throw result.error;
      customerAuthUser = result.data?.session?.user || null;
      if (!customerAuthUser || !result.data?.session) {
        customerAuthUser = null;
        refresh();
        authMessage('Supabase أنشأ الحساب أو استقبل طلبه لكن لم يُرجع جلسة دخول. ما تكررش إنشاء الحساب بنفس الإيميل. راجع Authentication → Users وحالة تأكيد البريد، وتأكد أن Confirm email متوقف، ثم سجّل الدخول بعد حل حالة الحساب.');
        return;
      }
      const { data: profile } = await sbClient.from('profiles').select('full_name,phone,birthday').eq('id', customerAuthUser.id).maybeSingle();
      if (profile?.full_name) state.customer.name = profile.full_name;
      if (profile?.phone) state.customer.phone = profile.phone;
      if (profile?.birthday) state.customer.birthday = profile.birthday;
      const profilePhone = mode === 'signup' ? signupPhone : (profile?.phone || null);
      const { error: profileError } = await sbClient.from('profiles').upsert({
        id: customerAuthUser.id,
        full_name: profile?.full_name || null,
        phone: profilePhone,
        birthday: profile?.birthday || null
      }, { onConflict: 'id' });
      if (profileError) {
        console.warn('[Profile] تعذر حفظ بيانات العميل', profileError);
        authMessage(mode === 'signup' ? 'الحساب اتعمل، لكن رقم الموبايل ما اتحفظش. افتح بيانات الحساب واحفظ الرقم مرة تانية.' : 'تم تسجيل الدخول، لكن تعذر تحديث بيانات الحساب.');
      }
      if (profilePhone) state.customer.phone = profilePhone;
      checkoutLoginRequired = false;
      safeSave(K('customer'), state.customer);
      await loadCustomerRewards();
      await loadCustomerNotifications();
      refresh();
      if (!profileError) authMessage(mode === 'signup' ? 'تم إنشاء حسابك وتسجيل الدخول بنجاح، واتحفظ رقم موبايلك.' : 'تم تسجيل الدخول بنجاح.', false);
      toast(mode === 'signup' ? 'أهلًا بيك في SheepBurger ❤️' : 'تم تسجيل الدخول بنجاح');
    } catch (e) {
      const msg = String(e?.message || '').toLowerCase();
      console.warn('[Customer Auth] فشل طلب المصادقة', { mode, code: e?.code || null, status: e?.status || null, message: e?.message || 'unknown error' });
      let friendly = 'تعذر الاتصال بخدمة الحسابات. تأكد من الإنترنت ثم جرّب مرة أخرى.';

// ─ [JS-26] تثبيت PWA: deferredPrompt وزر التثبيت (beforeinstallprompt)
  /* ═══════════════════════════════════════════════

// • حدث التثبيت المؤجل
  let deferredPrompt = null;
// • زر التثبيت

// • تنفيذ التثبيت
  const triggerInstall = async () => {
    if (!deferredPrompt) {
      const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
      toast(ios ? 'اضغط Share ← Add to Home Screen' : 'من قائمة المتصفح اختار "Install app"');

    deferredPrompt.prompt();

    deferredPrompt = null;
    hideInstall();
  };
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; showInstall(); });
  window.addEventListener('appinstalled', () => { deferredPrompt = null; hideInstall(); toast('التطبيق اتثبت 🎉'); });
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) hideInstall();

  };

  const viewProfile = () => {
    const lvl = state.points >= 300 ? 'hot' : state.points >= 100 ? 'medium' : 'mild';
    const next = lvl === 'mild' ? 100 : lvl === 'medium' ? 300 : 500;
    const progress = Math.min(100, (state.points / Math.max(next, 1)) * 100);
    const lvlName = { mild: '🌶 هادي', medium: '🌶🌶 وسط', hot: '🌶🌶🌶 حار' }[lvl];
    const active = state.vouchers.filter(v => !v.used);
    const vouchersLabel = v => {
      if (v.type === 'percent') return `خصم ${Math.round(v.pct * 100)}%`;
      if (v.type === 'delivery') return 'توصيل مجاني';
      if (v.type === 'free_item') return 'إضافة مجانية';
      if (v.type === 'flat') return `خصم ${money(v.amount)}`;
      return 'كوبون';
    };
    const vIcon = v => v.type === 'delivery' ? '🛵' : v.type === 'free_item' ? '🍟' : v.type === 'flat' ? '💷' : '🎟️';

    return `
      <div class="profile-wrap view-anim">
        <div class="profile-head">
          <div class="profile-avatar">${state.customer.name ? esc(state.customer.name.charAt(0).toUpperCase()) : '👤'}</div>
          <h2>${state.customer.name ? esc(state.customer.name) : 'أهلاً بيك'}</h2>
          <p>${state.customer.name ? 'نورتنا تاني' : 'احفظ اسمك عشان نسلم عليك'}</p>
          <div class="name-input-row">
            <input type="text" id="pName" placeholder="اسمك" maxlength="40" value="${esc(state.customer.name || '')}">
            <button class="btn btn-dark btn-sm" data-action="save-name">حفظ</button>
          </div>
        </div>

        <div class="card-block">
          <h3>🍔 كارت الولاء</h3>
          <p style="font-size:13px;color:var(--ink-2);margin-bottom:12px">اجمع ${CONFIG.STAMPS_FOR_REWARD} أختام وخد برجر مجاني.</p>
          <div class="stamps-row">
            ${Array.from({ length: CONFIG.STAMPS_FOR_REWARD }, (_, i) => `<div class="stamp ${i < state.stamps ? 'filled' : ''}">${i < state.stamps ? '✓' : ''}</div>`).join('')}
          </div>
          <p style="font-size:13px;color:var(--ink-2);margin-bottom:${state.freeBurger ? '14px' : '0'}"><strong style="color:var(--ink)">${state.stamps}/${CONFIG.STAMPS_FOR_REWARD}</strong> أختام</p>
          ${state.freeBurger ? '<button class="btn btn-primary btn-block" data-action="claim-free">استلم برجرك المجاني 🍔</button>' : ''}
        </div>

        <div class="card-block">
          <h3>⭐ نقاط المكافآت</h3>
          <div style="margin-bottom:4px"><span style="font-size:12px;font-weight:800;color:var(--primary)">${lvlName}</span></div>
          <div class="points-big">${state.points} نقطة</div>
          <p class="points-sub">1 نقطة لكل ${money(CONFIG.POINTS_DIVISOR)} بتصرفهم</p>
          <div class="points-track"><i style="width:${progress}%"></i></div>
          <p class="points-sub">${Math.max(0, next - state.points)} نقطة للمستوى اللي بعده</p>
          ${state.points >= CONFIG.POINTS_FOR_DISCOUNT ? `<button class="btn btn-primary btn-block" data-action="redeem-points" style="margin-top:12px">استبدل ${CONFIG.POINTS_FOR_DISCOUNT} نقطة بـ ${money(CONFIG.DISCOUNT_VALUE)}</button>` : ''}
        </div>

        ${active.length ? `<div class="card-block">
          <h3>🎁 كوبوناتك</h3>
          ${active.map(v => `<div class="voucher-row">
            <div class="voucher-icon">${vIcon(v)}</div>
            <div class="voucher-info"><strong>${esc(vouchersLabel(v))}</strong><small>بتتطبق تلقائياً عند الدفع</small></div>
          </div>`).join('')}
        </div>` : ''}

        <div class="card-block">
          <h3>🏆 الإنجازات</h3>
          <div class="achievements-grid">
            ${Object.entries(ACHIEVEMENTS).map(([k, a]) => `<div class="ach ${state.achievements.includes(k) ? '' : 'locked'}" title="${esc(a.desc)}">
              <div class="ach-icon">${a.icon}</div>
              <div class="ach-name">${esc(a.name)}</div>
            </div>`).join('')}
          </div>
        </div>

        <div class="menu-list">
          <button class="menu-item" data-action="install-help">📲 ثبّت التطبيق <span class="arrow">←</span></button>
          <button class="menu-item" data-action="go" data-to="#/orders">سجل الطلبات <span class="arrow">←</span></button>
          <button class="menu-item" data-action="toast" data-msg="الدعم الفني قريباً">مساعدة ودعم <span class="arrow">←</span></button>
        </div>
      </div>`;
  };

  const VIEWS = { home: viewHome, menu: viewMenu, cart: viewCart, orders: viewOrders, profile: viewProfile };

  /* ============ ROUTER ============ */
  const currentRoute = () => {
    const r = location.hash.replace(/^#\/?/, '');
    return VIEWS[r] ? r : 'home';
  };
  let lastRoute = null;

  const setActiveNav = r => {
    document.querySelectorAll('[data-nav]').forEach(el => {
      const on = el.dataset.nav === r;
      el.classList.toggle('active', on);
      if (on) el.setAttribute('aria-current', 'page');
      else el.removeAttribute('aria-current');
    });
  };

  const render = () => {
    const r = currentRoute();
    const changed = r !== lastRoute;
    lastRoute = r;
    setActiveNav(r);
    const y = changed ? 0 : window.scrollY;
    app.innerHTML = VIEWS[r]();
    if (changed) { app.classList.remove('view-anim'); void app.offsetWidth; }
    window.scrollTo(0, y);
    updateBadges();
  };

  const refresh = () => {
    readForm();
    const y = window.scrollY;
    const focusId = document.activeElement && document.activeElement.id;
    app.innerHTML = VIEWS[currentRoute()]();
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el && typeof el.focus === 'function') {
        el.focus();
        if (typeof el.setSelectionRange === 'function' && typeof el.value === 'string') {
          try { el.setSelectionRange(el.value.length, el.value.length); } catch {}
        }
      }
    }
    window.scrollTo(0, y);
    updateBadges();
  };

  /* ============ SHEET ============ */
  let lastFocused = null;

  const openItem = (id) => {
    const it = ITEM[id];
    if (!it || (isSecret(it) && !state.secretUnlocked)) return;
    state.draft = { id: it.id, size: it.sizes[0].key, spice: it.spice ? 'وسط' : null, addons: [], note: '', qty: 1, special: null };
    state.reviewStars = 5; state.reviewName = ''; state.reviewText = ''; state.reviewFormOpen = false;
    lastFocused = document.activeElement;
    renderSheet();
    sheet.classList.add('show');
    overlay.classList.add('show');
    sheet.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    const close = sheet.querySelector('.sheet-close');
    if (close) close.focus({ preventScroll: true });
  };

  const closeSheet = () => {
    sheet.classList.remove('show');
    overlay.classList.remove('show');
    sheet.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    state.draft = null;
    if (lastFocused && typeof lastFocused.focus === 'function') { try { lastFocused.focus({ preventScroll: true }); } catch {} }
    lastFocused = null;
  };

  const draftPrice = () => {
    if (!state.draft) return 0;
    return round2(unitPrice({ ...state.draft, qty: 1 }, { coupon: state.coupon }) * state.draft.qty);
  };

  const renderSheet = () => {
    if (!state.draft) return;
    const d = state.draft, it = ITEM[d.id];
    if (!it) return;
    const allergens = [...new Set([...it.allergens, ...d.addons.flatMap(a => ADDONS[a]?.allergens || [])])];
    const reviews = state.ratings[it.id] || [];
    const rating = getRating(it.id);

    sheetBody.innerHTML = `
      <div class="sheet-img">
        <img src="${esc(it.img)}" alt="${esc(it.name)}">
        <button class="sheet-close" data-action="close-sheet" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="sheet-content">
        <h2 class="sheet-title" id="sheetTitle">${esc(it.name)}</h2>
        <div class="sheet-meta">
          ${rating.count > 0 ? `<span class="rating"><span class="star">★</span>${rating.avg.toFixed(1)} <span style="font-weight:400;color:var(--ink-2)">(${rating.count})</span></span><span class="dot"></span>` : ''}
          <span class="price-ltr">${it.sizes.length > 1 ? 'من ' : ''}${money(fromPrice(it))}</span>
        </div>
        <p class="sheet-desc">${esc(it.desc)}</p>

        <div class="option-group">
          <h4>الحجم</h4>
          ${it.sizes.map(s => `<label class="opt ${d.size === s.key ? 'sel' : ''}">
            <span class="opt-label"><strong>${esc(s.label)}</strong></span>
            <span class="opt-price">${money(s.price)}</span>
            <input type="radio" name="size" value="${esc(s.key)}" ${d.size === s.key ? 'checked' : ''}>
          </label>`).join('')}
        </div>

        ${it.spice ? `<div class="option-group">
          <h4>درجة الحرارة</h4>
          <div class="pillrow">
            ${SPICE_LEVELS.map((sp, i) => `<label class="opt ${d.spice === sp ? 'sel' : ''}">
              <span class="opt-label"><strong>${'🌶'.repeat(i + 1)} ${esc(sp)}</strong></span>
              <input type="radio" name="spice" value="${esc(sp)}" ${d.spice === sp ? 'checked' : ''}>
            </label>`).join('')}
          </div>
        </div>` : ''}

        ${it.addons.length ? `<div class="option-group">
          <h4>إضافات <small>اختياري</small></h4>
          ${it.addons.map(a => `<label class="opt ${d.addons.includes(a) ? 'sel' : ''}">
            <span class="opt-label"><strong>${esc(ADDONS[a].name)}</strong>${ADDONS[a].allergens.length ? `<small>بيحتوي على ${ADDONS[a].allergens.map(x => ALLERGENS[x]).join(', ')}</small>` : ''}</span>
            <span class="opt-price">+${money(ADDONS[a].price)}</span>
            <input type="checkbox" name="addon" value="${esc(a)}" ${d.addons.includes(a) ? 'checked' : ''}>
          </label>`).join('')}
        </div>` : ''}

        <div class="option-group">
          <h4>ملاحظات للمطبخ <small>اختياري</small></h4>
          <textarea class="note-input" id="noteInput" maxlength="80" placeholder="مثلاً: من غير بصل، صوص زيادة">${esc(d.note)}</textarea>
        </div>

        ${allergens.length ? `<div class="allergy-note">⚠️ بيحتوي على: ${allergens.map(a => ALLERGENS[a] || esc(a)).join(' · ')}</div>` : ''}

        <div class="option-group">
          <h4 style="justify-content:space-between"><span>التقييمات${rating.count ? ` · ${rating.avg.toFixed(1)}` : ''}</span><button class="btn btn-outline btn-sm" data-action="toggle-review" style="font-weight:700">اكتب</button></h4>
          ${reviews.length === 0 ? '<p style="font-size:13.5px;color:var(--ink-2);padding:14px;background:var(--bg-2);border-radius:var(--r-sm)">كن أول من يقيّم الحاجة دي.</p>' : reviews.slice().reverse().slice(0, 5).map(r => `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:8px">
              <strong style="font-size:13.5px">${esc(r.name)}${r.sessionId === sessionId ? ' <span style="color:var(--success);font-size:11px">✓ انت</span>' : ''}</strong>
              <span style="font-size:11.5px;color:var(--ink-3)">${esc(r.date)}</span>
            </div>
            <div style="color:var(--accent);font-size:13px;margin-bottom:4px;direction:ltr;text-align:right">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</div>
            <p style="font-size:13.5px;color:var(--ink-2);line-height:1.6">${esc(r.text)}</p>
          </div>`).join('')}
          <div id="reviewForm" style="margin-top:14px;padding:14px;background:var(--bg-2);border-radius:var(--r-sm);${state.reviewFormOpen ? '' : 'display:none'}">
            <div style="display:flex;gap:3px;margin-bottom:10px;direction:ltr" id="starPicker">
              ${[1,2,3,4,5].map(i => `<button type="button" data-action="pick-star" data-star="${i}" aria-label="${i} نجمة" style="background:none;border:0;font-size:26px;padding:0;color:${i <= state.reviewStars ? 'var(--accent)' : 'var(--ink-3)'};cursor:pointer">★</button>`).join('')}
            </div>
            <input type="text" id="reviewName" placeholder="اسمك (اختياري)" maxlength="30" value="${esc(state.reviewName)}" style="width:100%;padding:10px 12px;border-radius:var(--r-xs);border:1px solid var(--line);background:var(--surface);font-size:13.5px;margin-bottom:8px">
            <textarea id="reviewText" placeholder="رأيك إيه؟ (مطلوب)" maxlength="300" style="width:100%;padding:10px 12px;border-radius:var(--r-xs);border:1px solid var(--line);background:var(--surface);font-size:13.5px;min-height:60px;font-family:inherit;resize:none;margin-bottom:8px">${esc(state.reviewText)}</textarea>
            <div style="display:flex;gap:8px;justify-content:flex-end">
              <button class="btn btn-outline btn-sm" data-action="cancel-review">إلغاء</button>
              <button class="btn btn-dark btn-sm" data-action="submit-review">إرسال</button>
            </div>
          </div>
        </div>
      </div>
      <div class="sheet-footer">
        <div class="qty-stepper">
          <button data-action="mqty" data-d="-1" aria-label="تقليل">−</button>
          <span id="mQty">${d.qty}</span>
          <button data-action="mqty" data-d="1" aria-label="زيادة">+</button>
        </div>
        <button class="btn btn-primary" data-action="madd">ضيف · <span id="mPrice">${money(draftPrice())}</span></button>
      </div>`;

    const reviewName = document.getElementById('reviewName');
    const reviewText = document.getElementById('reviewText');
    if (reviewName) reviewName.addEventListener('input', e => state.reviewName = e.target.value);
    if (reviewText) reviewText.addEventListener('input', e => state.reviewText = e.target.value);
    const noteInput = document.getElementById('noteInput');
    if (noteInput) noteInput.addEventListener('input', e => { if (state.draft) state.draft.note = e.target.value.slice(0, 80); });
  };

  const updateSheetTotals = () => {
    const q = document.getElementById('mQty');
    const p = document.getElementById('mPrice');
    if (q && state.draft) q.textContent = state.draft.qty;
    if (p) p.textContent = money(draftPrice());
  };

  const commitDraft = () => {
    const d = state.draft; if (!d) return;
    addLineToCart({ id: d.id, size: d.size, spice: d.spice, addons: [...d.addons].sort(), note: d.note.trim(), qty: d.qty, special: null });
    toast(`${d.qty}× ${ITEM[d.id].name} اتضاف`);
  };

  /* ============ COUPON ============ */
  const applyCoupon = () => {
    readForm();
    const code = (state.couponInput || '').trim().toUpperCase();
    if (!code) { state.coupon = null; state.couponMsg = 'اكتب الكود الأول'; safeSave(K('coupon'), null); }
    else if (COUPONS[code]) { state.coupon = { code, pct: COUPONS[code] }; state.couponMsg = ''; state.couponInput = code; safeSave(K('coupon'), { code }); }
    else { state.coupon = null; state.couponMsg = 'الكود غلط'; safeSave(K('coupon'), null); }
    refresh();
    toast(state.coupon ? 'الكوبون اتفعّل 🎉' : state.couponMsg);
  };

  const maybeApplyBirthday = () => {
    if (!isBirthday(state.customer.birthday)) return;
    if (state.birthdayApplied === today()) return;
    if (state.coupon && state.coupon.code === 'BIRTHDAY50') return;
    state.coupon = { code: 'BIRTHDAY50', pct: COUPONS.BIRTHDAY50 };
    state.couponInput = 'BIRTHDAY50';
    safeSave(K('coupon'), { code: 'BIRTHDAY50' });
    state.birthdayApplied = today();
    safeSave(K('birthday_applied'), state.birthdayApplied);
    setTimeout(() => { toast('🎂 كل سنة وانت طيب! خصم 50%'); if (currentRoute() === 'cart') refresh(); }, 300);
  };

  const saveName = () => {
    const input = document.getElementById('pName');
    const name = (input ? input.value : '').trim().slice(0, 40);
    if (name.length < 2) { toast('اكتب اسم صحيح'); return; }
    state.customer.name = name;
    safeSave(K('customer'), state.customer);
    toast(`أهلاً ${name} 👋`);
    refresh();
  };

  const addChefSpecial = () => {
    if (!state.chefSpecial) return;
    const it = ITEM[state.chefSpecial.id];
    if (!it) return;
    addLineToCart({ id: it.id, size: it.sizes[0].key, spice: it.spice ? 'وسط' : null, addons: [], note: '', qty: 1, special: { type: 'percent', pct: state.chefSpecial.discount } });
    toast(`اتضاف بخصم ${Math.round(state.chefSpecial.discount * 100)}%`);
  };

  /* ============ INSTALL ============ */
  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');
  const showInstall = () => installBtn.classList.add('show');
  const hideInstall = () => installBtn.classList.remove('show');
  const triggerInstall = async () => {
    if (!deferredPrompt) {
      const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
      toast(ios ? 'اضغط Share ← Add to Home Screen' : 'من قائمة المتصفح اختار "Install app"');
      return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') toast('التطبيق اتثبت 🎉');
    deferredPrompt = null;
    hideInstall();
  };
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; showInstall(); });
  window.addEventListener('appinstalled', () => { deferredPrompt = null; hideInstall(); toast('التطبيق اتثبت 🎉'); });
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) hideInstall();
  installBtn.addEventListener('click', triggerInstall);

  /* ============ EVENTS ============ */
  document.addEventListener('click', e => {
    const catLink = e.target.closest('a[data-cat]');
    if (catLink) { state.filter = catLink.dataset.cat; state.subcat = 'All'; return; }

    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;

    switch (action) {
      case 'open': openItem(el.dataset.id); break;
      case 'quick': {
        e.stopPropagation();
        const it = ITEM[el.dataset.id];
        if (!it || (isSecret(it) && !state.secretUnlocked)) return;
        addLineToCart({ id: it.id, size: it.sizes[0].key, spice: it.spice ? 'وسط' : null, addons: [], note: '', qty: 1, special: null });
        toast(`${it.name} اتضاف`);
        el.classList.add('done'); el.textContent = '✓';
        setTimeout(() => { el.classList.remove('done'); el.textContent = '+'; }, 900);
        break;
      }
      case 'filter': state.filter = el.dataset.val; state.subcat = 'All'; refresh(); break;
      case 'subfilter': state.subcat = el.dataset.val; refresh(); break;
      case 'qty': changeQty(el.dataset.uid, Number(el.dataset.d)); break;
      case 'mqty': if (!state.draft) return; state.draft.qty = clamp(state.draft.qty + Number(el.dataset.d), 1, CONFIG.MAX_QTY); updateSheetTotals(); break;
      case 'madd': commitDraft(); closeSheet(); break;
      case 'close-sheet': closeSheet(); break;
      case 'apply-coupon': applyCoupon(); break;
      case 'checkout': checkout(); break;
      case 'save-name': saveName(); break;
      case 'toast': toast(el.dataset.msg); break;
      case 'go': location.hash = el.dataset.to; break;
      case 'reorder': reorder(el.dataset.orderId); break;
      case 'add-special': addChefSpecial(); break;
      case 'redeem-points': redeemPoints(); break;
      case 'claim-free': claimFreeBurger(); break;
      case 'unlock-secret': unlockSecret(); break;
      case 'toggle-review': state.reviewFormOpen = !state.reviewFormOpen; renderSheet(); break;
      case 'cancel-review': state.reviewFormOpen = false; state.reviewName = ''; state.reviewText = ''; renderSheet(); break;
      case 'pick-star': {
        state.reviewStars = Number(el.dataset.star);
        const container = document.getElementById('starPicker');
        if (container) container.querySelectorAll('button').forEach((b, i) => {
          b.style.color = i < state.reviewStars ? 'var(--accent)' : 'var(--ink-3)';
        });
        break;
      }
      case 'submit-review': {
        const n = document.getElementById('reviewName');
        const t = document.getElementById('reviewText');
        state.reviewName = n ? n.value : '';
        state.reviewText = t ? t.value : '';
        if (state.draft) submitReview(state.draft.id);
        break;
      }
      case 'install-help': triggerInstall(); break;
    }
  });

  sheet.addEventListener('change', e => {
    const d = state.draft, t = e.target;
    if (!d || !t.name) return;
    if (t.name === 'size') d.size = t.value;
    else if (t.name === 'spice') d.spice = t.value;
    else if (t.name === 'addon') d.addons = t.checked ? [...new Set([...d.addons, t.value])] : d.addons.filter(x => x !== t.value);
    else return;
    renderSheet();
  });

  sheet.addEventListener('input', e => {
    if (e.target.id === 'noteInput' && state.draft) state.draft.note = e.target.value.slice(0, 80);
    if (e.target.id === 'reviewName') state.reviewName = e.target.value;
    if (e.target.id === 'reviewText') state.reviewText = e.target.value;
  });

  app.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'search') {
      state.query = e.target.value;
      const grid = document.querySelector('[data-grid]');
      if (!grid) return;
      const list = filteredItems();
      grid.innerHTML = list.length ? list.map(productCard).join('') : '<p style="grid-column:1/-1;text-align:center;padding:40px;color:var(--ink-2)">مفيش نتايج للبحث</p>';
      return;
    }
    if (id === 'coupon') { state.couponInput = e.target.value.trim(); return; }
    const map = { fName: 'name', fPhone: 'phone', fArea: 'area', fStreet: 'street', fBuilding: 'building', fFloor: 'floor', fApt: 'apt', fBirthday: 'birthday' };
    if (map[id]) {
      state.customer[map[id]] = e.target.value.trim().slice(0, 60);
      safeSave(K('customer'), state.customer);
      if (map[id] === 'birthday') maybeApplyBirthday();
    }
  });

  app.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.target.matches('[data-action="unlock-secret"]') || e.target.id === 'secretCode')) {
      e.preventDefault(); unlockSecret();
    }
  });

  stickyCart.addEventListener('click', () => { location.hash = '#/cart'; });
  stickyCart.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.hash = '#/cart'; } });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sheet.classList.contains('show')) { closeSheet(); return; }
    if (e.key === 'Enter' && e.target.matches('[data-action="open"]')) { e.preventDefault(); e.target.click(); return; }
    if (e.key === 'Tab' && sheet.classList.contains('show')) {
      const fs = sheet.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      const list = Array.from(fs).filter(el => !el.disabled && el.offsetParent !== null);
      if (!list.length) return;
      const first = list[0], last = list[list.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  window.addEventListener('hashchange', render);

  /* ============ BOOT ============ */
  (function boot() {
    if (!location.hash) location.hash = '#/home';
    if (!state.secretUnlocked && state.stats.totalOrders >= CONFIG.SECRET_ORDERS_NEEDED) {
      state.secretUnlocked = true;
      safeSave(K('secret_unlocked'), true);
    }
    refreshLive();
    if (state.orders.some(o => o.status < 3)) startTracking();
    maybeApplyBirthday();
    render();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  })();
})();
</script>
</body>
</html>

// ─ [JS-27] الأنيميشن: كائن Anim للحركات الخفيفة. يحترم تقليل الحركة
  /* ═══════════════════════════════════════════════
     [JS] الأنيميشن (الأصلي)
     ═══════════════════════════════════════════════ */
// • كائن الأنيميشن
  const Anim = {
    lastCount: 0, vals: {}, io: null,

    afterRender(isNewPage) {
      this.reveal(isNewPage);
      const t = app.querySelector('.summary-row.total .num');
      if (t) this.countUp(t, parseFloat(t.textContent) || 0, 'cartTotal');
    },

    reveal(animate) {
      if (this.io) this.io.disconnect();
      const els = [...app.querySelectorAll('.product,.card-block,.featured-deal,.sec-head,.summary,.profile-head')].filter(e => !e.closest('.stagger') && !e.closest('.horizontal'));
      if (reduceMotion.matches || !animate || !('IntersectionObserver' in window)) return;
      let n = 0;
      this.io = new IntersectionObserver(es => es.forEach(en => {
        if (!en.isIntersecting) return;
        en.target.style.setProperty('--d', Math.min(n++ % 6, 5) * 70 + 'ms');
        en.target.classList.add('in');
        this.io.unobserve(en.target);
      }), { threshold: .12, rootMargin: '0px 0px -30px 0px' });
      els.forEach(e => { e.classList.add('reveal'); this.io.observe(e); });
      clearTimeout(this.safe); this.safe = setTimeout(() => els.forEach(e => e.classList.add('in')), 2500);
    },

    countUp(el, to, key) {
      const from = this.vals[key] ?? to;
      this.vals[key] = to;
      if (reduceMotion.matches || from === to) { el.textContent = money(to); return; }
      const t0 = performance.now(), D = 450;
      const step = now => {
        const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
        el.textContent = money(from + (to - from) * e);
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },

    flyToCart(from) {
      if (reduceMotion.matches || !from) return;
      const nav = document.querySelector('.bottom-nav a[data-nav="cart"] .ic');
      const dest = (nav && nav.offsetParent) ? nav : document.querySelector('.actions a[href="#/cart"]');
      if (!dest) return;
      const a = from.getBoundingClientRect(), b = dest.getBoundingClientRect();
      const dot = document.createElement('div');
      dot.className = 'fly-dot'; dot.textContent = '🍔';
      dot.style.left = (a.left + a.width / 2 - 11) + 'px';
      dot.style.top = (a.top + a.height / 2 - 11) + 'px';
      document.body.appendChild(dot);
      const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
      dot.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(.35)`, opacity: .5 }], { duration: 650, easing: 'cubic-bezier(.5,-.2,.6,1)' }).onfinish = () => dot.remove();
    },

    gridSwap() {
      if (reduceMotion.matches) return;
      app.querySelectorAll('[data-grid] .product').forEach((e, i) => {
        e.style.setProperty('--d', Math.min(i, 10) * 45 + 'ms');
        e.classList.add('swap');
      });
      const pill = app.querySelector('.cat-pill.active');
      if (pill) { pill.classList.add('pop'); pill.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); }
    },

    ripple(e) {
      const b = e.target.closest('.btn,.hero-cta,.add-btn');
      if (!b || reduceMotion.matches) return;
      const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height);
      const sp = document.createElement('span');
      sp.className = 'ripple';
      sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
      b.appendChild(sp);
      setTimeout(() => sp.remove(), 650);
    }
  };
  document.addEventListener('pointerdown', e => Anim.ripple(e));

// • تبديل التحديث
  const swapRefresh = () => {
    const sc = [...app.querySelectorAll('.cats')].map(c => c.scrollLeft);
    refresh();
    app.querySelectorAll('.cats').forEach((c, i) => { if (sc[i] != null) c.scrollLeft = sc[i]; });

      case 'reorder': reorder(el.dataset.orderId); break;
      case 'add-special': addChefSpecial(); break;
      case 'redeem-points': redeemPoints(); break;
      case 'use-reward-voucher': {
        const voucher = (state.remoteVouchers || []).find(v => v.id === el.dataset.voucherId);
        if (!customerAuthUser || !voucher) { toast('سجّل بإيميلك الأول عشان تستخدم المكافأة.'); return; }
        if (voucher.redeemed_at || voucher.redeemed_order_id || (voucher.expires_at && Date.parse(voucher.expires_at) <= Date.now())) { toast('المكافأة دي مش متاحة للاستخدام.'); return; }
        state.selectedVoucherId = voucher.id; state.coupon = null; state.couponInput = ''; state.couponMsg = ''; safeSave(K('coupon'), null); scheduleCartSync();
        toast('اتحددت المكافأة للطلب القادم.'); location.hash = state.cart.length ? '#/cart' : '#/menu'; refresh(); break;
      }
      case 'retry-menu': loadLiveMenu(); break;
      case 'clear-reward-voucher': state.selectedVoucherId = null; scheduleCartSync(); refresh(); toast('تم إلغاء اختيار المكافأة.'); break;
      case 'unlock-secret': unlockSecret(); break;
      case 'toggle-review': state.reviewFormOpen = !state.reviewFormOpen; renderSheet(); break;
      case 'cancel-review': state.reviewFormOpen = false; state.reviewName = ''; state.reviewText = ''; renderSheet(); break;
      case 'pick-star': {
        state.reviewStars = Number(el.dataset.star);
        const container = document.getElementById('starPicker');
        if (container) container.querySelectorAll('button').forEach((b, i) => {
          b.style.color = i < state.reviewStars ? 'var(--accent)' : 'var(--ink-3)';
        });
        break;
      }
      case 'submit-review': {
        const n = document.getElementById('reviewName');
        const t = document.getElementById('reviewText');
        state.reviewName = n ? n.value : '';
        state.reviewText = t ? t.value : '';
        if (state.draft) submitReview(state.draft.id);
        break;
      }
      case 'install-help': triggerInstall(); break;
      // الأحداث الجديدة المضافة
      case 'toggle-instruction':
        el.classList.toggle('active');
        break;
    }
  });

  sheet.addEventListener('change', e => {
    const d = state.draft, t = e.target;
    if (!d || !t.name) return;
    if (t.name === 'size') d.size = t.value;
    else if (t.name === 'spice') d.spice = t.value;
    else if (t.name === 'addon') d.addons = t.checked ? [...new Set([...d.addons, t.value])] : d.addons.filter(x => x !== t.value);
    else return;
    renderSheet();
  });

  sheet.addEventListener('input', e => {
    if (e.target.id === 'noteInput' && state.draft) state.draft.note = e.target.value.slice(0, 80);
    if (e.target.id === 'reviewName') state.reviewName = e.target.value;
    if (e.target.id === 'reviewText') state.reviewText = e.target.value;
  });

  app.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'search') {
      state.query = e.target.value;
      const grid = document.querySelector('[data-grid]');
      if (!grid) return;
      const list = filteredItems();
      grid.innerHTML = list.length ? list.map(productCard).join('') : '<p style="grid-column:1/-1;text-align:center;padding:40px;color:var(--ink-2)">مفيش نتايج للبحث</p>';
      Anim.gridSwap();
      return;
    }
    if (id === 'coupon') { state.couponInput = e.target.value.trim(); return; }
    if (id === 'orderNotes') { state.cartNotes = e.target.value; scheduleCartSync(); return; } // حفظ الملاحظات
    
    const map = { fName: 'name', fPhone: 'phone', fArea: 'area', fStreet: 'street', fBuilding: 'building', fFloor: 'floor', fApt: 'apt', fBirthday: 'birthday' };
    if (map[id]) {
      state.customer[map[id]] = e.target.value.trim().slice(0, 60);
      safeSave(K('customer'), state.customer);
      if (map[id] === 'birthday') maybeApplyBirthday();
    }
  });

  app.addEventListener('change', e => {
    if (e.target?.id === 'savedAddress') {
      const a = liveCustomerAddresses.find(x => String(x.id) === String(e.target.value));
      if (a) {
        const zone = (window.SHEEPBURGER_ZONES || []).find(z => String(z.name_ar).trim() === String(a.area).trim());
        state.customer = { ...state.customer, name: a.recipient_name || state.customer.name || '', phone: a.phone || state.customer.phone || '', area: zone?.id || a.area, street: a.street || '', building: a.building || '', floor: a.floor || '', apt: a.apartment || '' };
        safeSave(K('customer'), state.customer); refresh();
      }
      return;
    }
    if (e.target?.id === 'fArea') {
      state.customer.area = e.target.value;
      scheduleCartSync();
      safeSave(K('customer'), state.customer);
      refresh();
    }
  });

  app.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.target.matches('[data-action="unlock-secret"]') || e.target.id === 'secretCode')) {
      e.preventDefault(); unlockSecret();
    }
  });

  stickyCart.addEventListener('click', () => { location.hash = '#/cart'; });
  stickyCart.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.hash = '#/cart'; } });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sheet.classList.contains('show')) { closeSheet(); return; }
    if (e.key === 'Enter' && e.target.matches('[data-action="open"]')) { e.preventDefault(); e.target.click(); return; }
    if (e.key === 'Tab' && sheet.classList.contains('show')) {
      const fs = sheet.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      const list = Array.from(fs).filter(el => !el.disabled && el.offsetParent !== null);
      if (!list.length) return;
      const first = list[0], last = list[list.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  window.addEventListener('hashchange', () => {
    render();
    if (currentRoute() === 'notifications' && customerAuthUser) loadCustomerNotifications({ quiet: false });
  });
  
  setInterval(() => {
    if (customerAuthUser && document.visibilityState !== 'hidden') {
      loadCustomerNotifications({ quiet: currentRoute() !== 'notifications' });
      if (currentRoute() === 'profile' && !document.querySelector('#app input:focus, #app select:focus, #app textarea:focus')) loadCustomerRewards().then(() => { if (!document.querySelector('#app input:focus, #app select:focus, #app textarea:focus')) refresh(); }).catch(() => {});
    }
  }, 30000);
  
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && customerAuthUser) loadCustomerNotifications({ quiet: currentRoute() !== 'notifications' });
  });

// ─ [JS-29] الـ Boot: تشغيل التطبيق والتهيئة النهائية. يُنفَّذ آخراً بعد تعريف كل الدوال والثوابت
  /* ═══════════════════════════════════════════════
     [JS] التشغيل (الأصلي)
     ═══════════════════════════════════════════════ */
  (function boot() {
    Promise.resolve(loadLiveMenu()).then(() => Promise.all([loadAddonGroups(), loadItemBadges(), loadPromotionPages(), loadRatingSummary()])).catch(() => {});
    initAddonGroupGuards();
    loadAchievementDefinitions().then(() => { if (currentRoute() === 'profile') refresh(); }).catch(() => {});
    startLiveMenu();
    loadHomeBanners();
    loadAnnouncements();
    loadHomepageBlocks();
    loadHomepageSectionOrder();
    setInterval(() => { loadHomeBanners(); loadAnnouncements(); loadHomepageBlocks(); loadHomepageSectionOrder(); loadPromotionPages(); loadLiveMenu(); loadItemBadges(); loadRatingSummary(); }, 5 * 60 * 1000);
    if (!location.hash) location.hash = '#/home';
    state.secretUnlocked = false;
    if (sbClient) {
      sbClient.auth.getSession().then(async ({ data }) => {
        customerAuthUser = data?.session?.user || null;
        if (customerAuthUser) {
          await loadAchievementDefinitions();
          state.customer.email = customerAuthUser.email || '';
          const { data: profile } = await sbClient.from('profiles').select('full_name,phone,birthday').eq('id', customerAuthUser.id).maybeSingle();
          if (profile) {
            if (profile.full_name) state.customer.name = profile.full_name;
            if (profile.phone) state.customer.phone = profile.phone;
            if (profile.birthday) state.customer.birthday = profile.birthday;
            safeSave(K('customer'), state.customer);
          }
          await loadCustomerRewards();
          await loadCustomerAddresses();
          await loadCustomerNotifications();
          syncCustomerData();
        } else {
          if (state.customer.email) { state.customer.email = ''; safeSave(K('customer'), state.customer); }
        }
        if (currentRoute() === 'profile') refresh();
      }).catch(() => {});
      sbClient.auth.onAuthStateChange((_event, session) => {
        customerAuthUser = session?.user || null;
        if (!customerAuthUser) { customerOtpSent = false; state.customerNotifications = []; clearCustomerLocalState(); updateBadges(); }
        else { setTimeout(() => { loadCustomerAddresses().then(() => { if (currentRoute() === 'checkout') refresh(); }); loadCustomerNotifications(); syncCustomerData(); }, 0); }
        if (currentRoute() === 'profile' || currentRoute() === 'notifications') setTimeout(() => refresh(), 0);
      });
    }
    if (state.orders.some(o => o.status < 3)) startTracking();
    render();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./SW.js').catch(() => {}));
    }
  })();
})();
</script>
</body>
</html>

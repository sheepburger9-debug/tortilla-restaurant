<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="برجر طازج، بطاطس، ومشروبات. اطلب توصيل لحد باب البيت.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FAF5EC">
<title>Sheep & Burger — برجر طازة</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sheep & Burger">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,700..900;1,9..144,500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#FAF5EC;
  --bg-2:#F3EBDC;
  --surface:#FFFFFF;
  --ink:#1F1610;
  --ink-2:#6E6154;
  --ink-3:#A89988;
  --primary:#D9401F;
  --primary-dark:#B03214;
  --primary-soft:#FCEAE4;
  --accent:#E8A425;
  --line:#EDE2D2;
  --success:#2F7D32;
  --success-soft:#E8F5E9;
  --danger:#C62828;
  --serif:'Fraunces', Georgia, serif;
  --sans:'Cairo', system-ui, -apple-system, sans-serif;
  --r-xs:10px; --r-sm:14px; --r-md:20px; --r-lg:28px; --r-full:999px;
  --shadow-sm:0 1px 2px rgba(31,22,16,.06), 0 2px 8px rgba(31,22,16,.04);
  --shadow-md:0 4px 14px rgba(31,22,16,.08), 0 8px 32px rgba(31,22,16,.06);
  --shadow-lg:0 20px 40px rgba(31,22,16,.12);
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --nav-h:64px;
  --bottom-h:72px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;
  overflow-x:hidden;padding-bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px) + 20px);
  -webkit-font-smoothing:antialiased;
}
button,a,input,textarea,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
img{display:block;max-width:100%}
svg{width:20px;height:20px;flex-shrink:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
.muted{color:var(--ink-2)}
.price-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ============ HEADER ============ */
.topbar{
  position:sticky;top:0;z-index:100;background:rgba(250,245,236,.92);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);
}
.topbar .container{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.brand .logo-mark{
  width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-size:20px;flex-shrink:0;overflow:hidden;
}
.brand .logo-mark img{width:100%;height:100%;object-fit:cover}
.brand-text{line-height:1.15}
.brand-text .brand-name{font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:-.02em;display:block}
.brand-text small{font-size:10.5px;font-weight:600;color:var(--primary);letter-spacing:.06em;text-transform:uppercase;display:block;margin-top:2px}

.actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink);position:relative;transition:transform .2s var(--ease),background .2s,border-color .2s;
}
.icon-btn:hover{background:var(--bg-2);border-color:var(--ink-3)}
.icon-btn:active{transform:scale(.94)}
.badge{
  position:absolute;top:-3px;left:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--primary);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--bg);transform:scale(0);transition:transform .3s var(--spring);
}
.badge.show{transform:scale(1)}

.desk-nav{display:none;gap:24px;margin-right:auto;margin-left:20px}
.desk-nav a{font-size:14.5px;font-weight:700;color:var(--ink-2);position:relative;padding:6px 0;transition:color .15s}
.desk-nav a:hover,.desk-nav a.active{color:var(--ink)}
.desk-nav a.active::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--primary);border-radius:2px}

/* ============ HERO ============ */
.hero{position:relative;margin:20px 0 24px;border-radius:var(--r-lg);overflow:hidden;min-height:340px;display:flex;align-items:flex-end;isolation:isolate;box-shadow:var(--shadow-lg)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,5,.15) 0%,rgba(20,10,5,.55) 60%,rgba(20,10,5,.85) 100%);z-index:-1}
.hero-content{padding:32px 28px;color:#fff;width:100%}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);
  backdrop-filter:blur(8px);padding:6px 12px;border-radius:var(--r-full);
  font-size:12px;font-weight:600;letter-spacing:.04em;margin-bottom:14px;
  border:1px solid rgba(255,255,255,.25);
}
.hero-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(232,164,37,.3)}
.hero h1{font-size:clamp(28px, 6.5vw, 46px);font-weight:900;line-height:1.15;letter-spacing:-.02em;margin-bottom:10px;max-width:520px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:15.5px;color:rgba(255,255,255,.9);margin-bottom:20px;max-width:420px;line-height:1.6}
.hero-cta{
  display:inline-flex;align-items:center;gap:10px;background:var(--primary);color:#fff;
  padding:14px 24px;border-radius:var(--r-full);font-weight:700;font-size:15px;
  box-shadow:0 8px 20px rgba(217,64,31,.35);transition:transform .2s var(--ease),background .2s;
}
.hero-cta:hover{background:var(--primary-dark);transform:translateY(-2px)}
@media(min-width:900px){
  .hero{min-height:440px;margin:28px 0 36px}
  .hero-content{padding:56px}
  .hero h1{font-size:clamp(40px, 5vw, 60px)}
  .hero p{font-size:18px}
}

/* ============ SECTIONS ============ */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:32px 0 16px;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:24px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
.sec-head h2 em{font-style:normal;color:var(--primary)}
.sec-head .more{font-size:13.5px;font-weight:700;color:var(--primary);display:inline-flex;align-items:center;gap:4px}
.sec-head .more svg{width:16px;height:16px;transition:transform .2s}
.sec-head .more:hover svg{transform:translateX(-3px)}

/* ============ FREE DELIVERY BAR ============ */
.free-bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 18px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.free-bar-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:10px;gap:12px}
.free-bar-row strong{font-weight:700;color:var(--primary)}
.free-bar-track{height:8px;border-radius:8px;background:var(--bg-2);overflow:hidden}
.free-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:8px;transition:width .6s var(--ease)}
.free-bar.unlocked .free-bar-fill{background:linear-gradient(90deg,var(--success),#4CAF50)}

/* ============ CATEGORY PILLS ============ */
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:8px;scrollbar-width:none;scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cat-pill{
  flex:0 0 auto;background:var(--surface);border:1px solid var(--line);padding:10px 18px;
  border-radius:var(--r-full);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;
  color:var(--ink);box-shadow:var(--shadow-sm);transition:transform .2s,background .2s,border-color .2s,color .2s;
  scroll-snap-align:start;white-space:nowrap;
}
.cat-pill:hover{transform:translateY(-2px);border-color:var(--ink-3)}
.cat-pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat-pill .emoji{font-size:17px;line-height:1}

/* ============ PRODUCT GRID ============ */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-bottom:32px}
.product-grid.horizontal{display:flex;overflow-x:auto;gap:16px;padding-bottom:8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.product-grid.horizontal::-webkit-scrollbar{display:none}
.product-grid.horizontal > .product{flex:0 0 240px;scroll-snap-align:start}

.product{
  background:var(--surface);border-radius:var(--r-md);overflow:hidden;cursor:pointer;
  transition:transform .3s var(--ease),box-shadow .3s;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;border:1px solid var(--line);position:relative;
}
.product:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.product-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg-2)}
.product-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.product:hover .product-img img{transform:scale(1.06)}
.product-badges{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;max-width:calc(100% - 20px)}
.badge-tag{
  font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:var(--r-full);letter-spacing:.02em;
  display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.badge-tag.hot{background:var(--primary);color:#fff}
.badge-tag.free-delivery{background:var(--success);color:#fff}
.badge-tag.veggie{background:#E8F5E9;color:#1B5E20;border:1px solid #C8E6C9}
.badge-tag.secret{background:#1F1610;color:var(--accent);border:1px solid var(--accent)}
.badge-tag.spicy{background:#FFF3E0;color:#E65100;border:1px solid #FFE0B2}

.product-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.product-name{font-size:16px;font-weight:800;line-height:1.3;margin-bottom:6px;color:var(--ink)}
.product-desc{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.product-price{display:flex;align-items:baseline;gap:6px;font-size:17px;font-weight:800;color:var(--ink);direction:ltr;unicode-bidi:isolate}
.product-price .from{font-size:11px;font-weight:500;color:var(--ink-3);margin-right:2px}
.product-price s{color:var(--ink-3);font-weight:400;font-size:13px}
.product-price .sale{color:var(--primary)}
.product-rating{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px;margin-bottom:8px;direction:ltr;unicode-bidi:isolate;justify-content:flex-end;width:fit-content}
.product-rating .star{color:var(--accent);font-size:13px}

.add-btn{
  width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:20px;font-weight:400;line-height:1;
  transition:transform .2s var(--spring),background .2s;flex-shrink:0;
}
.add-btn:hover{background:var(--primary);transform:scale(1.1)}
.add-btn:active{transform:scale(.9)}
.add-btn.done{background:var(--success)}

/* ============ FEATURED DEAL ============ */
.featured-deal{
  display:grid;grid-template-columns:1fr;background:var(--surface);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md);
  border:1px solid var(--line);margin-bottom:32px;
}
.featured-deal-img{aspect-ratio:16/10;overflow:hidden}
.featured-deal-img img{width:100%;height:100%;object-fit:cover}
.featured-deal-content{padding:24px;display:flex;flex-direction:column;justify-content:center}
.featured-deal-content .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--primary);margin-bottom:10px}
.featured-deal-content h3{font-size:24px;font-weight:900;line-height:1.2;margin-bottom:8px}
.featured-deal-content p{color:var(--ink-2);font-size:14px;margin-bottom:16px;line-height:1.6}
.featured-deal-content .price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;direction:ltr;unicode-bidi:isolate;justify-content:flex-end;width:fit-content}
.featured-deal-content .price-row .new{font-size:26px;font-weight:900;color:var(--primary)}
.featured-deal-content .price-row s{color:var(--ink-3);font-size:15px}
@media(min-width:720px){
  .featured-deal{grid-template-columns:1fr 1fr}
  .featured-deal-img{aspect-ratio:auto;min-height:280px}
  .featured-deal-content{padding:40px}
  .featured-deal-content h3{font-size:30px}
}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 24px;border-radius:var(--r-full);font-weight:700;font-size:15px;
  transition:transform .2s var(--ease),box-shadow .2s,background .2s,opacity .2s;
  cursor:pointer;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(217,64,31,.25)}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 6px 16px rgba(217,64,31,.35);transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-outline{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn-outline:hover{background:var(--ink);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:9px 18px;font-size:13px}

/* ============ SHEET ============ */
.overlay{position:fixed;inset:0;background:rgba(20,10,5,.55);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:1000}
.overlay.show{opacity:1;visibility:visible}
.sheet{
  position:fixed;left:0;right:0;bottom:0;margin:auto;width:100%;max-width:560px;max-height:92vh;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:1001;
  transform:translateY(105%);visibility:hidden;transition:transform .4s var(--ease),visibility .4s;
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet.show{transform:none;visibility:visible}
.sheet-scroll{overflow-y:auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));flex:1;overscroll-behavior:contain}
.sheet-img{position:relative;aspect-ratio:16/10;background:var(--bg-2);overflow:hidden}
.sheet-img img{width:100%;height:100%;object-fit:cover}
.sheet-close{
  position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);display:grid;place-items:center;
  color:var(--ink);z-index:5;transition:transform .2s;box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.sheet-close:hover{transform:scale(1.08)}
.sheet-content{padding:22px 22px 0}
.sheet-title{font-size:26px;font-weight:900;line-height:1.2;margin-bottom:6px}
.sheet-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin-bottom:14px;flex-wrap:wrap}
.sheet-meta .rating{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:var(--ink);direction:ltr}
.sheet-meta .rating .star{color:var(--accent)}
.sheet-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3)}
.sheet-desc{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin-bottom:20px}

.option-group{margin-bottom:22px}
.option-group h4{font-size:13px;font-weight:800;color:var(--ink-2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.option-group h4 small{font-size:11px;font-weight:500;color:var(--ink-3)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s;background:var(--surface)}
.opt:hover{border-color:var(--ink-3)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.opt-label{display:flex;flex-direction:column;gap:2px}
.opt-label strong{font-size:14.5px;font-weight:700;color:var(--ink)}
.opt-label small{font-size:11.5px;color:var(--ink-2)}
.opt-price{font-weight:700;font-size:14px;color:var(--ink);direction:ltr;unicode-bidi:isolate}
.opt.sel .opt-price{color:var(--primary)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap}
.pillrow .opt{flex:1 1 auto;min-width:90px;justify-content:center;padding:11px 14px}
.pillrow .opt .opt-label{align-items:center;text-align:center}

.sheet-footer{
  position:absolute;bottom:0;left:0;right:0;
  padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
  box-shadow:0 -4px 20px rgba(31,22,16,.06);
}
.qty-stepper{display:flex;align-items:center;background:var(--bg-2);border-radius:var(--r-full);padding:4px;flex-shrink:0}
.qty-stepper button{width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:700;display:grid;place-items:center;color:var(--ink);transition:background .15s}
.qty-stepper button:hover{background:var(--surface)}
.qty-stepper span{min-width:26px;text-align:center;font-weight:800;font-size:15px;direction:ltr}
.sheet-footer .btn{flex:1}

.note-input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:14px;resize:none;min-height:60px;font-family:inherit;color:var(--ink);transition:border-color .15s}
.note-input:focus{outline:none;border-color:var(--primary)}
.allergy-note{font-size:12.5px;color:#B25B00;background:#FFF8E1;border:1px solid #FFE0B2;padding:10px 14px;border-radius:var(--r-xs);margin-bottom:18px;line-height:1.6}

@media(min-width:720px){
  .sheet{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-46%) scale(.96);opacity:0;border-radius:var(--r-lg);max-height:88vh;transition:transform .35s var(--spring),opacity .25s,visibility .25s}
  .sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet-img{aspect-ratio:16/8}
  .sheet-title{font-size:30px}
}

/* ============ CART ============ */
.cart-layout{display:grid;gap:24px;margin-bottom:40px}
.cart-items{display:flex;flex-direction:column;gap:12px}
.cart-item{display:flex;align-items:center;gap:14px;background:var(--surface);padding:12px;border-radius:var(--r-md);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.cart-item-img{width:72px;height:72px;border-radius:var(--r-sm);overflow:hidden;flex-shrink:0;background:var(--bg-2)}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1;min-width:0}
.cart-item-info h4{font-size:15px;font-weight:800;margin-bottom:2px}
.cart-item-info .opts{font-size:12px;color:var(--ink-2);line-height:1.5}
.cart-item-info .note{font-size:11.5px;font-style:italic;color:var(--primary);margin-top:2px}
.cart-item-info .line-price{font-size:15px;font-weight:800;margin-top:6px;color:var(--ink);display:flex;gap:8px;align-items:baseline;direction:ltr;unicode-bidi:isolate;justify-content:flex-end;width:fit-content}
.cart-item-info .line-price s{color:var(--ink-3);font-weight:400;font-size:12px}
.cart-item .qty-stepper{margin-right:auto;margin-left:0}

.upsell-note{font-size:12.5px;color:var(--success);background:var(--success-soft);padding:9px 12px;border-radius:var(--r-xs);margin-bottom:14px;font-weight:600}

.order-head h4{font-size:16px;font-weight:800;margin-bottom:2px}

.progress-steps{display:flex;margin:14px 0 16px;position:relative}

.step::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--bg-2);border:2px solid var(--line);z-index:2}
.step::after{content:'';position:absolute;top:5px;left:50%;right:-50%;height:2px;background:var(--line);z-index:1}
.step:last-child::after{display:none}
.step.on{color:var(--primary)}
.step.on::before{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}

.order-items{background:var(--bg-2);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:12px}

.order-total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:800;padding-top:10px;margin-top:8px;border-top:1px solid var(--line)}

.bottom-nav{

/* ============ TOAST ============ */
.toast{

}
.toast.show{transform:translate(-50%,0)}
.toast svg{color:var(--accent);flex-shrink:0}

/* ============ STICKY CART ============ */
.sticky-cart{

  background:var(--ink);color:#fff;padding:14px 20px;border-radius:var(--r-full);
  display:none;align-items:center;justify-content:space-between;gap:14px;

}
.sticky-cart.show{display:flex}
.sticky-cart:active{transform:scale(.98)}
.sticky-cart-info{display:flex;flex-direction:column;gap:1px;align-items:flex-start}
.sticky-cart-info small{font-size:11px;opacity:.75;font-weight:600}
.sticky-cart-info strong{font-size:15px;font-weight:800;direction:ltr;unicode-bidi:isolate}
.sticky-cart-cta{background:var(--primary);padding:8px 16px;border-radius:var(--r-full);font-size:13px;font-weight:700}
@media(min-width:900px){.sticky-cart{display:none !important}}

/* ============ ANIMATIONS ============ */
.view-anim{animation:fadeUp .4s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stagger > *{opacity:0;animation:fadeUp .4s var(--ease) forwards}
.stagger > *:nth-child(1){animation-delay:0ms}
.stagger > *:nth-child(2){animation-delay:60ms}
.stagger > *:nth-child(3){animation-delay:120ms}
.stagger > *:nth-child(4){animation-delay:180ms}
.stagger > *:nth-child(5){animation-delay:240ms}

.confetti-box{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.confetti-piece{position:absolute;top:-12px;width:8px;height:8px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:.3}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}

.skip-link{position:absolute;top:-100px;right:8px;background:var(--primary);color:#fff;padding:10px 16px;border-radius:8px;z-index:9999;transition:top .2s}

.install-btn{

      sizes:[{key:'D',label:'دوبل',price:185}] }
  ];
  const ITEM = Object.fromEntries(MENU_ITEMS.map(i => [i.id, i]));
  const isSecret = it => it.secret === true;

  /* ============ UTILS ============ */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
  const money = n => round2(n).toFixed(2) + ' ج.م';
  const moneyHtml = n => `<span class="price-ltr">${money(n)}</span>`;
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const today = () => new Date().toDateString();
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const isNight = () => { const h = new Date().getHours(); return h >= 22 || h < 6; };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const isBirthday = bd => {
    if (!bd) return false;
    const b = new Date(bd);
    if (isNaN(b.getTime())) return false;
    const n = new Date();
    return b.getMonth() === n.getMonth() && b.getDate() === n.getDate();
  };

  /* ============ STORAGE ============ */
  const K = k => CONFIG.STORAGE_PREFIX + k;
  const safeLoad = (k, fb) => {
    try { const r = localStorage.getItem(k); if (r === null) return fb; return JSON.parse(r) ?? fb; }
    catch { return fb; }
  };
  const safeSave = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const safeRemove = k => { try { localStorage.removeItem(k); } catch {} };

  (function migrate() {
    const v = Number(safeLoad(K('schema'), 0));
    if (v === CONFIG.STORAGE_SCHEMA) return;
    if (v > 0) {
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith('sheepburger_v') && !k.startsWith(CONFIG.STORAGE_PREFIX)) safeRemove(k);
      });
    }
    safeSave(K('schema'), CONFIG.STORAGE_SCHEMA);
  })();

  /* ============ SANITIZERS ============ */
  const sanitizeSpecial = raw => {
    if (!raw || typeof raw !== 'object') return null;
    if (raw.type === 'free') return { type: 'free' };
    if (raw.type === 'fixed' && Number.isFinite(Number(raw.price)) && Number(raw.price) >= 0) return { type: 'fixed', price: Number(raw.price) };
    if (raw.type === 'percent' && Number.isFinite(Number(raw.pct)) && raw.pct > 0 && raw.pct < 1) return { type: 'percent', pct: Number(raw.pct) };
    return null;
  };

  const sanitizeLine = raw => {
    if (!raw || typeof raw !== 'object' || !ITEM[raw.id]) return null;
    const it = ITEM[raw.id];
    if (!it.sizes.some(s => s.key === raw.size)) return null;
    const addons = Array.isArray(raw.addons) ? raw.addons.filter(a => typeof a === 'string' && it.addons.includes(a)) : [];
    const spice = it.spice && SPICE_LEVELS.includes(raw.spice) ? raw.spice : null;
    const qty = Math.trunc(Number(raw.qty));
    if (!(qty >= 1 && qty <= CONFIG.MAX_QTY)) return null;
    return { uid: typeof raw.uid === 'string' ? raw.uid.slice(0, 20) : uid(), id: it.id, size: raw.size, spice, addons, note: String(raw.note ?? '').slice(0, 80), qty, special: sanitizeSpecial(raw.special) };
  };

  const sanitizeVoucher = v => {
    if (!v || typeof v !== 'object' || v.used) return null;
    if (v.type === 'percent' && Number.isFinite(v.pct) && v.pct > 0 && v.pct < 1) return { ...v, id: v.id || uid() };
    if (v.type === 'delivery' || v.type === 'free_item') return { ...v, id: v.id || uid() };
    if (v.type === 'flat' && Number.isFinite(v.amount) && v.amount > 0) return { ...v, id: v.id || uid() };
    return null;
  };

  const sanitizeReviews = raw => {
    if (!raw || typeof raw !== 'object') return {};
    const out = {};
    Object.keys(raw).forEach(id => {
      if (!ITEM[id]) return;
      const list = Array.isArray(raw[id]) ? raw[id] : [];
      const cleaned = list.filter(r => r && Number.isFinite(Number(r.stars)) && Number(r.stars) >= 1 && Number(r.stars) <= 5 && typeof r.text === 'string').slice(-50).map(r => ({
        uid: typeof r.uid === 'string' ? r.uid.slice(0, 20) : uid(),
        name: String(r.name || 'عميل').slice(0, 30),
        stars: Math.round(Number(r.stars)),
        text: String(r.text).slice(0, 300),
        date: String(r.date || '').slice(0, 20),
        sessionId: typeof r.sessionId === 'string' ? r.sessionId.slice(0, 20) : ''
      }));
      if (cleaned.length) out[id] = cleaned;
    });
    return out;
  };

  /* ============ STATE ============ */
  const sessionId = safeLoad(K('session_id'), null) || (() => { const s = uid(); safeSave(K('session_id'), s); return s; })();

  const state = {
    cart: (safeLoad(K('cart'), []) || []).map(sanitizeLine).filter(Boolean),
    orders: (safeLoad(K('orders'), []) || []).filter(o => o && Array.isArray(o.items) && typeof o.id === 'number').map(o => ({ ...o, status: clamp(o.status ?? 3, 0, 3), startedAt: o.startedAt || Date.now() })),
    customer: (() => { const c = safeLoad(K('customer'), {}); return c && typeof c === 'object' ? c : {}; })(),
    filter: 'All', subcat: 'All', query: '',
    draft: null,
    reviewStars: 5, reviewName: '', reviewText: '', reviewFormOpen: false,
    coupon: (() => { const c = safeLoad(K('coupon'), null); if (c && typeof c.code === 'string' && COUPONS[c.code]) return { code: c.code, pct: COUPONS[c.code] }; return null; })(),
    couponInput: safeLoad(K('coupon'), null)?.code || '',
    couponMsg: '',

    secretUnlocked: !!safeLoad(K('secret_unlocked'), false),

  const confettiBox = document.getElementById('confetti');
  const stickyCart = document.getElementById('stickyCart');
  let toastTimer;

  /* ============ PRICING ============ */
  const baseUnitPrice = line => {
    const it = ITEM[line.id]; if (!it) return 0;
    const sp = it.sizes.find(s => s.key === line.size)?.price ?? 0;
    const ap = line.addons.reduce((s, a) => s + (ADDONS[a]?.price ?? 0), 0);
    return round2(sp + ap);
  };

  const unitPrice = (line, ctx = {}) => {
    const it = ITEM[line.id]; if (!it) return 0;
    const sp = it.sizes.find(s => s.key === line.size)?.price ?? 0;
    const ap = line.addons.reduce((s, a) => s + (ADDONS[a]?.price ?? 0), 0);
    let p = sp;
    if (line.special?.type === 'free') p = 0;
    else if (line.special?.type === 'fixed') p = Math.min(sp, line.special.price);
    else if (line.special?.type === 'percent') p = sp * (1 - line.special.pct);
    else {
      const best = Math.max(ctx.coupon?.pct || 0, it.off || 0);
      if (best > 0) p = sp * (1 - best);
    }
    return round2(p + ap);
  };

  const calculatePricing = (cart, ctx = {}) => {
    const coupon = ctx.coupon || null;
    const vouchers = (ctx.vouchers || []).filter(v => !v.used);
    const itemLines = cart.map(line => {
      const base = baseUnitPrice(line);
      const unit = unitPrice(line, { coupon });
      return { line, base, unit, total: round2(unit * line.qty) };
    });
    const subtotal = round2(itemLines.reduce((s, x) => s + x.total, 0));
    const itemDiscounts = round2(itemLines.reduce((s, x) => s + (x.base - x.unit) * x.line.qty, 0));
    let deliveryFee = 0, freeDeliveryReason = null;
    if (subtotal > 0) {
      if (subtotal >= CONFIG.FREE_DELIVERY_AT) freeDeliveryReason = 'threshold';
      else if (cart.some(l => ITEM[l.id]?.freeDelivery)) freeDeliveryReason = 'item';
      else if (vouchers.some(v => v.type === 'delivery')) freeDeliveryReason = 'voucher';
      else deliveryFee = CONFIG.DELIVERY_FEE;
    }
    const appliedVouchers = [];
    let voucherDiscount = 0;
    let running = subtotal + deliveryFee;
    for (const v of vouchers.filter(x => x.type === 'flat')) {
      const apply = round2(Math.min(v.amount, Math.max(0, running - voucherDiscount)));
      if (apply > 0) { voucherDiscount += apply; appliedVouchers.push(v); }
    }
    const cheeseCount = cart.reduce((n, l) => n + (l.addons.includes('cheese') ? l.qty : 0), 0);
    const freeItemVouchers = vouchers.filter(v => v.type === 'free_item').slice(0, cheeseCount);
    if (freeItemVouchers.length) {
      voucherDiscount += round2(freeItemVouchers.length * ADDONS.cheese.price);
      appliedVouchers.push(...freeItemVouchers);
    }
    const dv = vouchers.find(v => v.type === 'delivery');
    if (dv && freeDeliveryReason === 'voucher') appliedVouchers.push(dv);
    return {
      subtotal, itemDiscounts, deliveryFee, voucherDiscount,
      total: round2(Math.max(0, subtotal + deliveryFee - voucherDiscount)),
      appliedVouchers, itemLines, freeDeliveryReason
    };
  };

  /* ============ CART ============ */
  const lineKey = line => JSON.stringify({
    id: line.id, size: line.size, spice: line.spice ?? '',

  });
  const cartCount = () => state.cart.reduce((s, l) => s + l.qty, 0);
  const commitCart = () => { safeSave(K('cart'), state.cart); updateBadges(); };

  const addLineToCart = (newLine) => {

  const changeQty = (uidVal, delta) => {
    const l = state.cart.find(x => x.uid === uidVal);

    l.qty = clamp(l.qty + delta, 0, CONFIG.MAX_QTY);

    if (state.stamps >= CONFIG.STAMPS_FOR_REWARD) {
      state.stamps = 0; state.freeBurger = true;
      safeSave(K('free_burger'), true);
      showConfetti();
      toast('🎉 برجر مجاني اتفعّل!');
    }
    safeSave(K('stamps'), state.stamps);
  };

  const addPoints = (amount) => {
    const pts = Math.floor(Math.max(0, amount) / CONFIG.POINTS_DIVISOR * CONFIG.POINTS_PER_POUND);
    if (pts <= 0) return;
    state.points += pts;
    safeSave(K('points'), state.points);
    toast(`+${pts} نقطة مكافآت 🌟`);
  };

  const awardAch = (key) => {
    if (!(key in ACHIEVEMENTS) || state.achievements.includes(key)) return;
    state.achievements.push(key);
    safeSave(K('achievements'), state.achievements);
    toast(`🏆 إنجاز جديد: ${ACHIEVEMENTS[key].name}!`);
    showConfetti();
  };

  const checkAch = () => {
    if (state.stats.totalOrders >= 1) awardAch('first_order');
    if (isNight()) awardAch('night_owl');
    if (state.stats.totalOrders >= 10) awardAch('loyal_customer');
    if (state.stats.burgersOrdered >= 10) awardAch('burger_master');
    if (state.stats.veggieOrdered >= 5) awardAch('healthy_choice');
    const spicyIds = MENU_ITEMS.filter(i => i.spice).map(i => i.id);
    if (spicyIds.length && spicyIds.every(id => state.stats.spicyItems.includes(id))) awardAch('spice_king');
    if (state.secretUnlocked) awardAch('secret_finder');
  };

  const updateStats = (order) => {
    state.stats.totalOrders += 1;
    order.items.forEach(it => {
      const m = MENU_ITEMS.find(x => x.name === it.name);
      if (!m) return;
      if (m.cat === 'Burgers') state.stats.burgersOrdered += it.qty;
      if (m.tags.includes('veggie')) state.stats.veggieOrdered += it.qty;
      if (m.spice && !state.stats.spicyItems.includes(m.id)) state.stats.spicyItems.push(m.id);
    });
    safeSave(K('stats'), state.stats);
    if (!state.secretUnlocked && state.stats.totalOrders >= CONFIG.SECRET_ORDERS_NEEDED) {
      state.secretUnlocked = true;
      safeSave(K('secret_unlocked'), true);
      toast('🤫 المنيو السري اتفعّل!');
    }
  };

  /* ============ ORDERS ============ */
  let checkingOut = false;
  let trackingTimer = null;

  const computeStatus = (order) => {
    if (!CONFIG.DEMO_MODE) return order.status ?? 0;
    if (!order.startedAt) return order.status ?? 3;
    if (order.status === 3) return 3;
    return clamp(Math.floor((Date.now() - order.startedAt) / CONFIG.STATUS_STEP_MS), 0, 3);
  };

  const refreshLive = () => {
    if (!CONFIG.DEMO_MODE) return false;
    let changed = false;
    state.orders.forEach(o => {
      if (o.status < 3) {
        const c = computeStatus(o);
        if (c !== o.status) { o.status = c; changed = true; }
      }
    });
    if (changed) safeSave(K('orders'), state.orders);
    return changed;
  };

  const startTracking = () => {
    if (!CONFIG.DEMO_MODE || trackingTimer) return;
    trackingTimer = setInterval(() => {
      const changed = refreshLive();
      if (changed && currentRoute() === 'orders') refresh();
      if (!state.orders.some(o => o.status < 3)) { clearInterval(trackingTimer); trackingTimer = null; }
    }, CONFIG.STATUS_STEP_MS);
  };

  const readForm = () => {
    const map = { name:'fName', phone:'fPhone', area:'fArea', street:'fStreet', building:'fBuilding', floor:'fFloor', apt:'fApt', birthday:'fBirthday' };
    for (const [k, id] of Object.entries(map)) {
      const el = document.getElementById(id);
      if (el) state.customer[k] = el.value.trim().slice(0, 60);
    }
    const c = document.getElementById('coupon');
    if (c) state.couponInput = c.value.trim();
  };

  const validateForm = () => {
    readForm();
    const c = state.customer;
    if (!c.name || c.name.length < 2) return { ok: false, field: 'fName', msg: 'اكتب اسمك بالكامل' };
    const phone = (c.phone || '').replace(/[\s-]/g, '');
    if (!/^\+?\d{8,15}$/.test(phone)) return { ok: false, field: 'fPhone', msg: 'اكتب رقم موبايل صحيح' };
    const req = [['area','fArea','المنطقة'],['street','fStreet','الشارع'],['building','fBuilding','رقم العمارة'],['floor','fFloor','الدور'],['apt','fApt','الشقة']];
    for (const [k, id, label] of req) if (!c[k]) return { ok: false, field: id, msg: `${label} مطلوب` };
    return { ok: true };
  };

  const checkout = async () => {
    if (checkingOut || !state.cart.length) return;
    readForm();
    maybeApplyBirthday();
    const v = validateForm();
    const err = document.getElementById('ferr');
    if (!v.ok) {
      if (err) err.textContent = v.msg;
      const f = document.getElementById(v.field);
      if (f) f.focus();
      return;
    }
    if (err) err.textContent = '';
    safeSave(K('customer'), state.customer);
    checkingOut = true;
    const btn = document.querySelector('[data-action="checkout"]');
    if (btn) { btn.disabled = true; btn.textContent = 'بنأكد طلبك…'; }
    try {
      const pricing = calculatePricing(state.cart, { coupon: state.coupon, vouchers: state.vouchers });
      const items = state.cart.map(l => ({
        name: ITEM[l.id].name, qty: l.qty, price: unitPrice(l, { coupon: state.coupon }),
        basePrice: baseUnitPrice(l),
        details: [lineOptions(l), l.note ? `ملاحظة: ${l.note}` : ''].filter(Boolean).join(' · '),
        special: l.special || null, addons: [...l.addons], size: l.size
      }));
      let orderId;
      do { orderId = Math.floor(100000 + Math.random() * 900000); } while (state.orders.some(o => o.id === orderId));
      const order = {
        id: orderId, date: new Date().toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' }),
        startedAt: Date.now(), items,
        subtotal: pricing.subtotal, deliveryFee: pricing.deliveryFee,
        voucherDiscount: pricing.voucherDiscount, total: pricing.total,
        payment: 'الدفع عند الاستلام',
        name: state.customer.name, phone: state.customer.phone,
        address: { area: state.customer.area, street: state.customer.street, building: state.customer.building, floor: state.customer.floor, apt: state.customer.apt },
        coupon: state.coupon ? state.coupon.code : null,
        appliedVouchers: pricing.appliedVouchers.map(vv => ({ ...vv, used: true })),
        status: 0
      };
      state.orders.unshift(order);
      safeSave(K('orders'), state.orders);
      const used = new Set(pricing.appliedVouchers.map(x => x.id));
      state.vouchers = state.vouchers.map(vv => used.has(vv.id) ? { ...vv, used: true } : vv);
      safeSave(K('vouchers'), state.vouchers);
      state.cart = []; state.coupon = null; state.couponInput = ''; state.couponMsg = '';
      safeSave(K('coupon'), null);
      commitCart();
      addStamp(); addPoints(pricing.subtotal); updateStats(order); checkAch();
      showConfetti();
      toast('تم استلام طلبك 🎉');
      setTimeout(() => { location.hash = '#/orders'; }, 700);
      startTracking();
    } catch (e) {
      console.warn('Checkout error:', e);
      if (err) err.textContent = 'حصلت مشكلة. جرب تاني.';
    } finally {
      checkingOut = false;
      const b = document.querySelector('[data-action="checkout"]');
      if (b) b.disabled = false;
    }
  };

  const reorder = (orderId) => {
    const order = state.orders.find(o => String(o.id) === String(orderId));
    if (!order) return;
    order.items.forEach(item => {
      const m = MENU_ITEMS.find(x => x.name === item.name);
      if (!m) return;
      const size = m.sizes.find(s => s.key === item.size)?.key || m.sizes[0].key;
      const addons = (item.addons || []).filter(a => m.addons.includes(a));
      addLineToCart({ id: m.id, size, spice: null, addons, note: '', qty: clamp(Number(item.qty) || 1, 1, CONFIG.MAX_QTY), special: item.special ? sanitizeSpecial(item.special) : null });
    });
    toast('الطلبات اتضافت للسلة ⚡');
    location.hash = '#/cart';
  };

  /* ============ REVIEWS ============ */
  const getRating = (itemId) => {
    const list = state.ratings[itemId] || [];
    if (!list.length) return { avg: 0, count: 0 };
    const sum = list.reduce((s, r) => s + r.stars, 0);
    return { avg: sum / list.length, count: list.length };
  };

  const starsHtml = (itemId) => {
    const { avg, count } = getRating(itemId);
    if (count === 0) return '';
    const filled = Math.round(avg);
    const stars = Array.from({ length: 5 }, (_, i) => `<span class="star" aria-hidden="true">${i < filled ? '★' : '☆'}</span>`).join('');
    return `<div class="product-rating">${stars}<span>${avg.toFixed(1)} (${count})</span></div>`;
  };

  const submitReview = (itemId) => {
    const nameEl = document.getElementById('reviewName');
    const textEl = document.getElementById('reviewText');
    const text = (textEl?.value || '').trim();
    const name = (nameEl?.value || '').trim();
    if (text.length < 3) { toast('اكتب على الأقل كلمتين'); return; }
    const list = state.ratings[itemId] || [];
    if (list.some(r => r.sessionId === sessionId)) { toast('انت قيمت الحاجة دي قبل كده'); return; }
    if (!state.ratings[itemId]) state.ratings[itemId] = [];
    state.ratings[itemId].push({
      uid: uid(), name: name.slice(0, 30) || 'عميل',
      stars: clamp(state.reviewStars, 1, 5),
      text: text.slice(0, 300),
      date: new Date().toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }),
      sessionId
    });
    safeSave(K('ratings'), state.ratings);
    toast('شكراً على التقييم ⭐');
    showConfetti();
    renderSheet();
  };

  /* ============ GAMIFICATION ============ */
  const addVoucher = (v) => {
    state.vouchers.push({ ...v, id: uid(), used: false });
    safeSave(K('vouchers'), state.vouchers);
    refresh();
  };

  const redeemPoints = () => {
    if (state.points < CONFIG.POINTS_FOR_DISCOUNT) { toast('مش معاك نقاط كفاية'); return; }
    if (state.cart.length === 0) { toast('ضيف حاجة للسلة الأول'); return; }
    state.points -= CONFIG.POINTS_FOR_DISCOUNT;
    safeSave(K('points'), state.points);
    addVoucher({ type: 'flat', amount: CONFIG.DISCOUNT_VALUE });
    toast(`🎉 كوبون ${money(CONFIG.DISCOUNT_VALUE)} اتفعّل!`);
    refresh();
  };

  const claimFreeBurger = () => {
    if (!state.freeBurger) return;
    const burgers = MENU_ITEMS.filter(i => i.cat === 'Burgers' && !isSecret(i));
    if (!burgers.length) return;
    const cheapest = burgers.reduce((min, it) => fromPrice(it) < fromPrice(min) ? it : min, burgers[0]);
    addLineToCart({ id: cheapest.id, size: cheapest.sizes[0].key, spice: null, addons: [], note: '', qty: 1, special: { type: 'free' } });
    state.freeBurger = false;
    safeSave(K('free_burger'), false);
    showConfetti();
    toast('🎉 برجر مجاني اتضاف للسلة!');
    location.hash = '#/cart';
  };

  const unlockSecret = () => {
    const input = document.getElementById('secretCode');
    const code = (input ? input.value : '').trim().toUpperCase();
    if (code === CONFIG.SECRET_CODE) {
      state.secretUnlocked = true;
      safeSave(K('secret_unlocked'), true);
      checkAch();
      showConfetti();
      toast('🤫 المنيو السري اتفعّل!');
      refresh();
    } else if (code.length > 0) toast('الكود غلط، جرب تاني');
  };

  /* ============ UI HELPERS ============ */
  const toast = (msg) => {
    const el = document.getElementById('toastMsg');
    if (!el) return;
    el.textContent = String(msg);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  };

  const updateBadges = () => {
    const n = cartCount();
    document.querySelectorAll('[data-badge]').forEach(b => {
      b.textContent = n;
      b.classList.toggle('show', n > 0);
    });
    updateStickyCart();
  };

  const updateStickyCart = () => {
    const n = cartCount();
    if (n === 0 || currentRoute() === 'cart') { stickyCart.classList.remove('show'); return; }
    const pricing = calculatePricing(state.cart, { coupon: state.coupon, vouchers: state.vouchers });
    document.getElementById('stickyCount').textContent = `${n} ${n > 1 ? 'عناصر' : 'عنصر'}`;
    document.getElementById('stickyTotal').textContent = money(pricing.total);
    stickyCart.classList.add('show');
  };

  const bumpIcon = () => {
    if (reduceMotion.matches) return;
    document.querySelectorAll('a[href="#/cart"] .ic, a[href="#/cart"].icon-btn').forEach(el =>
      el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 350, easing: 'cubic-bezier(.34,1.56,.64,1)' })
    );
  };

  const showConfetti = () => {
    if (reduceMotion.matches) return;
    const colors = ['#D9401F', '#E8A425', '#2F7D32', '#1F1610', '#FCEAE4'];
    for (let i = 0; i < 36; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDelay = (Math.random() * 0.4) + 's';
      p.style.animationDuration = (2 + Math.random() * 1.6) + 's';
      confettiBox.appendChild(p);
      setTimeout(() => p.remove(), 4000);
    }
  };

  /* ============ COMPONENTS ============ */
  const fromPrice = it => Math.min(...it.sizes.map(s => s.price));

  const priceHtml = (it) => {
    if (it.off) {
      const p = fromPrice(it);
      return `<span class="product-price"><s>${money(p)}</s><span class="sale">${money(p * (1 - it.off))}</span></span>`;
    }
    return `<span class="product-price">${it.sizes.length > 1 ? '<span class="from">من</span>' : ''}${money(fromPrice(it))}</span>`;
  };

  const badgesHtml = (it) => {
    const b = [];
    if (it.tags.includes('popular')) b.push('<span class="badge-tag hot">🔥 الأكثر طلباً</span>');
    if (it.tags.includes('spicy')) b.push('<span class="badge-tag spicy">🌶 حار</span>');
    if (it.tags.includes('veggie')) b.push('<span class="badge-tag veggie">🥬 نباتي</span>');
    if (it.freeDelivery) b.push('<span class="badge-tag free-delivery">🛵 توصيل مجاني</span>');
    if (it.secret) b.push('<span class="badge-tag secret">🤫 سري</span>');
    return b.length ? `<div class="product-badges">${b.join('')}</div>` : '';
  };

  const productCard = (it) => `
    <article class="product" data-action="open" data-id="${esc(it.id)}" tabindex="0" role="button" aria-label="${esc(it.name)}">
      <div class="product-img">
        ${badgesHtml(it)}
        <img src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy">
      </div>
      <div class="product-body">
        <h3 class="product-name">${esc(it.name)}</h3>
        <p class="product-desc">${esc(it.desc)}</p>
        ${starsHtml(it.id)}
        <div class="product-foot">
          ${priceHtml(it)}
          <button class="add-btn" data-action="quick" data-id="${esc(it.id)}" aria-label="ضيف ${esc(it.name)}">+</button>
        </div>
      </div>
    </article>`;

  const lineOptions = (line) => {
    const it = ITEM[line.id]; if (!it) return '';
    const parts = [it.sizes.find(s => s.key === line.size)?.label || ''];
    if (line.spice) parts.push(line.spice);
    line.addons.forEach(a => parts.push('+ ' + (ADDONS[a]?.name || '')));
    if (line.special?.type === 'percent') parts.push(`خصم ${Math.round(line.special.pct * 100)}%`);
    if (line.special?.type === 'free') parts.push('مجاني');
    return parts.filter(Boolean).join(' · ');
  };

  /* ============ VIEWS ============ */
  const viewHome = () => {
    const popular = MENU_ITEMS.filter(i => !isSecret(i) && i.tags.includes('popular')).concat(MENU_ITEMS.filter(i => !isSecret(i) && !i.tags.includes('popular'))).slice(0, 6);
    const freeDelivery = MENU_ITEMS.filter(i => !isSecret(i) && i.freeDelivery).slice(0, 4);
    const pricing = calculatePricing(state.cart, { coupon: state.coupon, vouchers: state.vouchers });
    const remaining = Math.max(0, CONFIG.FREE_DELIVERY_AT - pricing.subtotal);
    const pct = Math.min(100, (pricing.subtotal / CONFIG.FREE_DELIVERY_AT) * 100);

    if (!state.chefSpecial) {
      const candidates = MENU_ITEMS.filter(i => !isSecret(i));
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      state.chefSpecial = { id: pick.id, discount: 0.25 };
      safeSave(K('chef_special'), state.chefSpecial);
    }
    const special = ITEM[state.chefSpecial.id];
    const specialPrice = special ? fromPrice(special) : 0;
    const discounted = specialPrice * (1 - (state.chefSpecial?.discount || 0.25));

    return `
      <div class="view-anim">
        <section class="hero">
          <img class="hero-img" src="${img('photo-1568901346375-23c9450c58cd')}" alt="" loading="eager">
          <div class="hero-content">
            <div class="hero-eyebrow">مفتوح دلوقتي · 25–35 دقيقة</div>
            <h1>برجر طازة. <em>توصيل سريع.</em></h1>
            <p>بيتحضرلك على الطلب. مكونات طازة، طعم جبار، وبيوصلك سخن.</p>
            <a href="#/menu" class="hero-cta">
              اطلب دلوقتي
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;transform:scaleX(-1)" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </div>
        </section>

        <div class="free-bar ${remaining === 0 && pricing.subtotal > 0 ? 'unlocked' : ''}">
          <div class="free-bar-row">
            <span>${remaining > 0 ? (pricing.subtotal > 0 ? `ضيف <strong>${money(remaining)}</strong> كمان وتاخد توصيل مجاني` : `توصيل مجاني للطلبات فوق ${money(CONFIG.FREE_DELIVERY_AT)}`) : '🎉 <strong>التوصيل المجاني اتفعّل</strong>'}</span>
            <span class="price-ltr" style="color:var(--ink-2);font-weight:600">${money(Math.min(pricing.subtotal, CONFIG.FREE_DELIVERY_AT))} / ${money(CONFIG.FREE_DELIVERY_AT)}</span>
          </div>
          <div class="free-bar-track"><div class="free-bar-fill" style="width:${pct}%"></div></div>
        </div>

        <div class="sec-head"><h2>اتفرج على <em>المنيو</em></h2></div>
        <div class="cats">
          ${CATS.map(c => `<a href="#/menu" class="cat-pill" data-cat="${esc(c.id)}"><span class="emoji">${c.emoji}</span>${esc(c.label)}</a>`).join('')}
        </div>

        <div class="sec-head">
          <h2>الأكثر <em>طلباً</em></h2>
          <a href="#/menu" class="more">شوف الكل <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></a>
        </div>
        <div class="product-grid horizontal">
          ${popular.map(productCard).join('')}
        </div>

        ${special && state.chefSpecial ? `
          <div class="sec-head"><h2>اختيار <em>الشيف</em></h2></div>
          <div class="featured-deal">
            <div class="featured-deal-img">
              <img src="${esc(special.img)}" alt="${esc(special.name)}" loading="lazy">
            </div>
            <div class="featured-deal-content">
              <div class="eyebrow">خصم ${Math.round((state.chefSpecial.discount || 0.25) * 100)}% النهاردة</div>
              <h3>${esc(special.name)}</h3>
              <p>${esc(special.desc)}</p>
              <div class="price-row">
                <span class="new">${money(discounted)}</span>
                <s>${money(specialPrice)}</s>
              </div>
              <button class="btn btn-primary" data-action="add-special" style="align-self:flex-end">ضيف للسلة</button>
            </div>
          </div>
        ` : ''}

        ${freeDelivery.length ? `
          <div class="sec-head">
            <h2>أكل <em>بتوصيل مجاني</em></h2>
            <a href="#/menu" class="more">شوف الكل <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></a>
          </div>
          <div class="product-grid horizontal">
            ${freeDelivery.map(productCard).join('')}
          </div>
        ` : ''}

        ${!state.secretUnlocked ? `
          <div class="card-block" style="text-align:center;border-style:dashed">
            <div style="font-size:32px;margin-bottom:8px">🤫</div>
            <h3 style="justify-content:center">المنيو السري</h3>
            <p style="font-size:13.5px;color:var(--ink-2);margin-bottom:14px">ادخل الكود أو اعمل ${CONFIG.SECRET_ORDERS_NEEDED} طلبات عشان تفتحه</p>
            <div class="name-input-row">
              <input type="text" id="secretCode" placeholder="الكود السري" maxlength="20" autocomplete="off" aria-label="الكود السري">
              <button class="btn btn-dark" data-action="unlock-secret">افتح</button>
            </div>
          </div>
        ` : ''}

        <div style="height:20px"></div>
      </div>`;
  };

  const filteredItems = () => {
    const q = state.query.trim().toLowerCase();
    const isCat = state.filter !== 'All' && !state.filter.startsWith('tag:');
    return MENU_ITEMS.filter(it => {
      if (isSecret(it) && !state.secretUnlocked) return false;
      const f = state.filter;
      const okF = f === 'All' || it.cat === f || (f.startsWith('tag:') && it.tags.includes(f.slice(4)));
      const okS = !isCat || state.subcat === 'All' || it.subcat === state.subcat;
      const okQ = !q || it.name.toLowerCase().includes(q) || it.ingr.some(x => x.toLowerCase().includes(q));
      return okF && okS && okQ;
    });
  };

  const viewMenu = () => {
    const list = filteredItems();
    const isCat = state.filter !== 'All' && !state.filter.startsWith('tag:');
    const subs = isCat ? (SUBCATS[state.filter] || []) : [];
    return `
      <div class="view-anim">
        <div class="sec-head" style="margin-top:8px"><h2><em>المنيو</em></h2></div>
        <div style="margin-bottom:14px">
          <input type="search" id="search" placeholder="ابحث في البرجر، البطاطس، المشروبات…" value="${esc(state.query)}" aria-label="بحث" style="width:100%;padding:13px 18px;border-radius:var(--r-full);border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;color:var(--ink)">
        </div>
        <div class="cats">
          <button class="cat-pill ${state.filter === 'All' ? 'active' : ''}" data-action="filter" data-val="All">🍽️ الكل</button>
          ${CATS.map(c => `<button class="cat-pill ${state.filter === c.id ? 'active' : ''}" data-action="filter" data-val="${esc(c.id)}"><span class="emoji">${c.emoji}</span>${esc(c.label)}</button>`).join('')}
          <button class="cat-pill ${state.filter === 'tag:popular' ? 'active' : ''}" data-action="filter" data-val="tag:popular">🔥 الأكثر طلباً</button>
          <button class="cat-pill ${state.filter === 'tag:spicy' ? 'active' : ''}" data-action="filter" data-val="tag:spicy">🌶 حار</button>
          <button class="cat-pill ${state.filter === 'tag:veggie' ? 'active' : ''}" data-action="filter" data-val="tag:veggie">🥬 نباتي</button>
        </div>
        ${subs.length ? `<div class="cats" style="padding-top:0">
          <button class="cat-pill ${state.subcat === 'All' ? 'active' : ''}" data-action="subfilter" data-val="All" style="padding:7px 14px;font-size:12.5px">الكل</button>
          ${subs.map(s => `<button class="cat-pill ${state.subcat === s.id ? 'active' : ''}" data-action="subfilter" data-val="${esc(s.id)}" style="padding:7px 14px;font-size:12.5px">${esc(s.label)}</button>`).join('')}
        </div>` : ''}
        <div class="product-grid" data-grid>
          ${list.length ? list.map(productCard).join('') : '<p style="grid-column:1/-1;text-align:center;padding:40px;color:var(--ink-2)">مفيش نتايج للبحث</p>'}
        </div>
      </div>`;
  };

  const viewCart = () => {
    if (!state.cart.length) {
      return `<div class="empty view-anim">
        <div class="empty-icon">🛒</div>
        <h2>سلتك فاضية</h2>
        <p>لسه مضفتش حاجة. ابدأ ببرجر السماش بتاعنا.</p>
        <a href="#/menu" class="btn btn-primary">تصفح المنيو</a>
      </div>`;
    }
    const pricing = calculatePricing(state.cart, { coupon: state.coupon, vouchers: state.vouchers });
    const original = round2(pricing.subtotal + pricing.itemDiscounts);
    const c = state.customer;
    const cv = k => esc(c[k] || '');
    return `
      <div class="view-anim">
        <div class="sec-head" style="margin-top:8px"><h2>طلبك</h2></div>

          <div class="cart-items">

              const unit = unitPrice(l, { coupon: state.coupon });
              const base = baseUnitPrice(l);
              const total = round2(unit * l.qty);
              const showOld = base > unit + 0.001;
              return `<div class="cart-item" data-line="${esc(l.uid)}">
                <div class="cart-item-img"><img src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy"></div>

                  <h4>${esc(it.name)}</h4>

                  ${l.note ? `<div class="note">"${esc(l.note)}"</div>` : ''}

                    ${showOld ? `<s>${money(base * l.qty)}</s>` : ''}

                </div>
                <div class="qty-stepper">
                  <button data-action="qty" data-uid="${esc(l.uid)}" data-d="-1" aria-label="تقليل">−</button>

                  <button data-action="qty" data-uid="${esc(l.uid)}" data-d="1" aria-label="زيادة">+</button>
                </div>
              </div>`;
            }).join('')}
          </div>
          <aside class="summary">
            <h3>الفاتورة</h3>
            <div class="coupon-row">
              <input type="text" id="coupon" placeholder="كود الخصم" value="${esc(state.couponInput)}" aria-label="كود الخصم" maxlength="30">
              <button class="btn btn-dark btn-sm" data-action="apply-coupon">تطبيق</button>
            </div>
            <p class="coupon-msg ${state.coupon ? 'ok' : ''}">${state.coupon ? `كوبون ${esc(state.coupon.code)} · خصم ${Math.round(state.coupon.pct * 100)}%` : esc(state.couponMsg || '')}</p>
            <div class="summary-row"><span>المجموع الفرعي</span><span class="num">${money(original)}</span></div>
            ${pricing.itemDiscounts > 0.001 ? `<div class="summary-row discount"><span>خصومات</span><span class="num">−${money(pricing.itemDiscounts)}</span></div>` : ''}
            <div class="summary-row"><span>التوصيل</span><span class="num">${pricing.deliveryFee ? money(pricing.deliveryFee) : '<b class="free">مجاني</b>'}</span></div>
            ${pricing.voucherDiscount > 0 ? `<div class="summary-row discount"><span>كوبونات</span><span class="num">−${money(pricing.voucherDiscount)}</span></div>` : ''}
            <div class="summary-row total"><span>الإجمالي</span><span class="num">${money(pricing.total)}</span></div>
            ${pricing.deliveryFee && pricing.subtotal < CONFIG.FREE_DELIVERY_AT ? `<div class="upsell-note">💡 ضيف ${money(CONFIG.FREE_DELIVERY_AT - pricing.subtotal)} كمان وتاخد توصيل مجاني</div>` : ''}

            <div class="sec-label">بيانات التوصيل</div>
            <div class="form-grid">

              <div><label for="fArea">المنطقة *</label><input type="text" id="fArea" value="${cv('area')}" maxlength="60" required></div>
              <div><label for="fStreet">الشارع *</label><input type="text" id="fStreet" value="${cv('street')}" maxlength="60" required></div>
              <div class="form-row-3">
                <div><label for="fBuilding">رقم العمارة *</label><input type="text" id="fBuilding" value="${cv('building')}" maxlength="20" required></div>
                <div><label for="fFloor">الدور *</label><input type="text" id="fFloor" value="${cv('floor')}" maxlength="10" required></div>
                <div><label for="fApt">الشقة *</label><input type="text" id="fApt" value="${cv('apt')}" maxlength="10" required></div>
              </div>
              <div><label for="fBirthday">عيد ميلادك (اختياري، لمفاجأة)</label><input type="date" id="fBirthday" value="${cv('birthday')}"></div>
            </div>
            <p class="form-error" id="ferr" role="alert"></p>
            <div class="pay-note">
              <div class="pay-note-icon">💵</div>
              <div><strong>الدفع عند الاستلام</strong><small>ادفع للسواق لما الطلب يوصلك</small></div>
            </div>
            <button class="btn btn-primary btn-block" data-action="checkout">تأكيد الطلب · ${money(pricing.total)}</button>
          </aside>
        </div>
      </div>`;
  };

  const viewOrders = () => {
    if (!state.orders.length) {
      return `<div class="empty view-anim">
        <div class="empty-icon">📄</div>
        <h2>مفيش طلبات لسه</h2>
        <p>طلباتك هتظهر هنا. جاهز تعمل أول طلب؟</p>
        <a href="#/menu" class="btn btn-primary">اطلب دلوقتي</a>
      </div>`;
    }
    return `
      <div class="view-anim">
        <div class="sec-head" style="margin-top:8px"><h2>طلباتك</h2></div>
        <div class="stagger">
          ${state.orders.map(o => {
            const live = o.status < 3;
            const canReorder = o.status === 3;
            return `<div class="order-card">
              <div class="order-head">
                <div><h4>طلب رقم ${esc(String(o.id))}</h4><small>${esc(o.date || '')}</small></div>

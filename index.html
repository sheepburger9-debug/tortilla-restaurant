<!--

  ║ ⚠️ تم إضافة "طبقة تحسينات UI/UX" في نهاية <style> فقط
  ║ ⚠️ لم يتم تعديل أي منطق JS — كل التحسينات CSS + aria-hidden
  ╚════════════════════════════════════════════════════════════════
-->

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="برجر طازج، بطاطس، ومشروبات. اطلب توصيل لحد باب البيت.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FAF5EC">
<title>Sheep & Burger — برجر طازة</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sheep & Burger">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,700..900;1,9..144,500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#FAF5EC;
  --bg-2:#F3EBDC;
  --surface:#FFFFFF;
  --ink:#1F1610;
  --ink-2:#6E6154;
  --ink-3:#A89988;
  --primary:#D9401F;
  --primary-dark:#B03214;
  --primary-soft:#FCEAE4;
  --accent:#E8A425;
  --line:#EDE2D2;
  --success:#2F7D32;
  --success-soft:#E8F5E9;
  --danger:#C62828;
  --serif:'Fraunces', Georgia, serif;
  --sans:'Cairo', system-ui, -apple-system, sans-serif;
  --r-xs:10px; --r-sm:14px; --r-md:20px; --r-lg:28px; --r-full:999px;
  --shadow-sm:0 1px 2px rgba(31,22,16,.06), 0 2px 8px rgba(31,22,16,.04);
  --shadow-md:0 4px 14px rgba(31,22,16,.08), 0 8px 32px rgba(31,22,16,.06);
  --shadow-lg:0 20px 40px rgba(31,22,16,.12);
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --nav-h:64px;
  --bottom-h:72px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;
  overflow-x:hidden;padding-bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px) + 20px);
  -webkit-font-smoothing:antialiased;
}
button,a,input,textarea,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
img{display:block;max-width:100%}
svg{width:20px;height:20px;flex-shrink:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
.muted{color:var(--ink-2)}
.price-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ╔═ [CSS] الهيدر العلوي */
.topbar{
  position:sticky;top:0;z-index:100;background:rgba(250,245,236,.92);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);
}
.topbar .container{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.brand .logo-mark{
  width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-size:20px;flex-shrink:0;overflow:hidden;
}
.brand .logo-mark img{width:100%;height:100%;object-fit:cover}
.brand-text{line-height:1.15}
.brand-text .brand-name{font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:-.02em;display:block}
.brand-text small{font-size:10.5px;font-weight:600;color:var(--primary);letter-spacing:.06em;text-transform:uppercase;display:block;margin-top:2px}

.actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink);position:relative;transition:transform .2s var(--ease),background .2s,border-color .2s;
}
.icon-btn:hover{background:var(--bg-2);border-color:var(--ink-3)}
.icon-btn:active{transform:scale(.94)}
.badge{
  position:absolute;top:-3px;left:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--primary);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--bg);transform:scale(0);transition:transform .3s var(--spring);
}
.badge.show{transform:scale(1)}

.desk-nav{display:none;gap:24px;margin-right:auto;margin-left:20px}
.desk-nav a{font-size:14.5px;font-weight:700;color:var(--ink-2);position:relative;padding:6px 0;transition:color .15s}
.desk-nav a:hover,.desk-nav a.active{color:var(--ink)}
.desk-nav a.active::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--primary);border-radius:2px}

/* ╔═ [CSS] البانر الرئيسي */
.hero{position:relative;margin:20px 0 24px;border-radius:var(--r-lg);overflow:hidden;min-height:340px;display:flex;align-items:flex-end;isolation:isolate;box-shadow:var(--shadow-lg)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,5,.15) 0%,rgba(20,10,5,.55) 60%,rgba(20,10,5,.85) 100%);z-index:-1}
.hero-content{padding:32px 28px;color:#fff;width:100%}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);
  backdrop-filter:blur(8px);padding:6px 12px;border-radius:var(--r-full);
  font-size:12px;font-weight:600;letter-spacing:.04em;margin-bottom:14px;
  border:1px solid rgba(255,255,255,.25);
}
.hero-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(232,164,37,.3)}
.hero h1{font-size:clamp(28px, 6.5vw, 46px);font-weight:900;line-height:1.15;letter-spacing:-.02em;margin-bottom:10px;max-width:520px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:15.5px;color:rgba(255,255,255,.9);margin-bottom:20px;max-width:420px;line-height:1.6}
.hero-cta{
  display:inline-flex;align-items:center;gap:10px;background:var(--primary);color:#fff;
  padding:14px 24px;border-radius:var(--r-full);font-weight:700;font-size:15px;
  box-shadow:0 8px 20px rgba(217,64,31,.35);transition:transform .2s var(--ease),background .2s;
}
.hero-cta:hover{background:var(--primary-dark);transform:translateY(-2px)}
@media(min-width:900px){
  .hero{min-height:440px;margin:28px 0 36px}
  .hero-content{padding:56px}
  .hero h1{font-size:clamp(40px, 5vw, 60px)}
  .hero p{font-size:18px}
}

/* ╔═ [CSS] عناوين الأقسام */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:32px 0 16px;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:24px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
.sec-head h2 em{font-style:normal;color:var(--primary)}
.sec-head .more{font-size:13.5px;font-weight:700;color:var(--primary);display:inline-flex;align-items:center;gap:4px}
.sec-head .more svg{width:16px;height:16px;transition:transform .2s}
.sec-head .more:hover svg{transform:translateX(-3px)}

/* ╔═ [CSS] شريط تقدم التوصيل */

/* ╔═ [CSS] أزرار التصنيفات */
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:8px;scrollbar-width:none;scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cat-pill{
  flex:0 0 auto;background:var(--surface);border:1px solid var(--line);padding:10px 18px;
  border-radius:var(--r-full);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;
  color:var(--ink);box-shadow:var(--shadow-sm);transition:transform .2s,background .2s,border-color .2s,color .2s;
  scroll-snap-align:start;white-space:nowrap;
}
.cat-pill:hover{transform:translateY(-2px);border-color:var(--ink-3)}
.cat-pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat-pill .emoji{font-size:17px;line-height:1}

/* ╔═ [CSS] كروت المنتجات */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-bottom:32px}
.product-grid.horizontal{display:flex;overflow-x:auto;gap:16px;padding-bottom:8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.product-grid.horizontal::-webkit-scrollbar{display:none}
.product-grid.horizontal > .product{flex:0 0 240px;scroll-snap-align:start}

.product{
  background:var(--surface);border-radius:var(--r-md);overflow:hidden;cursor:pointer;
  transition:transform .3s var(--ease),box-shadow .3s;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;border:1px solid var(--line);position:relative;
}
.product:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.product-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg-2)}
.product-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.product:hover .product-img img{transform:scale(1.06)}
.product-badges{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;max-width:calc(100% - 20px)}
.badge-tag{
  font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:var(--r-full);letter-spacing:.02em;
  display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.badge-tag.hot{background:var(--primary);color:#fff}
.badge-tag.free-delivery{background:var(--success);color:#fff}
.badge-tag.veggie{background:#E8F5E9;color:#1B5E20;border:1px solid #C8E6C9}
.badge-tag.secret{background:#1F1610;color:var(--accent);border:1px solid var(--accent)}
.badge-tag.spicy{background:#FFF3E0;color:#E65100;border:1px solid #FFE0B2}

.product-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.product-name{font-size:16px;font-weight:800;line-height:1.3;margin-bottom:6px;color:var(--ink)}
.product-desc{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.product-price{display:flex;align-items:baseline;gap:6px;font-size:17px;font-weight:800;color:var(--ink);direction:ltr;unicode-bidi:isolate}
.product-price .from{font-size:11px;font-weight:500;color:var(--ink-3);margin-right:2px}
.product-price s{color:var(--ink-3);font-weight:400;font-size:13px}
.product-price .sale{color:var(--primary)}
.product-rating{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px;margin-bottom:8px;direction:ltr;unicode-bidi:isolate;justify-content:flex-end;width:fit-content}
.product-rating .star{color:var(--accent);font-size:13px}

.add-btn{
  width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:20px;font-weight:400;line-height:1;
  transition:transform .2s var(--spring),background .2s;flex-shrink:0;
}
.add-btn:hover{background:var(--primary);transform:scale(1.1)}
.add-btn:active{transform:scale(.9)}
.add-btn.done{background:var(--success)}

/* ╔═ [CSS] عرض اختيار الشيف */
.featured-deal{
  display:grid;grid-template-columns:1fr;background:var(--surface);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md);
  border:1px solid var(--line);margin-bottom:32px;
}
.featured-deal-img{aspect-ratio:16/10;overflow:hidden}
.featured-deal-img img{width:100%;height:100%;object-fit:cover}
.featured-deal-content{padding:24px;display:flex;flex-direction:column;justify-content:center}
.featured-deal-content .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--primary);margin-bottom:10px}
.featured-deal-content h3{font-size:24px;font-weight:900;line-height:1.2;margin-bottom:8px}
.featured-deal-content p{color:var(--ink-2);font-size:14px;margin-bottom:16px;line-height:1.6}
.featured-deal-content .price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;direction:ltr;unicode-bidi:isolate;justify-content:flex-end;width:fit-content}
.featured-deal-content .price-row .new{font-size:26px;font-weight:900;color:var(--primary)}
.featured-deal-content .price-row s{color:var(--ink-3);font-size:15px}
@media(min-width:720px){
  .featured-deal{grid-template-columns:1fr 1fr}
  .featured-deal-img{aspect-ratio:auto;min-height:280px}
  .featured-deal-content{padding:40px}
  .featured-deal-content h3{font-size:30px}
}

/* عروض الصفحة الرئيسية القادمة من جدول menu_promotions */
.home-offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:0 0 30px}
.hero-slider-controls{display:flex;align-items:center;gap:10px;margin-top:12px}.hero-slider-controls button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);color:inherit;font-size:25px;font-weight:900;border:1px solid rgba(255,255,255,.35)}.hero-slider-controls span{font-size:12px;font-weight:800}
.home-offer{display:flex;gap:12px;align-items:center;min-width:0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm)}
.home-offer img{width:88px;height:88px;object-fit:cover;border-radius:var(--r-sm);background:var(--bg-2);flex-shrink:0}
.home-offer-body{min-width:0;flex:1}
.home-offer h3{font-size:15px;font-weight:900;line-height:1.4;margin-bottom:4px}
.home-offer-value{display:inline-flex;margin:2px 0 6px;padding:4px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:900}
.home-offer p{font-size:12px;color:var(--ink-2);line-height:1.5;margin-bottom:8px}
.home-offer a{display:inline-flex;color:var(--primary);font-size:12px;font-weight:800}
/* ╔═ [CSS] الأزرار العامة */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 24px;border-radius:var(--r-full);font-weight:700;font-size:15px;
  transition:transform .2s var(--ease),box-shadow .2s,background .2s,opacity .2s;
  cursor:pointer;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(217,64,31,.25)}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 6px 16px rgba(217,64,31,.35);transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-outline{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn-outline:hover{background:var(--ink);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:9px 18px;font-size:13px}

/* ╔═ [CSS] نافذة تفاصيل المنتج */
.overlay{position:fixed;inset:0;background:rgba(20,10,5,.55);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:1000}
.overlay.show{opacity:1;visibility:visible}
.sheet{
  position:fixed;left:0;right:0;bottom:0;margin:auto;width:100%;max-width:560px;max-height:92vh;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:1001;
  transform:translateY(105%);visibility:hidden;transition:transform .4s var(--ease),visibility .4s;
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet.show{transform:none;visibility:visible}
.sheet-scroll{overflow-y:auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));flex:1;overscroll-behavior:contain}
.sheet-img{position:relative;aspect-ratio:16/10;background:var(--bg-2);overflow:hidden}
.sheet-img img{width:100%;height:100%;object-fit:cover}
.sheet-close{
  position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);display:grid;place-items:center;
  color:var(--ink);z-index:5;transition:transform .2s;box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.sheet-close:hover{transform:scale(1.08)}
.sheet-content{padding:22px 22px 0}
.sheet-title{font-size:26px;font-weight:900;line-height:1.2;margin-bottom:6px}
.sheet-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin-bottom:14px;flex-wrap:wrap}
.sheet-meta .rating{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:var(--ink);direction:ltr}
.sheet-meta .rating .star{color:var(--accent)}
.sheet-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3)}
.sheet-desc{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin-bottom:20px}

.option-group{margin-bottom:22px}
.option-group h4{font-size:13px;font-weight:800;color:var(--ink-2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.option-group h4 small{font-size:11px;font-weight:500;color:var(--ink-3)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s;background:var(--surface)}
.opt:hover{border-color:var(--ink-3)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.opt-label{display:flex;flex-direction:column;gap:2px}
.opt-label strong{font-size:14.5px;font-weight:700;color:var(--ink)}
.opt-label small{font-size:11.5px;color:var(--ink-2)}
.opt-price{font-weight:700;font-size:14px;color:var(--ink);direction:ltr;unicode-bidi:isolate}
.opt.sel .opt-price{color:var(--primary)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap}
.pillrow .opt{flex:1 1 auto;min-width:90px;justify-content:center;padding:11px 14px}
.pillrow .opt .opt-label{align-items:center;text-align:center}

.sheet-footer{
  position:absolute;bottom:0;left:0;right:0;
  padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
  box-shadow:0 -4px 20px rgba(31,22,16,.06);
}
.qty-stepper{display:flex;align-items:center;background:var(--bg-2);border-radius:var(--r-full);padding:4px;flex-shrink:0}
.qty-stepper button{width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:700;display:grid;place-items:center;color:var(--ink);transition:background .15s}
.qty-stepper button:hover{background:var(--surface)}
.qty-stepper span{min-width:26px;text-align:center;font-weight:800;font-size:15px;direction:ltr}
.sheet-footer .btn{flex:1}

.note-input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:14px;resize:none;min-height:60px;font-family:inherit;color:var(--ink);transition:border-color .15s}
.note-input:focus{outline:none;border-color:var(--primary)}
.allergy-note{font-size:12.5px;color:#B25B00;background:#FFF8E1;border:1px solid #FFE0B2;padding:10px 14px;border-radius:var(--r-xs);margin-bottom:18px;line-height:1.6}

@media(min-width:720px){
  .sheet{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-46%) scale(.96);opacity:0;border-radius:var(--r-lg);max-height:88vh;transition:transform .35s var(--spring),opacity .25s,visibility .25s}
  .sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet-img{aspect-ratio:16/8}
  .sheet-title{font-size:30px}
}

/* ╔═ [CSS] السلة */
.cart-layout{display:grid;gap:24px;margin-bottom:40px}
.cart-items{display:flex;flex-direction:column;gap:12px}
.cart-item{display:flex;align-items:center;gap:14px;background:var(--surface);padding:12px;border-radius:var(--r-md);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.cart-item-img{width:72px;height:72px;border-radius:var(--r-sm);overflow:hidden;flex-shrink:0;background:var(--bg-2)}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1;min-width:0}
.cart-item-info h4{font-size:15px;font-weight:800;margin-bottom:2px}
.cart-item-info .opts{font-size:12px;color:var(--ink-2);line-height:1.5}
.cart-item-info .note{font-size:11.5px;font-style:italic;color:var(--primary);margin-top:2px}
.cart-item-info .line-price{font-size:15px;font-weight:800;margin-top:6px;color:var(--ink);display:flex;gap:8px;align-items:baseline;direction:ltr;unicode-bidi:isolate;justify-content:flex-end;width:fit-content}
.cart-item-info .line-price s{color:var(--ink-3);font-weight:400;font-size:12px}
.cart-item .qty-stepper{margin-right:auto;margin-left:0}

.summary{background:var(--surface);border-radius:var(--r-lg);padding:22px;border:1px solid var(--line);box-shadow:var(--shadow-md)}
.summary h3{font-size:20px;font-weight:900;margin-bottom:16px}
.coupon-row{display:flex;gap:8px;margin-bottom:6px}
.coupon-row input{flex:1;min-width:0;padding:11px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--ink);transition:border-color .15s}
.coupon-row input:focus{outline:none;border-color:var(--primary)}
.coupon-msg{font-size:12.5px;min-height:16px;margin-bottom:10px;color:var(--danger)}
.coupon-msg.ok{color:var(--success)}

.summary-row{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);margin-bottom:9px;gap:10px}
.summary-row.discount{color:var(--success);font-weight:700}
.summary-row.total{font-size:18px;font-weight:900;color:var(--ink);border-top:1.5px dashed var(--line);padding-top:14px;margin-top:8px;margin-bottom:18px}
.summary-row .free{color:var(--success);font-weight:700}
.summary-row .num{direction:ltr;unicode-bidi:isolate}

.upsell-note{font-size:12.5px;color:var(--success);background:var(--success-soft);padding:9px 12px;border-radius:var(--r-xs);margin-bottom:14px;font-weight:600}

.sec-label{font-size:12px;font-weight:800;color:var(--ink-2);margin:18px 0 10px}
.form-grid{display:grid;gap:10px}
.form-grid label{font-size:12.5px;font-weight:700;color:var(--ink);display:block;margin-bottom:4px}
.form-grid input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:15px;color:var(--ink);transition:border-color .15s}
.form-grid input:focus{outline:none;border-color:var(--primary)}
.form-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.form-error{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0}
.pay-note{display:flex;align-items:center;gap:10px;background:var(--bg-2);border-radius:var(--r-sm);padding:12px 14px;margin:14px 0;font-size:13px}
.pay-note-icon{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.pay-note strong{display:block;font-size:13.5px;color:var(--ink)}
.pay-note small{font-size:11.5px;color:var(--ink-2)}

@media(min-width:900px){
  .cart-layout{grid-template-columns:1.4fr 1fr;align-items:start}
  .summary{position:sticky;top:calc(var(--nav-h) + 20px)}
}

/* ╔═ [CSS] الطلبات */
.order-card{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);box-shadow:var(--shadow-sm);padding:18px;margin-bottom:14px}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.order-head h4{font-size:16px;font-weight:800;margin-bottom:2px}
.order-head small{font-size:12px;color:var(--ink-2)}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-full);font-size:12px;font-weight:700;white-space:nowrap}
.status-pill.pending{background:var(--primary-soft);color:var(--primary)}
.status-pill.done{background:var(--success-soft);color:var(--success)}
.status-pill .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse-dot 1.4s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}

/* شريط تتبع الطلب: متوازن على الموبايل والكمبيوتر، واتجاهه من اليمين لليسار */
.progress-steps{display:flex;direction:rtl;align-items:flex-start;position:relative;margin:18px 0 20px;padding:0 2px;min-width:0;isolation:isolate}
.progress-steps .step{flex:1 1 0;min-width:0;text-align:center;font-size:clamp(10px,2.7vw,12px);line-height:1.35;font-weight:800;color:var(--ink-3);position:relative;padding:27px 3px 0;min-height:49px;overflow-wrap:anywhere;word-break:normal;z-index:2}
.progress-steps .step::before{content:'';position:absolute;top:1px;left:50%;transform:translateX(-50%);width:13px;height:13px;box-sizing:border-box;border-radius:50%;background:var(--surface);border:2px solid var(--line);z-index:3;box-shadow:0 0 0 3px var(--surface)}
.progress-steps .step::after{content:'';position:absolute;top:6px;left:-50%;right:50%;height:3px;border-radius:4px;background:var(--line);z-index:1;transition:background .3s ease}
.progress-steps .step:last-child::after{display:none}
.progress-steps .step.on{color:var(--primary)}
.progress-steps .step.on::before{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.progress-steps .step.on::after{background:var(--primary)}
@media(max-width:380px){.progress-steps{margin:16px -4px 18px}.progress-steps .step{font-size:9.5px;padding-left:1px;padding-right:1px;padding-top:25px;min-height:46px}.progress-steps .step::before{width:12px;height:12px}.progress-steps .step::after{top:5px;height:2px}}
@media(min-width:600px){.progress-steps{max-width:560px;margin:20px auto 22px}.progress-steps .step{font-size:12px;padding-top:29px}.progress-steps .step::before{width:14px;height:14px}.progress-steps .step::after{top:6px}}

.order-items{background:var(--bg-2);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:12px}
.order-item-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;gap:10px}
.order-item-row span:first-child{color:var(--ink-2)}
.order-item-row small{display:block;color:var(--ink-3);font-size:11.5px}
.order-item-row .price-cell{font-weight:700;color:var(--ink);direction:ltr;unicode-bidi:isolate;flex-shrink:0}
.order-total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:800;padding-top:10px;margin-top:8px;border-top:1px solid var(--line)}
.order-total-row span:last-child{direction:ltr;unicode-bidi:isolate}

/* ╔═ [CSS] الشاشات الفارغة */
.empty{text-align:center;padding:60px 20px;max-width:420px;margin:0 auto}
.empty-icon{width:100px;height:100px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;margin:0 auto 20px;font-size:44px}
.empty h2{font-size:22px;font-weight:900;margin-bottom:8px}
.empty p{color:var(--ink-2);margin-bottom:24px;font-size:14.5px;line-height:1.6}

/* ╔═ [CSS] صفحة المكافآت */
.profile-wrap{max-width:600px;margin:0 auto;padding-bottom:20px}
.profile-head{background:var(--surface);border-radius:var(--r-lg);padding:28px 22px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow-sm);margin-bottom:16px}
.profile-avatar{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary-soft),#FFE4D8);color:var(--primary);
  display:grid;place-items:center;margin:0 auto 14px;font-size:34px;font-weight:800;
  border:3px solid var(--surface);box-shadow:0 4px 12px rgba(217,64,31,.15);
}
.profile-head h2{font-size:22px;font-weight:900;margin-bottom:4px}
.profile-head p{color:var(--ink-2);font-size:14px;margin-bottom:16px}
.name-input-row{display:flex;gap:8px;max-width:340px;margin:0 auto}
.name-input-row input{flex:1;min-width:0;padding:11px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink);transition:border-color .15s}
.name-input-row input:focus{outline:none;border-color:var(--primary)}

.card-block{background:var(--surface);border-radius:var(--r-md);padding:20px;border:1px solid var(--line);box-shadow:var(--shadow-sm);margin-bottom:14px}
.card-block h3{font-size:18px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.stamps-row{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:14px}
.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--bg-2);border:1.5px dashed var(--line)}
.stamp.filled{background:var(--primary);color:#fff;border-style:solid;border-color:var(--primary);font-size:16px;animation:pop .4s var(--spring)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

.points-big{font-size:36px;font-weight:900;color:var(--primary);line-height:1;margin-bottom:4px;direction:ltr;unicode-bidi:isolate;text-align:right}
.points-track{height:8px;border-radius:8px;background:var(--bg-2);overflow:hidden;margin:10px 0 6px}
.points-track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:8px;transition:width .6s var(--ease)}
.points-sub{font-size:12.5px;color:var(--ink-2)}

.voucher-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-2);border-radius:var(--r-sm);margin-bottom:8px}
.voucher-row:last-child{margin-bottom:0}
.voucher-icon{font-size:22px;flex-shrink:0}
.voucher-info{flex:1;min-width:0}
.voucher-info strong{display:block;font-size:14px;color:var(--ink)}
.voucher-info small{font-size:11.5px;color:var(--ink-2)}

.achievements-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.ach{text-align:center;padding:10px 6px;border-radius:var(--r-sm);background:linear-gradient(145deg,var(--ach-bg,#f6f6f6),#fff);border:1px solid var(--ach-border,#e4e4e4);transition:opacity .2s,filter .2s,transform .2s;box-shadow:0 2px 8px color-mix(in srgb,var(--ach-color,#777) 10%,transparent)}
.ach-icon{color:var(--ach-color,#555)}
.ach.locked{opacity:.48;filter:grayscale(.85)}
.ach:not(.locked){transform:translateY(-1px)}
.ach-icon{font-size:24px;margin-bottom:4px}
.ach-name{font-size:10.5px;font-weight:700;line-height:1.3;color:var(--ink)}

.menu-list{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px}
.menu-item{
  display:flex;align-items:center;justify-content:space-between;padding:15px 20px;
  border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600;color:var(--ink);
  width:100%;transition:background .15s,padding-right .2s;cursor:pointer;background:var(--surface);text-align:right;
}
.menu-item:last-child{border-bottom:none}
.menu-item:hover{background:var(--bg-2);padding-right:24px}
.menu-item .arrow{color:var(--ink-3);transition:transform .15s}
.menu-item:hover .arrow{transform:translateX(-4px);color:var(--primary)}

/* ╔═ [CSS] شريط التنقل السفلي */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(255,255,255,.94);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;
  z-index:100;box-shadow:0 -4px 20px rgba(31,22,16,.04);
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--ink-3);min-width:52px;padding:8px 4px;transition:color .15s;position:relative}
.nav-item .ic{width:36px;height:26px;display:grid;place-items:center;position:relative;transition:transform .2s var(--ease)}
.nav-item .ic svg{width:22px;height:22px}
.nav-item.active{color:var(--primary)}
.nav-item.active .ic{transform:translateY(-1px)}
.nav-item .badge{top:-4px;left:-2px;border-color:#fff}

/* ╔═ [CSS] Toast */
.toast{
  position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r-full);font-size:14px;font-weight:600;
  box-shadow:0 12px 30px rgba(31,22,16,.3);z-index:2000;display:flex;align-items:center;gap:9px;
  max-width:calc(100% - 32px);transition:transform .35s var(--spring);pointer-events:none;
}
.toast.show{transform:translate(-50%,0)}
.toast svg{color:var(--accent);flex-shrink:0}

/* ╔═ [CSS] شريط السلة العائم */
.sticky-cart{
  position:fixed;bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px) + 10px);left:16px;right:16px;
  background:var(--ink);color:#fff;padding:14px 20px;border-radius:var(--r-full);
  display:none;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:0 12px 30px rgba(31,22,16,.35);z-index:90;cursor:pointer;
  transition:transform .3s var(--spring),opacity .3s;
}
.sticky-cart.show{display:flex}
.sticky-cart:active{transform:scale(.98)}
.sticky-cart-info{display:flex;flex-direction:column;gap:1px;align-items:flex-start}
.sticky-cart-info small{font-size:11px;opacity:.75;font-weight:600}
.sticky-cart-info strong{font-size:15px;font-weight:800;direction:ltr;unicode-bidi:isolate}
.sticky-cart-cta{background:var(--primary);padding:8px 16px;border-radius:var(--r-full);font-size:13px;font-weight:700}
@media(min-width:900px){.sticky-cart{display:none !important}}

/* ╔═ [CSS] الأنيميشن الأساسي */
.view-anim{animation:fadeUp .4s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stagger > *{opacity:0;animation:fadeUp .4s var(--ease) forwards}
.stagger > *:nth-child(1){animation-delay:0ms}
.stagger > *:nth-child(2){animation-delay:60ms}
.stagger > *:nth-child(3){animation-delay:120ms}
.stagger > *:nth-child(4){animation-delay:180ms}
.stagger > *:nth-child(5){animation-delay:240ms}

.confetti-box{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.confetti-piece{position:absolute;top:-12px;width:8px;height:8px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:.3}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}

.skip-link{position:absolute;top:-100px;right:8px;background:var(--primary);color:#fff;padding:10px 16px;border-radius:8px;z-index:9999;transition:top .2s}
.skip-link:focus{top:8px}

.install-btn{
  display:none;position:fixed;bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px) + 10px);
  left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;
  padding:10px 22px;border-radius:var(--r-full);font-size:13px;font-weight:700;
  box-shadow:0 8px 24px rgba(217,64,31,.35);z-index:89;
}
.install-btn.show{display:inline-flex;align-items:center;gap:6px}
@media(min-width:900px){.install-btn{bottom:20px}}

@media(min-width:900px){
  .desk-nav{display:flex}
  .bottom-nav{display:none}
  body{padding-bottom:20px}
  :root{--nav-h:72px}
  .brand-text .brand-name{font-size:21px}
}

/* ╔═ [CSS] أنيميشن إضافي */
@keyframes revealUp{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.reveal{opacity:0}
.reveal.in{opacity:1;animation:revealUp .65s var(--ease) backwards;animation-delay:var(--d,0ms)}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08)}}
.hero-img{animation:kenburns 14s ease-in-out infinite alternate}
@keyframes heroIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.hero-eyebrow{animation:heroIn .6s var(--ease) .1s backwards}
.hero h1{animation:heroIn .7s var(--ease) .2s backwards}
.hero p{animation:heroIn .7s var(--ease) .32s backwards}
.hero-cta{animation:heroIn .7s var(--ease) .44s backwards}
@keyframes slideInItem{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.cart-item{animation:slideInItem .45s var(--ease) backwards}
.cart-item:nth-child(2){animation-delay:70ms}.cart-item:nth-child(3){animation-delay:140ms}.cart-item:nth-child(n+4){animation-delay:210ms}
.stagger > *:nth-child(n+6){animation-delay:300ms}
@keyframes badgePulse{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.badge.show.pulse{animation:badgePulse .45s var(--spring)}
.btn,.hero-cta,.add-btn{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.fly-dot{position:fixed;z-index:3000;font-size:22px;pointer-events:none;line-height:1}
@keyframes stepPop{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}
@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.step.on::before{animation:stepPop .5s var(--spring) backwards}
.step.on::after{transform-origin:right;animation:lineGrow .8s var(--ease) .15s backwards}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty-icon{animation:floaty 3s ease-in-out infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes optIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet.show .sheet-content > *{animation:optIn .45s var(--ease) backwards}
.sheet.show .sheet-content > *:nth-child(2){animation-delay:60ms}.sheet.show .sheet-content > *:nth-child(3){animation-delay:100ms}.sheet.show .sheet-content > *:nth-child(4){animation-delay:140ms}.sheet.show .sheet-content > *:nth-child(n+5){animation-delay:180ms}
.product:active{transform:scale(.98)}
@keyframes catIn{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
[data-grid] .product.swap{animation:catIn .5s var(--ease) backwards;animation-delay:var(--d,0ms)}
@keyframes pillPop{0%{transform:scale(.88)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.cat-pill.active.pop{animation:pillPop .4s var(--spring)}
.instant .view-anim,.instant .cart-item,.instant .reveal.in{animation:none!important}
.instant .stagger > *{animation:none!important;opacity:1!important}


/* ═════════════════════════════════════════════════════════════════════
   ★★★ [UI/UX/CSS] طبقة تحسينات شاملة ★★★
   ║ ① Touch Targets · ② Breakpoints · ③ Micro-interactions
   ║ ④ A11y · ⑤ Perf/Loading · ⑥ Safe-Area
   ║ ⚠️ لا تلمس أي منطق JS — كل التحسينات CSS فقط
   ═════════════════════════════════════════════════════════════════════ */

/* ─── ① مساحات لمس آمنة (Touch Targets ≥ 44px) ───────────────────── */
.icon-btn{width:44px;height:44px}
.sheet-close{width:44px;height:44px}
.add-btn{width:38px;height:38px;position:relative}
.add-btn::before{content:'';position:absolute;inset:-3px;border-radius:50%;pointer-events:auto}
.qty-stepper button{width:34px;height:34px;position:relative}
.qty-stepper button::before{content:'';position:absolute;inset:-5px;border-radius:50%;pointer-events:auto}
.cat-pill{min-height:44px;padding-top:11px;padding-bottom:11px}
.menu-item{min-height:52px}
.nav-item{min-height:54px;min-width:58px}
.step{min-height:44px}

/* ─── ② Typography متجاوبة (Fluid) ────────────────────────────────── */

.product{transition:transform .35s var(--ease), box-shadow .35s var(--ease)}

.icon-btn{transition:transform .25s var(--spring), background .2s, border-color .2s, box-shadow .2s}
.icon-btn:hover{background:var(--bg-2);border-color:var(--ink-3);transform:translateY(-1px) scale(1.04);box-shadow:var(--shadow-md)}
.icon-btn:active{transform:scale(.92)}

.add-btn{transition:transform .25s var(--spring), background .2s, box-shadow .2s}
.add-btn:hover{background:var(--primary);transform:scale(1.1);box-shadow:0 4px 12px rgba(217,64,31,.3)}
.add-btn:active{transform:scale(.86)}

.btn{transition:transform .2s var(--spring), box-shadow .2s, background .2s, opacity .2s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:scale(.96)}

.cat-pill{transition:transform .25s var(--spring), background .2s, border-color .2s, color .2s, box-shadow .2s}
.cat-pill:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.cat-pill:active{transform:scale(.96)}

.note-input:focus, input[type="search"]:focus{

}

.card-block{transition:box-shadow .25s var(--ease), border-color .25s var(--ease)}

.step.on{transition:color .4s ease}

.stamp{transition:transform .3s var(--spring), background .3s, border-color .3s}

.product-img, .cart-item-img, .sheet-img, .featured-deal-img{

}
.product-img img, .cart-item-img img, .sheet-img img, .featured-deal-img img{

}

/* منع تداخل زر التثبيت مع شريط السلة العائم (CSS-only عبر :has) */
body:has(#stickyCart.show) .install-btn{

}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg-2)}

}

/* تعزيز احترام تقليل الحركة — إيقاف الـ shimmer */
@media (prefers-reduced-motion: reduce){
  .product-img, .cart-item-img, .sheet-img, .featured-deal-img{animation:none;background:var(--bg-2)}
  .product:hover, .btn:hover, .icon-btn:hover, .add-btn:hover, .cat-pill:hover{transform:none}
}

<script>
(() => {
  'use strict';

  /* ═══════════════════════════════════════════════
     [JS] الإعدادات والثوابت
     ═══════════════════════════════════════════════ */
  const CONFIG = Object.freeze({
    MAX_QTY: 20,
    STATUS_STEP_MS: 6000,
    STORAGE_SCHEMA: 6,
    STORAGE_PREFIX: 'sheepburger_v6_'
  });

  const STATUSES = ['تم الاستلام', 'بيتحضر', 'في الطريق', 'تم التوصيل'];
  const SPICE_LEVELS = ['هادي', 'وسط', 'حار'];

  const ACHIEVEMENT_PALETTES = [['#fff0e8','#fbd1bf','#b93816'],['#edf4ff','#cbdfff','#2456a6'],['#fff7d6','#ffe8a1','#946200'],['#e8f8ef','#c4efd6','#167347'],['#f5eaff','#e2ccff','#7137a8'],['#ffeaf2','#ffc9dc','#a9275b'],['#e6f8fb','#bcecf4','#116b7a'],['#f2f2f2','#dedede','#414141']];
  const achievementStyle = i => { const p=ACHIEVEMENT_PALETTES[i % ACHIEVEMENT_PALETTES.length]; return `--ach-bg:${p[0]};--ach-border:${p[1]};--ach-color:${p[2]}`; };

  // Achievement definitions are managed in the admin panel and loaded from Supabase.
  async function loadAchievementDefinitions() {
    if (!sbClient) return false;
    const { data, error } = await sbClient.from('achievements')
      .select('achievement_key,name_ar,description_ar,icon,is_active')
      .eq('is_active', true).order('sort_order').order('created_at');
    if (error) { console.warn('[Achievements] تعذر تحميل إعدادات الإنجازات'); return false; }
    ACHIEVEMENTS = Object.fromEntries((data || []).map(a => [a.achievement_key, {
      name: a.name_ar, icon: a.icon || '🏆', desc: a.description_ar || ''
    }]));
    state.achievements = (Array.isArray(state.achievements) ? state.achievements : []).filter(k => k in ACHIEVEMENTS);
    return true;
  }

  /* ═══════════════════════════════════════════════

  const img = () => '';

  const CUSTOMER_APP_BUILD = 'supabase-live-home-promotions-subcategories-slider-2026-10-28-fix7';
  const SB_URL = 'https://gwufhitzmupyumdjabnj.supabase.co';
  const SB_KEY = 'sb_publishable_oTZFsXGeGb_PAhI7A-eTAw_MGwsBTGG';
  const sbClient = window.supabase?.createClient
    ? window.supabase.createClient(SB_URL, SB_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'sheepburger-customer-auth-v1' }

    : null;

  const categoryKey = (slug, name) => {
    const value = String(slug || '').toLowerCase();
    const label = String(name || '').toLowerCase();
    if (value.includes('burger') || label.includes('برجر')) return 'Burgers';
    if (value.includes('chicken') || value.includes('meal') || label.includes('فراخ')) return 'Chicken';
    if (value.includes('side') || value.includes('add') || label.includes('جانبي')) return 'Sides';
    if (value.includes('drink') || label.includes('مشروب')) return 'Drinks';
    if (value.includes('dessert') || value.includes('sweet') || label.includes('حلويات')) return 'Desserts';
    return null;
  };
  const liveAddonIds = Object.create(null);

  const loadLiveMenu = async () => {
    if (!sbClient) return;
    liveMenuError = false;
    try {
      const [{ data: cats, error: catsError }, { data: rows, error: itemsError }, { data: sizes, error: sizesError }, { data: settings, error: settingsError }, { data: zones, error: zonesError }, addonResult, itemAddonResult, subcategoryResult, promotionResult, reviewsResult] = await Promise.all([
        sbClient.from('categories').select('id,slug,name_ar,sort_order,is_active').eq('is_active', true).order('sort_order'),
        // لا تُرسل الأصناف السرية في الاستعلام العام؛ يتم تحميلها بعد التحقق من الكود على الخادم.

  const sanitizeSpecial = raw => {
    if (!raw || typeof raw !== 'object') return null;
    if (raw.type === 'free') return { type: 'free' };
    if (raw.type === 'fixed' && Number.isFinite(Number(raw.price)) && Number(raw.price) >= 0) return { type: 'fixed', price: Number(raw.price) };
    if (raw.type === 'percent' && Number.isFinite(Number(raw.pct)) && raw.pct > 0 && raw.pct < 1) return { type: 'percent', pct: Number(raw.pct) };
    return null;
  };

    if (!raw || typeof raw !== 'object' || !ITEM[raw.id]) return null;
    const it = ITEM[raw.id];
    if (!it.sizes.some(s => s.key === raw.size)) return null;
    const addons = Array.isArray(raw.addons) ? raw.addons.filter(a => typeof a === 'string' && it.addons.includes(a)) : [];
    const spice = it.spice && SPICE_LEVELS.includes(raw.spice) ? raw.spice : null;
    const qty = Math.trunc(Number(raw.qty));
    if (!(qty >= 1 && qty <= CONFIG.MAX_QTY)) return null;

  const baseUnitPrice = line => {
    const it = ITEM[line.id]; if (!it) return 0;
    const sp = it.sizes.find(s => s.key === line.size)?.price ?? 0;
    const ap = line.addons.reduce((s, a) => s + (ADDONS[a]?.price ?? 0), 0);
    return round2(sp + ap);
  };

  const unitPrice = (line, ctx = {}) => {
    const it = ITEM[line.id]; if (!it) return 0;
    const sp = it.sizes.find(s => s.key === line.size)?.price ?? 0;
    const ap = line.addons.reduce((s, a) => s + (ADDONS[a]?.price ?? 0), 0);
    let p = sp;
    if (line.special?.type === 'free') p = 0;
    else if (line.special?.type === 'fixed') p = Math.min(sp, line.special.price);
    else if (line.special?.type === 'percent') p = sp * (1 - line.special.pct);
    else {
      const best = Math.max(ctx.coupon?.pct || 0, it.off || 0);
      if (best > 0) p = sp * (1 - best);
    }
    return round2(p + ap);
  };

  // تحويل المكافأة المعتمدة من الخادم لصيغة الحساب المعروضة فقط؛ الخادم هو الذي يطبّق الخصم فعلياً.
  const pricingVouchersFrom = (v) => {
    if (!v) return [];
    if (v.voucher_type === 'percent') return [{ type: 'percent', pct: Math.max(0, Math.min(1, (Number(v.value) || 0) / 100)) }];
    if (v.voucher_type === 'fixed') return [{ type: 'flat', amount: Number(v.value) || 0 }];

  const calculatePricing = (cart, ctx = {}) => {

    // القسائم المحلية أُلغيت: المصدر الوحيد هو مكافآت الخادم المختارة.
    const vouchers = pricingVouchersFrom(ctx.voucher);

      const base = baseUnitPrice(line);

      return { line, base, unit, total: round2(unit * line.qty) };
    });
    const subtotal = round2(itemLines.reduce((s, x) => s + x.total, 0));
    const itemDiscounts = round2(itemLines.reduce((s, x) => s + (x.base - x.unit) * x.line.qty, 0));
    let deliveryFee = 0, freeDeliveryReason = null;
    const liveSettings = window.SHEEPBURGER_STORE || {};
    const selectedZoneId = document.getElementById('fArea')?.value;
    const selectedZone = (window.SHEEPBURGER_ZONES || []).find(z => String(z.id) === String(selectedZoneId));
    const freeDeliveryThreshold = Number(liveSettings.free_delivery_threshold ?? 0);
    if (subtotal > 0) {
      if (freeDeliveryThreshold > 0 && subtotal >= freeDeliveryThreshold) freeDeliveryReason = 'threshold';
      else if (cart.some(l => ITEM[l.id]?.freeDelivery)) freeDeliveryReason = 'item';
      else if (vouchers.some(v => v.type === 'delivery')) freeDeliveryReason = 'voucher';
      else deliveryFee = Number(selectedZone?.fee ?? liveSettings.delivery_fee ?? 0);
    }
    const appliedVouchers = [];
    let voucherDiscount = 0;
    // كوبون قاعدة البيانات يطبق على إجمالي المنتجات، مع احترام الحد الأقصى للخصم.
    if (coupon && (coupon.type === 'percent' || coupon.type === 'fixed')) {
      let couponApply = coupon.type === 'percent' ? round2(subtotal * Math.max(0, Number(coupon.value || 0)) / 100) : Math.max(0, Number(coupon.value || 0));
      if (coupon.max_discount != null) couponApply = Math.min(couponApply, Number(coupon.max_discount));
      couponApply = Math.min(couponApply, subtotal);
      if (couponApply > 0) voucherDiscount += round2(couponApply);
    }
    // تطبيق قسائم النسبة المئوية أولاً على قيمة المنتجات فقط، ثم القسائم الثابتة.
    // كان نوع percent مقبولاً عند حفظ القسيمة لكنه لا يدخل في الحساب النهائي.
    for (const v of vouchers.filter(x => x.type === 'percent')) {
      const pct = Math.max(0, Math.min(1, Number(v.pct) || 0));
      const remainingSubtotal = Math.max(0, subtotal - voucherDiscount);
      const apply = round2(remainingSubtotal * pct);
      if (apply > 0) { voucherDiscount += apply; appliedVouchers.push(v); }
    }
    const running = subtotal + deliveryFee;
    for (const v of vouchers.filter(x => x.type === 'flat')) {
      const apply = round2(Math.min(Number(v.amount) || 0, Math.max(0, running - voucherDiscount)));
      if (apply > 0) { voucherDiscount += apply; appliedVouchers.push(v); }
    }
    const cheeseCount = cart.reduce((n, l) => n + (l.addons.includes('cheese') ? l.qty : 0), 0);
    const freeItemVouchers = vouchers.filter(v => v.type === 'free_item').slice(0, cheeseCount);
    if (freeItemVouchers.length) {
      voucherDiscount += round2(freeItemVouchers.length * (ADDONS.cheese?.price ?? 0));
      appliedVouchers.push(...freeItemVouchers);
    }
    const dv = vouchers.find(v => v.type === 'delivery');
    if (dv && freeDeliveryReason === 'voucher') appliedVouchers.push(dv);
    return {
      subtotal, itemDiscounts, deliveryFee, voucherDiscount,
      total: round2(Math.max(0, subtotal + deliveryFee - voucherDiscount)),
      appliedVouchers, itemLines, freeDeliveryReason
    };
  };

  /* ═══════════════════════════════════════════════
     [JS] السلة
     ═══════════════════════════════════════════════ */
  const lineKey = line => JSON.stringify({
    id: line.id, size: line.size, spice: line.spice ?? '',
    addons: [...line.addons].sort(), note: (line.note || '').trim(),
    special: line.special ? { type: line.special.type, price: line.special.price ?? null, pct: line.special.pct ?? null } : null
  });
  const cartCount = () => state.cart.reduce((s, l) => s + l.qty, 0);
  const commitCart = () => {
    if (!safeSave(K('cart'), state.cart)) toast('تعذر حفظ السلة على هذا الجهاز. ممكن تكون مساحة التخزين ممتلئة.');
    scheduleCartSync();
    updateBadges();
  };

  const addLineToCart = (newLine) => {
    const key = lineKey(newLine);
    const existing = state.cart.find(l => lineKey(l) === key);
    if (existing) existing.qty = clamp(existing.qty + newLine.qty, 1, CONFIG.MAX_QTY);
    else state.cart.push({ ...newLine, uid: uid() });
    commitCart(); bumpIcon();
  };

  const changeQty = (uidVal, delta) => {
    const l = state.cart.find(x => x.uid === uidVal);
    if (!l) return;
    l.qty = clamp(l.qty + delta, 0, CONFIG.MAX_QTY);
    if (l.qty <= 0) state.cart = state.cart.filter(x => x !== l);
    commitCart();
    if (currentRoute() === 'cart') refresh();
  };

  /* ═══════════════════════════════════════════════
     [JS] مزامنة حساب العميل: السلة وسجل الطلبات من قاعدة البيانات
     ═══════════════════════════════════════════════ */
  let cartSyncTimer = null;
  let cartSyncChain = Promise.resolve();
  let cartHydrated = false;
  let customerSyncing = false;
  const CART_SPICE_LEVELS = ['هادي', 'وسط', 'حار'];

  const waitForMenu = async () => {
    for (let i = 0; i < 75 && !liveMenuReady; i++) await new Promise(r => setTimeout(r, 200));
    return liveMenuReady;
  };

  const addonKeyForId = (id) => Object.keys(liveAddonIds).find(k => String(liveAddonIds[k]) === String(id)) || null;

  // تحويل صف من customer_cart_items إلى سطر في السلة المحلية (بنفس شكل addLineToCart)
  const cartLineFromRow = (row) => {
    const item = ITEM[row.item_id];
    if (!item || !Array.isArray(item.sizes) || !item.sizes.length) return null;
    const size = item.sizes.find(z => String(z.key) === String(row.size_id)) || item.sizes[0];
    const addons = (Array.isArray(row.selected_addons) ? row.selected_addons : [])
      .map(a => addonKeyForId(typeof a === 'object' ? a?.id : a)).filter(Boolean);
    return {
      id: item.id, size: size.key, spice: row.spice_level || null, addons,
      note: row.notes || '', qty: clamp(Number(row.quantity) || 1, 1, CONFIG.MAX_QTY),
      special: null, uid: uid()
    };
  };

  // تحويل سطر السلة إلى صف قاعدة البيانات
  const cartRowFromLine = (l) => {
    if (!ITEM[l.id]) return null;
    return {
      item_id: l.id,
      size_id: l.size,
      quantity: clamp(Number(l.qty) || 1, 1, CONFIG.MAX_QTY),
      selected_addons: (l.addons || []).map(key => ADDONS[key]?.dbId || liveAddonIds[key]).filter(Boolean),
      spice_level: CART_SPICE_LEVELS.includes(l.spice) ? l.spice : null,
      notes: (l.note || '').slice(0, 500) || null,
      client_line_key: lineKey(l)
    };
  };

  // رفع السلة الحالية للعميل المسجل (الخادم هو المصدر بعد الدخول)
  const pushServerCart = async () => {
    if (!customerAuthUser || !sbClient) return;
    const seen = new Map();
    state.cart.map(cartRowFromLine).filter(Boolean).forEach(r => { if (!seen.has(r.client_line_key)) seen.set(r.client_line_key, r); });
    const rows = [...seen.values()];
    const { data: cart, error: cartErr } = await sbClient.from('customer_carts')
      .upsert({ user_id: customerAuthUser.id }, { onConflict: 'user_id' }).select('id').single();
    if (cartErr) throw cartErr;
    const { error: delErr } = await sbClient.from('customer_cart_items').delete().eq('cart_id', cart.id);
    if (delErr) throw delErr;
    if (rows.length) {
      const { error: insErr } = await sbClient.from('customer_cart_items')
        .insert(rows.map(r => ({ ...r, cart_id: cart.id })));
      if (insErr) throw insErr;
    }
  };

  // عند الدخول: ندمج سلة الجهاز مع سلة الحساب المحفوظة (بدون تكرار الكميات)
  const hydrateServerCart = async () => {
    if (!customerAuthUser || !sbClient) return;
    const ready = await waitForMenu();
    if (!ready) return;
    const { data: cart, error } = await sbClient.from('customer_carts')
      .select('id').eq('user_id', customerAuthUser.id).maybeSingle();
    if (error) throw error;
    let serverLines = [];
    if (cart) {
      const { data: rows, error: rowsErr } = await sbClient.from('customer_cart_items')
        .select('item_id,size_id,quantity,selected_addons,spice_level,notes,client_line_key')
        .eq('cart_id', cart.id);
      if (rowsErr) throw rowsErr;
      serverLines = (rows || []).map(cartLineFromRow).filter(Boolean);
    }
    const merged = new Map();
    serverLines.forEach(l => merged.set(lineKey(l), l));
    state.cart.forEach(l => {
      if (!ITEM[l.id]) return;
      const k = lineKey(l);
      const ex = merged.get(k);
      if (ex) ex.qty = Math.max(ex.qty, clamp(l.qty, 1, CONFIG.MAX_QTY));
      else merged.set(k, { ...l, uid: uid() });
    });
    state.cart = [...merged.values()];
    safeSave(K('cart'), state.cart);
    updateBadges();
    cartHydrated = true;
    await pushServerCart();
    if (currentRoute() === 'cart') refresh();
  };

  // أي تغيير في السلة يُرسل للخادم بعد توقف قصير (مع طابور لمنع التعارض)
  const scheduleCartSync = () => {
    if (!customerAuthUser || !sbClient || !cartHydrated) return;
    clearTimeout(cartSyncTimer);
    cartSyncTimer = setTimeout(() => {
      cartSyncChain = cartSyncChain
        .then(pushServerCart)
        .catch(e => { console.warn('[Cart] تعذر مزامنة السلة:', e?.message); toast('تعذر حفظ السلة في حسابك. هنحاول تاني.'); });
    }, 400);
  };

  // تحويل صف طلب من الخادم إلى نفس شكل الطلب المحلي الذي تعرضه شاشة الطلبات
  const serverOrderFromRow = (r) => {
    const statusNum = ({ pending: 0, confirmed: 1, preparing: 1, ready: 2, out_for_delivery: 2, delivered: 3, cancelled: 3 })[r.status] ?? 0;
    const created = new Date(r.created_at || Date.now());
    return {
      id: r.order_number, dbId: r.id, trackingToken: null, ownerId: customerAuthUser?.id || null,
      date: created.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' }),
      startedAt: created.getTime(),
      items: (r.order_items || []).map(it => {
        const addonList = Array.isArray(it.addons) ? it.addons : [];
        const addonNames = addonList.map(a => a?.name_ar || a?.name || '').filter(Boolean);
        return {
          itemId: it.item_id, slug: '', name: it.item_name || 'منتج',
          qty: Number(it.quantity) || 1, price: Number(it.unit_price) || 0, basePrice: Number(it.unit_price) || 0,
          details: [it.size_label, it.spice_level, addonNames.length ? `إضافات: ${addonNames.join('، ')}` : '', it.notes ? `ملاحظة: ${it.notes}` : '']
            .filter(Boolean).join(' · '),
          addons: addonList.map(a => (typeof a === 'object' ? a?.id : a)).filter(Boolean),
          size: it.size_id || null, spice: it.spice_level || null, note: it.notes || '', special: null
        };
      }),
      subtotal: Number(r.subtotal || 0), deliveryFee: Number(r.delivery_fee || 0),
      voucherDiscount: Number(r.discount_total || 0), discountTotal: Number(r.discount_total || 0),
      total: Number(r.total || 0), payment: r.payment_method === 'cash' ? 'الدفع عند الاستلام' : (r.payment_method || ''),
      name: r.customer_name || '', address: r.delivery_address || '',
      status: statusNum, statusLabel: r.status === 'cancelled' ? 'تم إلغاء الطلب' : null
    };
  };

  // جلب سجل طلبات الحساب من الخادم ودمجه مع الطلبات المحلية للضيف فقط
  const loadServerOrders = async () => {
    if (!customerAuthUser || !sbClient) return;
    const { data, error } = await sbClient.from('orders')
      .select('id,order_number,status,payment_method,customer_name,delivery_address,subtotal,discount_total,delivery_fee,total,created_at,order_items(item_id,item_name,size_id,size_label,unit_price,addons,quantity,notes,spice_level)')
      .eq('user_id', customerAuthUser.id)
      .order('created_at', { ascending: false })
      .limit(50);
    if (error) { console.warn('[Orders] تعذر تحميل الطلبات:', error.message); return; }
    const serverOrders = (data || []).map(serverOrderFromRow);
    const serverIds = new Set(serverOrders.map(o => String(o.id)));
    const localById = new Map(state.orders.map(o => [String(o.id), o]));
    const merged = serverOrders.map(s => {
      const l = localById.get(String(s.id));
      return l ? { ...s, trackingToken: l.trackingToken || null } : s;
    });
    // نحتفظ بطلبات الضيف على هذا الجهاز فقط، ونُسقط طلبات أي حساب آخر
    state.orders.forEach(o => {
      if (serverIds.has(String(o.id))) return;
      if (!o.ownerId) merged.push(o);
    });
    state.orders = merged.slice(0, 100);
    safeSave(K('orders'), state.orders);
    if (currentRoute() === 'orders') refresh();
  };

  const syncCustomerData = async () => {
    if (!customerAuthUser || !sbClient || customerSyncing) return;
    customerSyncing = true;
    try {
      await loadServerOrders();
      cartSyncChain = cartSyncChain.then(hydrateServerCart).catch(e => console.warn('[Cart] تعذر تحميل السلة:', e?.message));
      await cartSyncChain;
    } catch (e) {
      console.warn('[Sync] تعذر مزامنة بيانات الحساب:', e?.message);
    } finally {
      customerSyncing = false;
    }
  };

  // عند تسجيل الخروج: نُخفي طلبات الحساب من الجهاز ونوقف مزامنة السلة
  const clearCustomerLocalState = () => {
    cartHydrated = false;
    clearTimeout(cartSyncTimer);
    state.orders = state.orders.filter(o => !o.ownerId);
    safeSave(K('orders'), state.orders);
  };

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && customerAuthUser) syncCustomerData();
  });

  /* ═══════════════════════════════════════════════
     [JS] الولاء والمكافآت
     ═══════════════════════════════════════════════ */
  const addStamp = () => { /* الولاء يُحتسب من دفتر الخادم فقط بعد التسليم. */ };
  const addPoints = () => { /* لا يُسمح بحساب نقاط محلي أو ثابت. */ };

  const awardAch = (key) => {
    if (!(key in ACHIEVEMENTS) || state.achievements.includes(key)) return;
    state.achievements.push(key);
    safeSave(K('achievements'), state.achievements);
    toast(`🏆 إنجاز جديد: ${ACHIEVEMENTS[key].name}!`);
    showConfetti();
  };

  const checkAch = () => {
    // Authenticated customers receive achievements only from the database after delivery.
    if (customerAuthUser) return;
    if (state.stats.totalOrders >= 1) awardAch('first_order');
    if (isNight()) awardAch('night_owl');
    if (state.stats.totalOrders >= 10) awardAch('loyal_customer');
    if (state.stats.burgersOrdered >= 10) awardAch('guac_master');
    if (state.stats.veggieOrdered >= 5) awardAch('healthy_choice');
    const spicyIds = MENU_ITEMS.filter(i => i.spice).map(i => i.id);
    if (spicyIds.length && spicyIds.every(id => state.stats.spicyItems.includes(id))) awardAch('spice_king');
    if (state.secretUnlocked) awardAch('secret_finder');
  };

  const updateStats = (order) => {
    state.stats.totalOrders += 1;
    order.items.forEach(it => {
      const m = MENU_ITEMS.find(x => x.name === it.name);
      if (!m) return;
      if (m.cat === 'Burgers') state.stats.burgersOrdered += it.qty;
      if (m.tags.includes('veggie')) state.stats.veggieOrdered += it.qty;
      if (m.spice && !state.stats.spicyItems.includes(m.id)) state.stats.spicyItems.push(m.id);
    });
    safeSave(K('stats'), state.stats);
    // لا يفتح عدد الطلبات المخزّن محليًا المنيو السري؛ يلزم جلسة خادم صالحة.
  };

  /* ═══════════════════════════════════════════════
     [JS] الطلبات
     ═══════════════════════════════════════════════ */
  let checkingOut = false;
  let trackingTimer = null;

  const computeStatus = (order) => {
    if (!false) return order.status ?? 0;
    if (!order.startedAt) return order.status ?? 3;
    if (order.status === 3) return 3;
    return clamp(Math.floor((Date.now() - order.startedAt) / CONFIG.STATUS_STEP_MS), 0, 3);
  };

  const refreshLive = () => {
    if (!false) return false;
    let changed = false;
    state.orders.forEach(o => {
      if (o.status < 3) {
        const c = computeStatus(o);
        if (c !== o.status) { o.status = c; changed = true; }
      }
    });
    if (changed) safeSave(K('orders'), state.orders);
    return changed;
  };

  const startTracking = () => {
    if (trackingTimer) return;
    trackingTimer = setInterval(async () => {
      let changed = false ? refreshLive() : false;
      const tracked = state.orders.filter(o => o.trackingToken && o.id && o.status < 3);
      for (const o of tracked) {
        try {
          const res = await fetch(`${SB_URL}/functions/v1/track-order`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
            body: JSON.stringify({ order_number: String(o.id), tracking_token: o.trackingToken })
          });
          if (!res.ok) continue;
          const payload = await res.json();
          const remote = payload.order || {};
          const statusMap = { pending: 0, confirmed: 1, preparing: 1, ready: 2, out_for_delivery: 2, delivered: 3, cancelled: 3 };
          const next = statusMap[String(remote.status)] ?? o.status;
          if (next !== o.status || remote.total != null) {
            o.status = next; o.statusLabel = remote.status === 'cancelled' ? 'تم إلغاء الطلب' : null;
            o.total = Number(remote.total ?? o.total); o.subtotal = Number(remote.subtotal ?? o.subtotal);
            o.deliveryFee = Number(remote.delivery_fee ?? o.deliveryFee); o.discountTotal = Number(remote.discount_total ?? 0);
            o.remoteItems = payload.items || []; o.statusHistory = payload.history || [];
            // بيانات المندوب تُرسل فقط بعد تحقق رمز تتبع الطلب من الخادم.
            const nextDriver = payload.driver && payload.driver.phone ? {
              name: String(payload.driver.full_name || 'مندوب التوصيل'),
              phone: String(payload.driver.phone)
            } : null;
            if (JSON.stringify(o.driver || null) !== JSON.stringify(nextDriver)) {
              o.driver = nextDriver;
              changed = true;
            }
            changed = true;
          }
        } catch (e) { console.warn('[Supabase] تعذر تحديث حالة الطلب'); }
      }
      if (changed) { safeSave(K('orders'), state.orders); if (currentRoute() === 'orders') refresh(); }
      if (!state.orders.some(o => o.status < 3 && o.trackingToken) && (!false || !state.orders.some(o => o.status < 3))) { clearInterval(trackingTimer); trackingTimer = null; }
    }, 12000);
  };

  const readForm = () => {
    const map = { name:'fName', phone:'fPhone', area:'fArea', street:'fStreet', building:'fBuilding', floor:'fFloor', apt:'fApt', birthday:'fBirthday' };
    for (const [k, id] of Object.entries(map)) {
      const el = document.getElementById(id);
      if (el) state.customer[k] = el.value.trim().slice(0, 60);
    }
    const c = document.getElementById('coupon');
    if (c) state.couponInput = c.value.trim();
  };

  const validateForm = () => {
    readForm();
    const c = state.customer;
    if (!c.name || c.name.length < 2) return { ok: false, field: 'fName', msg: 'اكتب اسمك بالكامل' };
    const phone = (c.phone || '').replace(/[\s-]/g, '');
    if (!/^\+?\d{8,15}$/.test(phone)) return { ok: false, field: 'fPhone', msg: 'اكتب رقم موبايل صحيح' };
    const req = [['area','fArea','المنطقة'],['street','fStreet','الشارع'],['building','fBuilding','رقم العمارة'],['floor','fFloor','الدور'],['apt','fApt','الشقة']];
    for (const [k, id, label] of req) if (!c[k]) return { ok: false, field: id, msg: `${label} مطلوب` };
    return { ok: true };
  };

  const normalizeEgyptPhone = raw => {
    let p = String(raw || '').replace(/[\s()-]/g, '');
    if (p.startsWith('+20')) p = '0' + p.slice(3);
    else if (p.startsWith('20')) p = '0' + p.slice(2);
    return /^01[0125][0-9]{8}$/.test(p) ? p : null;
  };

  const checkout = async () => {
    if (checkingOut || !state.cart.length) return;
    if (!customerAuthUser) {
      checkoutLoginRequired = true;
      location.hash = '#/profile';
      refresh();
      toast('سجّل دخولك أو أنشئ حسابًا لإتمام الطلب.');
      return;
    }
    checkoutLoginRequired = false;
    readForm();
    maybeApplyBirthday();
    const v = validateForm();
    const err = document.getElementById('ferr');
    if (!v.ok) {
      if (err) err.textContent = v.msg;
      const f = document.getElementById(v.field);
      if (f) f.focus();
      return;
    }
    if (err) err.textContent = '';
    safeSave(K('customer'), state.customer);
    checkingOut = true;
    const btn = document.querySelector('[data-action="checkout"]');
    if (btn) { btn.disabled = true; btn.textContent = 'بنأكد طلبك…'; }
    try {
      if (!sbClient || !liveMenuReady) throw new Error('MENU_NOT_READY');
      const settings = window.SHEEPBURGER_STORE || {};
      if (!settings.is_open || !settings.accepting_orders) throw new Error('STORE_CLOSED');
      if (settings.cash_enabled === false) throw new Error('CASH_PAYMENT_DISABLED');
      const zoneSelect = document.getElementById('fArea');
      const zoneId = zoneSelect?.value;
      const zone = (window.SHEEPBURGER_ZONES || []).find(z => String(z.id) === String(zoneId));
      if (!zone) throw new Error('INVALID_DELIVERY_ZONE');
      const clientSubtotal = calculatePricing(state.cart, { coupon: state.coupon, voucher: selectedRemoteVoucher() }).subtotal;
      const minimumOrder = Math.max(Number(settings.min_order || 0), Number(zone.min_order || 0));
      if (clientSubtotal < minimumOrder) throw new Error('MINIMUM_ORDER_NOT_MET');
      const phone = normalizeEgyptPhone(state.customer.phone);
      if (!phone) throw new Error('INVALID_CUSTOMER_PHONE');
      state.customer.phone = phone;
      const address = [zone.name_ar, state.customer.street, `عمارة ${state.customer.building}`, `الدور ${state.customer.floor}`, `شقة ${state.customer.apt}`].filter(Boolean).join('، ');
      const idempotencyKey = crypto.randomUUID();
      const trackingToken = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(x => x.toString(16).padStart(2, '0')).join('');
      const payload = {
        idempotency_key: idempotencyKey, tracking_token: trackingToken,
        customer_name: state.customer.name.trim(), customer_phone: phone,
        delivery_address: address, zone_id: zone.id,
        notes: '', coupon_code: state.selectedVoucherId ? null : (state.coupon?.code || state.couponInput || null),
        voucher_id: state.selectedVoucherId || null,
        secret_menu_token: state.cart.some(l => ITEM[l.id]?.secret) ? secretMenuToken : null,
        items: state.cart.map(l => {
          const item = ITEM[l.id];
          const addon_ids = (l.addons || []).map(key => ADDONS[key]?.dbId || liveAddonIds[key]).filter(Boolean);
          if ((l.addons || []).length !== addon_ids.length) throw new Error('ADDON_NOT_READY');
          if (!item || !item.sizes.some(z => String(z.key) === String(l.size))) throw new Error('ITEM_OR_SIZE_UNAVAILABLE');
          return { item_id: l.id, size_id: l.size, quantity: l.qty, addon_ids, notes: l.note || null };
        })
      };
      const { data: authSessionData } = sbClient ? await sbClient.auth.getSession() : { data: { session: null } };
      const authHeaders = { 'Content-Type': 'application/json', apikey: SB_KEY };
      if (authSessionData?.session?.access_token) authHeaders.Authorization = `Bearer ${authSessionData.session.access_token}`;
      const response = await fetch(`${SB_URL}/functions/v1/create-order`, {
        method: 'POST', headers: authHeaders, body: JSON.stringify(payload)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.order) {

  const viewNotifications = () => {

      `}
    </div>`;
  };

  const VIEWS = { home: viewHome, menu: viewMenu, cart: viewCart, orders: viewOrders, profile: viewProfile, notifications: viewNotifications };

  /* ═══════════════════════════════════════════════
     [JS] الراوتر
     ═══════════════════════════════════════════════ */
  const currentRoute = () => {
    const r = location.hash.replace(/^#\/?/, '');
    return VIEWS[r] ? r : 'home';
  };
  let lastRoute = null;

  const setActiveNav = r => {
    document.querySelectorAll('[data-nav]').forEach(el => {
      const on = el.dataset.nav === r;
      el.classList.toggle('active', on);
      if (on) el.setAttribute('aria-current', 'page');
      else el.removeAttribute('aria-current');
    });
  };

  const render = () => {
    const r = currentRoute();
    const changed = r !== lastRoute;
    lastRoute = r;
    setActiveNav(r);
    app.classList.remove('instant');
    const y = changed ? 0 : window.scrollY;
    app.innerHTML = VIEWS[r]();
    if (changed) { app.classList.remove('view-anim'); void app.offsetWidth; }
    window.scrollTo(0, y);
    updateBadges();
    Anim.afterRender(changed);
  };

  const refresh = () => {
    readForm();
    const y = window.scrollY;
    app.classList.add('instant');
    const focusId = document.activeElement && document.activeElement.id;
    app.innerHTML = VIEWS[currentRoute()]();
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el && typeof el.focus === 'function') {
        el.focus();
        if (typeof el.setSelectionRange === 'function' && typeof el.value === 'string') {
          try { el.setSelectionRange(el.value.length, el.value.length); } catch {}
        }
      }
    }
    window.scrollTo(0, y);
    updateBadges();
    Anim.afterRender(false);
  };

  /* ═══════════════════════════════════════════════
     [JS] نافذة تفاصيل المنتج
     ═══════════════════════════════════════════════ */
  let lastFocused = null;

  const openItem = (id) => {
    const it = ITEM[id];
    if (!it || (isSecret(it) && !state.secretUnlocked)) return;
    state.draft = { id: it.id, size: it.sizes[0].key, spice: it.spice ? 'وسط' : null, addons: [], note: '', qty: 1, special: null };
    state.reviewStars = 5; state.reviewName = ''; state.reviewText = ''; state.reviewFormOpen = false;
    lastFocused = document.activeElement;
    renderSheet();
    sheet.classList.add('show');
    overlay.classList.add('show');
    sheet.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    const close = sheet.querySelector('.sheet-close');
    if (close) close.focus({ preventScroll: true });
  };

  const closeSheet = () => {
    sheet.classList.remove('show');
    overlay.classList.remove('show');
    sheet.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    state.draft = null;
    if (lastFocused && typeof lastFocused.focus === 'function') { try { lastFocused.focus({ preventScroll: true }); } catch {} }
    lastFocused = null;
  };

  const draftPrice = () => {
    if (!state.draft) return 0;
    return round2(unitPrice({ ...state.draft, qty: 1 }, {}) * state.draft.qty);
  };

  const renderSheet = () => {
    if (!state.draft) return;
    const d = state.draft, it = ITEM[d.id];
    if (!it) return;
    const allergens = [...new Set([...it.allergens, ...d.addons.flatMap(a => ADDONS[a]?.allergens || [])])];
    const reviews = state.ratings[it.id] || [];
    const rating = getRating(it.id);

    sheetBody.innerHTML = `
      <div class="sheet-img">
        <img src="${esc(it.img)}" alt="${esc(it.name)}">
        <button class="sheet-close" data-action="close-sheet" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

        ${it.spice ? `<div class="option-group">
          <h4>درجة الحرارة</h4>

            <span class="opt-label"><strong>${esc(ADDONS[a].name)}</strong>${ADDONS[a].allergens.length ? `<small>بيحتوي على ${ADDONS[a].allergens.map(x => ALLERGENS[x]).join(', ')}</small>` : ''}</span>

        <div class="option-group">

            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:8px">
              <strong style="font-size:13.5px">${esc(r.name)}${r.sessionId === sessionId ? ' <span style="color:var(--success);font-size:11px">✓ انت</span>' : ''}</strong>
              <span style="font-size:11.5px;color:var(--ink-3)">${esc(r.date)}</span>
            </div>
            <div style="color:var(--accent);font-size:13px;margin-bottom:4px;direction:ltr;text-align:right">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</div>

            <textarea id="reviewText" placeholder="رأيك إيه؟ (مطلوب)" maxlength="300" style="width:100%;padding:10px 12px;border-radius:var(--r-xs);border:1px solid var(--line);background:var(--surface);font-size:13.5px;min-height:60px;font-family:inherit;resize:none;margin-bottom:8px">${esc(state.reviewText)}</textarea>
            <div style="display:flex;gap:8px;justify-content:flex-end">

      </div>`;

    const reviewName = document.getElementById('reviewName');
    const reviewText = document.getElementById('reviewText');

  /* ═══════════════════════════════════════════════

     ═══════════════════════════════════════════════ */
  const Anim = {
    lastCount: 0, vals: {}, io: null,

    afterRender(isNewPage) {
      this.reveal(isNewPage);
      const t = app.querySelector('.summary-row.total .num');
      if (t) this.countUp(t, parseFloat(t.textContent) || 0, 'cartTotal');
    },

    reveal(animate) {
      if (this.io) this.io.disconnect();
      const els = [...app.querySelectorAll('.product,.card-block,.featured-deal,.sec-head,.summary,.profile-head')].filter(e => !e.closest('.stagger') && !e.closest('.horizontal'));
      if (reduceMotion.matches || !animate || !('IntersectionObserver' in window)) return;
      let n = 0;
      this.io = new IntersectionObserver(es => es.forEach(en => {
        if (!en.isIntersecting) return;
        en.target.style.setProperty('--d', Math.min(n++ % 6, 5) * 70 + 'ms');
        en.target.classList.add('in');
        this.io.unobserve(en.target);
      }), { threshold: .12, rootMargin: '0px 0px -30px 0px' });
      els.forEach(e => { e.classList.add('reveal'); this.io.observe(e); });
      clearTimeout(this.safe); this.safe = setTimeout(() => els.forEach(e => e.classList.add('in')), 2500);
    },

    countUp(el, to, key) {
      const from = this.vals[key] ?? to;
      this.vals[key] = to;
      if (reduceMotion.matches || from === to) { el.textContent = money(to); return; }
      const t0 = performance.now(), D = 450;
      const step = now => {
        const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
        el.textContent = money(from + (to - from) * e);
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },

    flyToCart(from) {
      if (reduceMotion.matches || !from) return;
      const nav = document.querySelector('.bottom-nav a[data-nav="cart"] .ic');
      const dest = (nav && nav.offsetParent) ? nav : document.querySelector('.actions a[href="#/cart"]');
      if (!dest) return;
      const a = from.getBoundingClientRect(), b = dest.getBoundingClientRect();
      const dot = document.createElement('div');
      dot.className = 'fly-dot'; dot.textContent = '🍔';
      dot.style.left = (a.left + a.width / 2 - 11) + 'px';
      dot.style.top = (a.top + a.height / 2 - 11) + 'px';
      document.body.appendChild(dot);
      const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
      dot.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(.35)`, opacity: .5 }], { duration: 650, easing: 'cubic-bezier(.5,-.2,.6,1)' }).onfinish = () => dot.remove();
    },

    gridSwap() {
      if (reduceMotion.matches) return;
      app.querySelectorAll('[data-grid] .product').forEach((e, i) => {
        e.style.setProperty('--d', Math.min(i, 10) * 45 + 'ms');
        e.classList.add('swap');
      });
      const pill = app.querySelector('.cat-pill.active');
      if (pill) { pill.classList.add('pop'); pill.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); }
    },

    ripple(e) {
      const b = e.target.closest('.btn,.hero-cta,.add-btn');
      if (!b || reduceMotion.matches) return;
      const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height);
      const sp = document.createElement('span');
      sp.className = 'ripple';
      sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
      b.appendChild(sp);
      setTimeout(() => sp.remove(), 650);
    }
  };
  document.addEventListener('pointerdown', e => Anim.ripple(e));

  const swapRefresh = () => {
    const sc = [...app.querySelectorAll('.cats')].map(c => c.scrollLeft);
    refresh();
